/* Two-step remove, so nothing disappears on a single stray tap. */
function RemoveButton({ onConfirm }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => {
    if (!armed) return undefined;
    const t = setTimeout(() => setArmed(false), 4000);
    return () => clearTimeout(t);
  }, [armed]);
  if (armed) {
    return (
      <span style={{ display: 'inline-flex', gap: 8, alignItems: 'center' }}>
        <button onClick={onConfirm} style={{
          background: 'none', border: 'none', color: C.red, fontSize: 12, fontWeight: 700, cursor: 'pointer', padding: 0,
        }}>Remove</button>
        <button onClick={() => setArmed(false)} style={{
          background: 'none', border: 'none', color: C.ink3, fontSize: 12, cursor: 'pointer', padding: 0,
        }}>Keep</button>
      </span>
    );
  }
  return (
    <button title="Remove from journal" onClick={() => setArmed(true)} style={{
      background: 'none', border: 'none', color: C.ink3, fontSize: 15, cursor: 'pointer', padding: '0 4px', lineHeight: 1,
    }}>×</button>
  );
}

/* ========================================================= SIZING UI */
const fmtDollar0 = (v) => (num(v) < 0 ? '-' : '') + '$' + Math.abs(num(v)).toLocaleString('en-US', { maximumFractionDigits: 0 });

/* The arrow points the way the position should move: up to add, down to trim. */
const FLAG_STYLE = {
  over:       { color: C.orange, glyph: '▼', title: 'Bigger than suggested' },
  under:      { color: C.blue,   glyph: '▲', title: 'Smaller than suggested' },
  harvest:    { color: C.green,  glyph: '★', title: 'The market has come to you' },
  noedge:     { color: C.orange, glyph: '◇', title: 'No edge left at this price' },
  belowfloor: { color: C.orange, glyph: '◇', title: 'Conviction below your floor' },
  unrated:    { color: C.gray,   glyph: '?', title: 'No conviction logged yet' },
  ok:         { color: C.green,  glyph: '✓', title: 'On target' },
  pending:    { color: C.blue,   glyph: '◷', title: 'An order is out and has not filled' },
};
const fmtAnn = (v) => (Math.abs(v) >= 1000 ? Math.round(v / 100) * 100 : Math.round(v)).toLocaleString('en-US') + '%/yr';
/* The rate already earned can be negative, so it always carries its sign. */
const fmtAnnSigned = (v) => (num(v) >= 0 ? '+' : '−') + fmtAnn(Math.abs(num(v)));
const fmtPctSigned = (v) => (num(v) >= 0 ? '+' : '−') + Math.abs(num(v)).toFixed(1) + '%';
function FlagMark({ flag, size = 12 }) {
  const f = FLAG_STYLE[flag] || FLAG_STYLE.ok;
  return <span title={f.title} style={{ color: f.color, fontFamily: MONO, fontSize: size, fontWeight: 700 }}>{f.glyph}</span>;
}

/* One line saying what the sizing engine makes of a position. */
function SizingVerdict({ sizing, trade, onSetConviction }) {
  if (!sizing) return null;
  const f = FLAG_STYLE[sizing.flag] || FLAG_STYLE.ok;
  const line = { fontFamily: MONO, fontSize: 11.5, lineHeight: 1.6 };

  if (sizing.flag === 'unrated') {
    return (
      <span style={{ ...line, color: C.gray }}>
        <FlagMark flag="unrated" />{' '}
        <button onClick={onSetConviction} style={{
          background: 'none', border: 'none', color: C.blue, font: 'inherit', cursor: 'pointer', padding: 0,
        }}>set a conviction</button>
      </span>
    );
  }

  /* The market came to you. This is the trade working, so it reads as a
     decision about capital rather than a warning about sizing. */
  if (sizing.flag === 'harvest') {
    return (
      <span style={{ ...line, color: C.ink3, display: 'inline-block' }}>
        <FlagMark flag="harvest" /> <span style={{ color: C.green }}>worked</span>
        {' — change conviction or consider trimming. '}
        {fmtAnn(sizing.holdAnn)} to hold.
        {' '}
        <button onClick={onSetConviction} style={{
          background: 'none', border: 'none', color: C.blue, font: 'inherit', cursor: 'pointer', padding: 0,
        }}>revisit</button>
      </span>
    );
  }

  if (sizing.flag === 'noedge' || sizing.flag === 'belowfloor') {
    return (
      <span title={sizing.reason || ''} style={{ ...line, color: C.orange }}>
        <FlagMark flag={sizing.flag} /> no edge
      </span>
    );
  }
  if (sizing.flag === 'pending') {
    const placed = sizing.order && sizing.order.placedAt
      ? ' · placed ' + fmtDays((Date.now() - sizing.order.placedAt) / 86400000) + ' ago' : '';
    return (
      <span style={{ ...line, color: C.ink3 }}>
        <FlagMark flag="pending" />{' '}
        <span style={{ color: C.blue }}>order out → {fmtDollar0(sizing.pendingTarget)}</span>{placed}
      </span>
    );
  }
  if (sizing.flag === 'ok') {
    return (
      <span title={'On target — inside ' + fmtDollar0(sizing.suggested) + ' by your tolerance'} style={{ ...line }}>
        <FlagMark flag="ok" />
      </span>
    );
  }
  return (
    <span style={{ ...line, color: C.ink3 }}>
      <FlagMark flag={sizing.flag} />{' '}
      <span style={{ color: f.color }}>
        {(sizing.flag === 'over' ? 'trim ' : 'add ') + fmtDollar0(Math.abs(sizing.delta))}
      </span>
      {' → ' + fmtDollar0(sizing.suggested)}
    </span>
  );
}

/* Markets that are the same question at a different end date share one
   position's worth of money, so the row says so and gives the family total.
   Without it the split looks like the engine arbitrarily halving a position. */
function FamilyChip({ sizing, book, trades }) {
  if (!sizing || !(sizing.familySize > 1)) return null;
  const fam = book && book.families && book.families[sizing.family];
  const names = fam && Array.isArray(trades)
    ? fam.keys.map((k) => {
      const o = trades.find((x) => x.key === k);
      return o ? '· ' + o.title : null;
    }).filter(Boolean) : null;
  const manual = !!sizing.familyManual;
  const title = (manual
    ? 'One group of ' + sizing.familySize + ' markets.'
    : 'Same market, ' + sizing.familySize + ' end dates.') +
    ' They share one position: together they hold ' + fmtDollar0(fam ? fam.actual : 0) +
    ' against a target of ' + fmtDollar0(fam ? fam.suggested : 0) + '.' +
    (names && names.length ? '\n\n' + names.join('\n') : '');
  return (
    <span title={title} style={{
      flexShrink: 0, fontFamily: MONO, fontSize: 10.5, fontWeight: 700, letterSpacing: 0.3,
      color: manual ? C.blue : C.ink3, background: manual ? C.blue + '12' : C.cardAlt,
      border: '1px solid ' + (manual ? C.blue + '33' : C.border),
      borderRadius: 4, padding: '1px 5px',
    }}>{manual ? 'GROUP OF ' + sizing.familySize : sizing.familySize + ' DATES'}
      {fam ? ' · ' + fmtDollar0(fam.suggested) : ''}</span>
  );
}

function SizingCard({ book, settings, onOpenSettings }) {
  const pct = Math.max(0, Math.min(100, book.deployedPct));
  const target = Math.max(0, Math.min(100, book.suggestedPct));
  const ceiling = Math.max(0, Math.min(100, book.ceilingPct));
  return (
    <Card>
      <SectionTitle right={
        <button onClick={onOpenSettings} style={{ background: 'none', border: 'none', color: C.blue, fontSize: 11.5, fontWeight: 700, cursor: 'pointer', padding: 0 }}>
          Adjust
        </button>
      }>Position sizing</SectionTitle>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(132px, 1fr))', gap: 12, marginBottom: 16 }}>
        {[
          { l: 'Portfolio', v: fmtDollar0(book.total), c: C.ink, s: 'cash + positions' },
          { l: 'In positions', v: fmtDollar0(book.deployed), c: C.ink, s: book.deployedPct.toFixed(0) + '% deployed' },
          { l: 'Cash left', v: fmtDollar0(book.cash), c: book.cash > 0 ? C.ink2 : C.amber, s: book.cashPct.toFixed(0) + '% of portfolio' },
          { l: 'Kelly suggests', v: fmtDollar0(book.suggestedTotal), c: C.blue, s: book.suggestedPct.toFixed(0) + '% of portfolio' },
          { l: 'Flagged', v: String(book.flagged), c: book.flagged ? C.amber : C.green, s: 'off target by more than ' + num(settings.tolPct, 15) + '% or $' + num(settings.tolDollar, 10) },
          { l: 'Ready to harvest', v: String(book.harvestable), c: book.harvestable ? C.green : C.ink3, s: 'market came to you' },
        ].map((x) => (
          <div key={x.l}>
            <div style={{ fontSize: 11, letterSpacing: 0.8, textTransform: 'uppercase', color: C.ink3, fontWeight: 700 }}>{x.l}</div>
            <div style={{ fontFamily: MONO, fontSize: 21, fontWeight: 600, color: x.c, marginTop: 5 }}>{x.v}</div>
            <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 2 }}>{x.s}</div>
          </div>
        ))}
      </div>

      {/* deployed is the fill; ceiling and Kelly target are markers, so none
          of the three can hide another whichever is largest */}
      <div style={{ position: 'relative', height: 10, background: C.border, borderRadius: 5 }}>
        <div style={{
          position: 'absolute', top: 0, bottom: 0, left: 0, width: pct + '%',
          background: book.overCeiling ? C.amber : C.ink2, opacity: 0.9, borderRadius: 5,
        }} />
        <div title={'Your ceiling: ' + ceiling + '%'} style={{
          position: 'absolute', top: -4, bottom: -4, left: 'calc(' + ceiling + '% - 1px)',
          width: 2, background: C.ink3, borderRadius: 1,
        }} />
        <div title={'Kelly suggests ' + target.toFixed(0) + '%'} style={{
          position: 'absolute', top: -4, bottom: -4, left: 'calc(' + target + '% - 1px)',
          width: 2, background: C.blue, borderRadius: 1,
        }} />
      </div>
      <div style={{ display: 'flex', gap: 16, fontSize: 11.5, color: C.ink3, marginTop: 9, fontFamily: MONO, flexWrap: 'wrap' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <span style={{ width: 9, height: 9, borderRadius: 2, background: book.overCeiling ? C.amber : C.ink2, display: 'inline-block' }} />
          deployed {book.deployedPct.toFixed(0)}%
        </span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <span style={{ width: 2, height: 11, background: C.ink3, display: 'inline-block' }} />
          your ceiling {ceiling}%
        </span>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, color: C.blue }}>
          <span style={{ width: 2, height: 11, background: C.blue, display: 'inline-block' }} />
          Kelly target {book.suggestedPct.toFixed(0)}%
        </span>
      </div>

      {book.untrackedValue > 1 && (
        <div style={{ fontSize: 12, color: C.ink3, marginTop: 11, lineHeight: 1.5 }}>
          {fmtDollar0(book.untrackedValue)} of that sits in positions you chose not to journal. It still counts
          as deployed capital, so the sizing maths accounts for it.
        </div>
      )}

      {book.scaled && (
        <div style={{ fontSize: 12, color: C.amber, marginTop: 10, lineHeight: 1.5 }}>
          Kelly scaled down by {((1 - book.scale) * 100).toFixed(0)}%.
        </div>
      )}
    </Card>
  );
}

/* Click-to-edit number, used for conviction in the trades table. */
function InlineNumber({ value, onSave, suffix = '%', min = 1, max = 99, width = 52 }) {
  const [editing, setEditing] = useState(false);
  const [v, setV] = useState(value == null ? '' : String(value));
  useEffect(() => { setV(value == null ? '' : String(value)); }, [value]);

  const commit = () => {
    const n = parseFloat(v);
    setEditing(false);
    if (!Number.isFinite(n) || n < min || n > max) { setV(value == null ? '' : String(value)); return; }
    if (n !== value) onSave(n);
  };

  if (!editing) {
    return (
      <button onClick={() => setEditing(true)} title="Click to edit" style={{
        background: 'none', border: '1px dashed transparent', borderRadius: 4, padding: '1px 3px',
        color: value == null ? C.ink3 : C.ink2, fontFamily: MONO, fontSize: 12.5, cursor: 'text',
      }}
        onMouseEnter={(e) => { e.currentTarget.style.borderColor = C.border; }}
        onMouseLeave={(e) => { e.currentTarget.style.borderColor = 'transparent'; }}>
        {value == null ? '—' : value + suffix}
      </button>
    );
  }
  return (
    <input
      autoFocus type="number" value={v} min={min} max={max}
      onChange={(e) => setV(e.target.value)}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { setV(String(value)); setEditing(false); } }}
      style={{
        width, background: C.bg, border: '1px solid ' + C.blue, borderRadius: 4,
        color: C.ink, fontFamily: MONO, fontSize: 12.5, padding: '2px 4px', outline: 'none',
      }}
    />
  );
}

/* A bias check on a number you typed yourself. Six rows, four colours, all
   green until you touch them — so it is silent unless you want it. A colour
   costs the same wherever it appears, which is what lets the rows go without
   any text of their own. */
const CHECK_LEVELS = { g: 0, y: 0.02, o: 0.05, r: 0.10 };
/* Swatches are filled blocks, not text, so they can be brighter than the
   palette's text-safe green and amber without hurting legibility. */
const CHECK_COLOUR = { g: '#16A34A', y: '#E3A008', o: '#EA580C', r: '#DC2626' };
const CHECK_ROWS = [
  { id: 'evidence', label: 'Evidence',
    g: 'hard evidence, primary sources', y: 'good reporting, several sources',
    o: 'one source, or my own inference', r: 'mostly a hunch' },
  { id: 'field', label: 'The field',
    g: 'it is my field', y: 'I know it well',
    o: 'I follow it loosely', r: 'new to me' },
  { id: 'rules', label: 'Resolution rules',
    g: 'airtight, source named', y: 'one grey area',
    o: 'loose wording', r: 'vague or subjective' },
  { id: 'clock', label: 'The clock',
    g: 'with me, or the date is a snapshot', y: 'something must happen, there is room',
    o: "today's situation has to survive", r: 'something must happen, window is tight' },
  { id: 'blindside', label: 'Blindside',
    g: 'I would see it in time to act', y: 'I would find out within a day',
    o: 'I would be late', r: 'I would learn it when the price moved' },
  { id: 'edge', label: 'Where the edge is',
    g: 'I know something they do not', y: 'the price is stale',
    o: 'the crowd is biased here', r: 'I cannot explain it' },
];
const checkKeep = (check) => CHECK_ROWS.reduce(
  (a, r) => a * (1 - num(CHECK_LEVELS[(check || {})[r.id] || 'g'])), 1);

function ConvictionCheck({ value, check, onCheck, onUse }) {
  const c = check || {};
  const keep = checkKeep(c);
  const call = num(value);
  const suggested = Math.max(1, Math.min(97, Math.round(call * keep)));
  const clean = keep > 0.9999;
  return (
    <div style={{ marginTop: 4, marginBottom: 18, border: '1px solid ' + C.border,
      borderRadius: 10, padding: '12px 14px 10px', background: C.cardAlt }}>
      <div style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase',
        color: C.ink3, fontWeight: 700, marginBottom: 8 }}>
        Check it <span style={{ textTransform: 'none', letterSpacing: 0, fontWeight: 400,
          color: C.gray }}>— optional</span>
      </div>
      {CHECK_ROWS.map((r) => (
        <div key={r.id} style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) auto',
          gap: 12, alignItems: 'center', padding: '5px 0' }}>
          <span style={{ fontSize: 13, color: C.ink2 }}>{r.label}</span>
          <span style={{ display: 'flex', gap: 6 }}>
            {['g', 'y', 'o', 'r'].map((l) => {
              const on = (c[r.id] || 'g') === l;
              return (
                <button key={l} type="button" title={r[l]}
                  onClick={() => onCheck({ ...c, [r.id]: l })}
                  style={{ width: 32, height: 26, borderRadius: 6, cursor: 'pointer',
                    border: '1px solid ' + (on ? C.ink2 : C.border),
                    background: on ? CHECK_COLOUR[l] : CHECK_COLOUR[l] + '26',
                    padding: 0 }} />
              );
            })}
          </span>
        </div>
      ))}
      <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid ' + C.border,
        display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
        {clean ? (
          <span style={{ fontSize: 12.5, color: C.ink3 }}>
            All clear — nothing to suggest.
          </span>
        ) : (
          <>
            <span style={{ fontFamily: MONO, fontSize: 22, fontWeight: 600,
              color: suggested >= 80 ? C.green : suggested >= 55 ? C.blue : C.orange }}>
              {suggested}%
            </span>
            <span style={{ fontSize: 12.5, color: C.ink3 }}>
              suggested · {Math.round((1 - keep) * 100)}% of your {Math.round(call)} is doubt
            </span>
            <span style={{ flex: 1 }} />
            <Btn kind="primary" onClick={() => onUse(suggested)}>Use {suggested}%</Btn>
            <Btn kind="ghost" onClick={() => onCheck({})}>Reset</Btn>
          </>
        )}
      </div>
    </div>
  );
}

/* Everything about one trade that the sizing engine needs. */
/* Every group in the open book, as the UI wants to read it: a name you can
   write onto another market to join it, a label, and who is in it. Markets
   whose title says nothing once the dates come out cannot be joined by name,
   so they are left out of the picker rather than offered and then failing. */
function groupsOf(trades, book, exceptKey) {
  const by = {};
  (trades || []).forEach((o) => {
    if (o.status !== 'open' || o.key === exceptKey) return;
    const name = Engine.familyNameOf(o);
    if (name === Engine.FAMILY_ALONE) return;
    if (!by[name]) by[name] = { name, members: [] };
    by[name].members.push(o);
  });
  return Object.keys(by).map((name) => {
    const g = by[name];
    /* The shortest title with its date clause cut off: "US announces end of
       Iranian blockade", not "…by December 31?", which would name the group
       after one of its members. */
    const label = Engine.trimDate(
      g.members.slice().sort((a, b) => a.title.length - b.title.length)[0].title);
    const fam = book && book.families && book.families[name];
    return {
      name, label, members: g.members, manual: !!(fam && fam.manual),
      target: fam ? fam.suggested : (book && book.results[g.members[0].key]
        ? book.results[g.members[0].key].suggested : 0),
    };
  }).sort((a, b) => b.members.length - a.members.length || a.label.localeCompare(b.label));
}

/* Which markets this one shares a position with. Date ladders find each
   other; anything else is one tap. There is no conviction here on purpose —
   a group shares money, not a belief, because its members are probabilities
   of different events and averaging them would describe no event at all. */
function GroupField({ trade, trades, book, value, onChange }) {
  const [picking, setPicking] = useState(false);
  const mine = Engine.familyIdOf({ ...trade, family: (value || '').trim() || null });
  const mates = (trades || []).filter((o) => o.status === 'open' && o.key !== trade.key &&
    Engine.familyIdOf(o) === mine);
  const fam = book && book.families && book.families[mine];
  const groups = useMemo(() => groupsOf(trades, book, trade.key), [trades, book, trade.key]);
  const manual = (value || '').trim() !== '' && (value || '').trim() !== Engine.FAMILY_ALONE;
  const alone = (value || '').trim() === Engine.FAMILY_ALONE;

  const line = { fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 4 };
  return (
    <Field label="Shares a position with"
      hint={'A group holds one position between it, so adding a market here does not buy more ' +
        'of the idea — it splits what the idea was already allowed. Markets asking the same ' +
        'question at different end dates find each other on their own.'}>
      <div data-group-box style={{ border: '1px solid ' + C.border, borderRadius: 8,
        background: C.cardAlt, padding: '11px 13px' }}>
        {mates.length ? (
          <div>
            <div style={{ fontSize: 13, color: C.ink, fontWeight: 600 }}>
              {mates.length + 1} markets{manual ? '' : ' · same question, different end dates'}
            </div>
            {mates.map((o) => (
              <div key={o.key} style={{ fontSize: 12.5, color: C.ink2, marginTop: 5,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>· {o.title}</div>
            ))}
            {fam && (
              <div style={line}>
                holding {fmtDollar0(fam.actual)} against a target of {fmtDollar0(fam.suggested)} between them
              </div>
            )}
          </div>
        ) : (
          <div style={{ fontSize: 13, color: C.ink3 }}>
            {alone ? 'Kept separate by hand — no date ladder will pick it up.' : 'On its own.'}
          </div>
        )}
      </div>

      <div style={{ display: 'flex', gap: 8, marginTop: 9, flexWrap: 'wrap' }}>
        <Btn onClick={() => setPicking(!picking)}>{picking ? 'Cancel' : 'Group with…'}</Btn>
        {mates.length > 0 && (
          <Btn data-group-split onClick={() => { onChange(Engine.FAMILY_ALONE); setPicking(false); }}>
            Keep this one separate
          </Btn>
        )}
        {(manual || alone) && (
          <Btn kind="ghost" onClick={() => { onChange(''); setPicking(false); }}>Back to automatic</Btn>
        )}
      </div>

      {picking && (
        <div data-group-picker style={{ marginTop: 10, border: '1px solid ' + C.border,
          borderRadius: 8, maxHeight: 260, overflowY: 'auto' }}>
          {groups.length === 0 && (
            <div style={{ padding: 12, fontSize: 12.5, color: C.ink3 }}>Nothing else is open.</div>
          )}
          {groups.map((g, i) => {
            const on = g.name === mine;
            return (
              <button key={g.name} data-group-option={g.name} type="button"
                onClick={() => { onChange(on ? '' : g.name); setPicking(false); }}
                style={{ display: 'block', width: '100%', textAlign: 'left', cursor: 'pointer',
                  background: on ? C.blue + '10' : 'transparent', border: 'none',
                  borderTop: i === 0 ? 'none' : '1px solid ' + C.border, padding: '10px 12px' }}>
                <div style={{ fontSize: 13, color: on ? C.blue : C.ink, fontWeight: 600,
                  whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                  {on ? '✓ ' : ''}{g.label}
                </div>
                <div style={{ fontFamily: MONO, fontSize: 11, color: C.ink3, marginTop: 3 }}>
                  {/* The list leaves this market out, so the group it is already
                      in has to count itself back in or it reads as empty. */}
                  {on ? 'the group this one is in · ' + (g.members.length + 1) + ' markets'
                    : g.members.length === 1 ? 'on its own' : g.members.length + ' markets'}
                  {' · target ' + fmtDollar0(g.target)}
                  {g.manual ? ' · grouped by hand' : ''}
                </div>
              </button>
            );
          })}
        </div>
      )}
    </Field>
  );
}

function TradeEditorModal({ trade, sizing, settings, trades, walletValue, onSave, onClose }) {
  const [d, setD] = useState({
    myProbability: trade.myProbability == null ? '' : String(trade.myProbability),
    check: trade.check && typeof trade.check === 'object' ? { ...trade.check } : {},
    mode: trade.mode === 'spike' ? 'spike' : 'resolution',
    exitTarget: trade.exitTarget == null ? '' : String(trade.exitTarget),
    stopPrice: trade.stopPrice == null ? '' : String(trade.stopPrice),
    expectedDays: trade.expectedDays == null ? '' : String(trade.expectedDays),
    daysOverride: trade.daysOverride == null ? '' : String(trade.daysOverride),
    family: typeof trade.family === 'string' ? trade.family : '',
    overnight: !!trade.overnight,
    entryPrice: num(trade.entryPrice) > 0 ? String(num(trade.entryPrice)) : '',
    entryDate: trade.entryDate ? new Date(trade.entryDate).toISOString().slice(0, 10) : '',
  });
  const set = (k, v) => setD((s) => ({ ...s, [k]: v }));
  const spike = d.mode === 'spike';

  const prob = parseFloat(d.myProbability);
  const probOk = Number.isFinite(prob) && prob >= 1 && prob <= 99;
  const tgt = parseFloat(d.exitTarget), stp = parseFloat(d.stopPrice), edays = parseFloat(d.expectedDays);
  const spikeOk = !spike || (
    Number.isFinite(tgt) && tgt > num(trade.currentPrice) && tgt <= 100 &&
    Number.isFinite(stp) && stp >= 0 && stp < num(trade.currentPrice) &&
    Number.isFinite(edays) && edays > 0
  );
  const entryTyped = parseFloat(d.entryPrice);
  const entryChanged = Number.isFinite(entryTyped) && entryTyped > 0 && entryTyped <= 100 &&
    Math.abs(entryTyped - num(trade.entryPrice)) > 0.001;

  const dateWas = trade.entryDate ? new Date(trade.entryDate).toISOString().slice(0, 10) : '';
  const dateTyped = d.entryDate && new Date(d.entryDate + 'T12:00:00Z');
  const dateOk = !d.entryDate || (dateTyped instanceof Date && !isNaN(dateTyped) && dateTyped <= new Date());
  const dateChanged = dateOk && d.entryDate && d.entryDate !== dateWas;

  const valid = probOk && spikeOk && dateOk;

  const build = () => ({
    myProbability: prob,
    check: d.check && Object.keys(d.check).length ? d.check : null,
    ...(entryChanged ? { entryPrice: entryTyped, entryPriceManual: true, entryPriceEstimated: false } : {}),
    ...(dateChanged ? { entryDate: dateTyped.toISOString(), entryDateManual: true, entryDateSource: 'manual' } : {}),
    mode: d.mode,
    exitTarget: spike ? tgt : null,
    stopPrice: spike ? stp : null,
    expectedDays: spike ? edays : null,
    daysOverride: d.daysOverride === '' ? null : parseFloat(d.daysOverride),
    family: d.family.trim() === '' ? null : d.family.trim(),
    overnight: d.overnight,
  });

  /* Price this edit the same way the dashboard prices it: through the whole
     book, with the edited version of this trade swapped in. Sizing one trade
     on its own would ignore the portfolio's capital base and the scale-down
     that applies when the book as a whole is over-committed, so the number
     here would quietly disagree with the number on the trade card. */
  const preview = useMemo(() => {
    if (!valid) return null;
    try {
      const edited = { ...trade, ...build() };
      const book = Array.isArray(trades) && trades.length
        ? trades.map((t) => (t.key === trade.key ? edited : t))
        : [edited];
      const res = Engine.sizeBook(book, settings, undefined, walletValue);
      if (res.results[trade.key]) return res.results[trade.key];
      const solo = Engine.sizeOne(edited, settings, []);
      return { ...solo, suggested: solo.halfK };
    } catch (e) { return null; }
  }, [d, valid, trades, settings, walletValue]);

  /* The same book again, but only tracking the group field, so the picker can
     show what each group is worth right now without re-pricing on every
     keystroke in the conviction box. */
  const liveBook = useMemo(() => {
    try {
      const edited = { ...trade, family: d.family.trim() === '' ? null : d.family.trim() };
      const list = Array.isArray(trades) && trades.length
        ? trades.map((t) => (t.key === trade.key ? edited : t))
        : [edited];
      return Engine.sizeBook(list, settings, undefined, walletValue);
    } catch (e) { return null; }
  }, [d.family, trade, trades, settings, walletValue]);

  return (
    <Modal title="Edit trade" subtitle={trade.title} onClose={onClose} width={560}>
      <Field
        label={spike ? 'Confidence it reaches your target' : 'My win probability'}
        hint={spike
          ? (Number.isFinite(tgt) && tgt > num(trade.currentPrice)
            ? 'How sure are you the price gets from ' + num(trade.currentPrice).toFixed(0) + '¢ to ' + tgt.toFixed(0) + '¢? Nothing to do with how it finally resolves.'
            : 'How sure are you the price reaches your sell target? Nothing to do with how it finally resolves.')
          : 'Your odds this market resolves in your favour. Market implies ' + num(trade.currentPrice).toFixed(0) + '%.'}>
        <input type="number" min="1" max="99" value={d.myProbability}
          onChange={(e) => set('myProbability', e.target.value)}
          style={{ ...inputStyle, fontFamily: MONO, fontSize: 16 }} />
      </Field>

      {Number.isFinite(parseFloat(d.myProbability)) && (
        <ConvictionCheck value={parseFloat(d.myProbability)} check={d.check}
          onCheck={(v) => set('check', v)}
          onUse={(v) => setD((x) => ({ ...x, myProbability: String(v), check: {} }))} />
      )}

      <Field label="Trade type">
        <div style={{ display: 'grid', gap: 7 }}>
          {[
            { v: 'resolution', l: 'Hold to resolution', d: 'I think this market ends my way.' },
            { v: 'spike', l: 'Spike trade', d: 'I expect a price move and plan to sell into it, whatever the market eventually resolves to.' },
          ].map((o) => (
            <button key={o.v} type="button" onClick={() => set('mode', o.v)} style={{
              textAlign: 'left', background: d.mode === o.v ? C.blue + '14' : C.bg,
              border: '1px solid ' + (d.mode === o.v ? C.blue : C.border),
              borderRadius: 7, padding: '10px 12px', cursor: 'pointer',
            }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: d.mode === o.v ? C.ink : C.ink2 }}>{o.l}</div>
              <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 3, lineHeight: 1.45 }}>{o.d}</div>
            </button>
          ))}
        </div>
      </Field>

      {spike && (
        <div style={{ background: C.bg, border: '1px solid ' + C.border, borderRadius: 8, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 12, color: C.ink3, marginBottom: 12, lineHeight: 1.5 }}>
            Currently {num(trade.currentPrice).toFixed(1)}¢. All three are required — without an exit-if-wrong price
            the maths has no downside to size against.
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 10 }}>
            <Field label="Sell target ¢">
              <input type="number" min="1" max="100" value={d.exitTarget} onChange={(e) => set('exitTarget', e.target.value)}
                style={{ ...inputStyle, fontFamily: MONO }} />
            </Field>
            <Field label="Exit if wrong ¢" hint="0 = ride it down">
              <input type="number" min="0" max="99" value={d.stopPrice} onChange={(e) => set('stopPrice', e.target.value)}
                style={{ ...inputStyle, fontFamily: MONO }} />
            </Field>
            <Field label="Days to the move">
              <input type="number" min="0.5" step="0.5" value={d.expectedDays} onChange={(e) => set('expectedDays', e.target.value)}
                style={{ ...inputStyle, fontFamily: MONO }} />
            </Field>
          </div>
          {!spikeOk && (d.exitTarget || d.stopPrice || d.expectedDays) && (
            <div style={{ fontSize: 12, color: C.red, lineHeight: 1.5 }}>
              Target must be above {num(trade.currentPrice).toFixed(1)}¢, exit-if-wrong below it, and days above zero.
            </div>
          )}
        </div>
      )}

      {!spike && (
        <Field label="Days to resolution — override" hint={trade.endDate
          ? 'Leave blank to use the market end date (' + new Date(trade.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ').'
          : 'This market has no end date in the Polymarket data, so ' + settings.defaultDays + ' days is assumed.'}>
          <input type="number" min="0.5" step="0.5" value={d.daysOverride} onChange={(e) => set('daysOverride', e.target.value)}
            placeholder="auto" style={{ ...inputStyle, fontFamily: MONO }} />
        </Field>
      )}

      <GroupField trade={trade} trades={trades} book={liveBook}
        value={d.family} onChange={(v) => set('family', v)} />

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 10 }}>
        <Field label="What you actually paid ¢"
          hint={trade.entryPriceManual
            ? 'You set this by hand, so syncing will leave it alone.'
            : trade.entryPriceSource === 'fills'
              ? 'Worked out from your actual purchases — the ' + (trade.entryTranches || 1) +
                ' most recent fill' + ((trade.entryTranches || 1) === 1 ? '' : 's') +
                ' that make up the shares you hold now.' +
                (num(trade.apiAvg) > 0 && Math.abs(num(trade.apiAvg) - num(trade.entryPrice)) > 1
                  ? ' Polymarket’s own average says ' + num(trade.apiAvg).toFixed(1) +
                    '¢, which counts shares from earlier positions you have since closed.'
                  : '')
            : trade.entryPriceSource === 'fills-partial'
              ? num(trade.entryUnbought).toFixed(0) + ' of your ' + num(trade.size).toFixed(0) +
                ' shares have no purchase behind them — they arrived by conversion or split. ' +
                'The price shown covers only the shares you actually bought.'
            : trade.entryPriceEstimated
              ? 'No purchase history found for this one, so the price at the time of the sync is standing in. Correct it here if you know better.'
              : 'Polymarket’s average. It counts every share you have ever bought in this market, so if you traded it before and closed out, it reads too low. Correct it here.'}>
          <input type="number" min="0.1" max="100" step="0.1" value={d.entryPrice}
            onChange={(e) => set('entryPrice', e.target.value)}
            style={{ ...inputStyle, fontFamily: MONO }} />
        </Field>
        <Field label="When you bought it"
          hint={trade.entryDateSource === 'polymarket'
            ? 'Your real fill date, from Polymarket.'
            : (trade.entryDateManual
              ? 'You set this by hand, so syncing will leave it alone.'
              : 'This journal has not found your real fill yet, so it is using the day it first saw the position. That makes the hold look shorter than it was.')}>
          <input type="date" value={d.entryDate} max={new Date().toISOString().slice(0, 10)}
            onChange={(e) => set('entryDate', e.target.value)}
            style={{ ...inputStyle, fontFamily: MONO }} />
        </Field>
      </div>
      {!dateOk && (
        <div style={{ fontSize: 12, color: C.red, marginTop: -8, marginBottom: 14 }}>
          You cannot have bought it in the future.
        </div>
      )}

      <label style={{ display: 'flex', gap: 10, alignItems: 'center', cursor: 'pointer', marginBottom: 18 }}>
        <input type="checkbox" checked={d.overnight} onChange={(e) => set('overnight', e.target.checked)} />
        <span style={{ fontSize: 13, color: C.ink2 }}>Overnight risk — shave 5 points off conviction, cap at {settings.overnightCap}% of capital</span>
      </label>

      {preview && (
        <div style={{ background: C.bg, border: '1px solid ' + C.border, borderRadius: 8, padding: 13, marginBottom: 16 }}>
          <div style={{ fontSize: 11, letterSpacing: 0.8, textTransform: 'uppercase', color: C.ink3, fontWeight: 700, marginBottom: 8 }}>
            Suggested size with these settings
          </div>
          <div style={{ fontFamily: MONO, fontSize: 22, fontWeight: 600, color: preview.suggested > 0 ? C.blue : C.ink3 }}>
            {preview.suggested > 0 ? fmtDollar0(preview.suggested) : '—'}
            {preview.capped && <span style={{ fontSize: 12, color: C.amber, marginLeft: 8 }}>at cap</span>}
          </div>
          <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 6, lineHeight: 1.7 }}>
            {preview.reason ? preview.reason : (
              <React.Fragment>
                Kelly {(preview.rawK * 100).toFixed(0)}% × certainty {preview.cert.toFixed(2)} × time {preview.tf.toFixed(2)}

                {d.mode === 'spike' ? ' × spike haircut ' + settings.spikeHaircut : ''}
              </React.Fragment>
            )}
          </div>
        </div>
      )}

      <div style={{ display: 'flex', gap: 10 }}>
        <Btn kind="primary" full disabled={!valid} onClick={() => onSave(build())}>Save</Btn>
        <Btn kind="ghost" onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

/* First sync against an established wallet. Rather than interrogating the
   trader about every position it finds, show everything and let them pick. */
/* ============================================================== REVIEW

   A pass over the positions that are off target, one card at a time,
   biggest dollar gap first. The targets are frozen for the whole pass on
   purpose: the moment one position changes size every other target moves,
   and re-sizing after each decision would have you chasing numbers that
   shift under your hand. The arithmetic at the foot of the card is live;
   the targets are not. One sync at the end rewrites everything.
   ===================================================================== */
const ACTION_LABEL = { done: 'done', order: 'order out', ignore: 'skipped' };

function reviewCards(trades) {
  return trades
    .filter((t) => t.status === 'open' && t.sizing && t.sizing.needsReview)
    .map((t) => {
      const z = t.sizing;
      const unrated = z.flag === 'unrated';
      return {
        key: t.key, trade: t, sizing: z, unrated,
        actual: num(z.actual),
        target: unrated ? null : num(z.suggested),
        gap: unrated ? 0 : num(z.suggested) - num(z.actual),
      };
    })
    /* Biggest dollar gap first, so quitting after six cards still captures
       most of what the pass was worth. Unrated positions trail behind. */
    .sort((a, b) => (a.unrated !== b.unrated ? (a.unrated ? 1 : -1)
      : Math.abs(b.gap) - Math.abs(a.gap)));
}

function ReviewModal({ trades, book, settings, onFinish, onClose }) {
  /* Frozen at mount. This is the point of the whole screen. */
  const [cards] = useState(() => reviewCards(trades));
  const [idx, setIdx] = useState(0);
  const [decisions, setDecisions] = useState({});
  const [targets, setTargets] = useState(() => {
    const o = {};
    reviewCards(trades).forEach((c) => { if (!c.unrated) o[c.key] = Math.round(c.target); });
    return o;
  });
  const [convictions, setConvictions] = useState({});

  const done = idx >= cards.length;
  const card = done ? null : cards[idx];

  /* Live arithmetic over the decisions taken so far, against frozen targets. */
  const running = useMemo(() => {
    let freed = 0, spent = 0, acted = 0;
    cards.forEach((c) => {
      const d = decisions[c.key];
      if (!d || d.action === 'ignore' || c.unrated) return;
      acted += 1;
      const move = num(targets[c.key]) - c.actual;
      if (move < 0) freed += -move; else spent += move;
    });
    const left = cards.filter((c) => !decisions[c.key] && !c.unrated &&
      num(targets[c.key]) > c.actual).length;
    return { freed, spent, acted, left };
  }, [cards, decisions, targets]);

  const decide = (action) => {
    if (!card) return;
    setDecisions((d) => ({ ...d, [card.key]: { action, target: num(targets[card.key]) } }));
    setIdx((i) => i + 1);
  };

  if (!cards.length) {
    return (
      <Modal title="Nothing to review" onClose={onClose} width={460}
        subtitle="Every position is inside your tolerance of its target. Nothing needs touching.">
        <Btn kind="primary" full onClick={onClose}>Close</Btn>
      </Modal>
    );
  }

  if (done) {
    const list = cards.filter((c) => decisions[c.key]);
    return (
      <Modal title="Review finished" onClose={onClose} width={520}
        subtitle={running.acted ? 'Syncing will read your real positions back and re-work every target.'
          : 'Nothing was changed.'}>
        <div style={{ maxHeight: 300, overflowY: 'auto', marginBottom: 16 }}>
          {list.map((c) => {
            const d = decisions[c.key];
            return (
              <div key={c.key} style={{ display: 'flex', gap: 10, alignItems: 'center',
                padding: '7px 0', borderBottom: '1px solid ' + C.border, fontSize: 12.5 }}>
                <span style={{ flex: 1, minWidth: 0, color: C.ink2, whiteSpace: 'nowrap',
                  overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.trade.title}</span>
                <span style={{ fontFamily: MONO, fontSize: 11.5, flexShrink: 0,
                  color: d.action === 'ignore' ? C.ink3 : d.action === 'order' ? C.blue : C.green }}>
                  {ACTION_LABEL[d.action]}{d.action === 'ignore' ? '' : ' · ' + fmtDollar0(d.target)}
                </span>
              </div>
            );
          })}
          {!list.length && <div style={{ fontSize: 13, color: C.ink3 }}>No decisions recorded.</div>}
        </div>
        <div style={{ display: 'flex', gap: 9 }}>
          <Btn onClick={() => setIdx(0)}>Go back</Btn>
          <div style={{ flex: 1 }} />
          <Btn kind="primary" onClick={() => onFinish(decisions, targets, convictions)}>
            Sync and finish
          </Btn>
        </div>
      </Modal>
    );
  }

  const t = card.trade;
  const z = card.sizing;
  const price = num(t.currentPrice);
  const target = num(targets[card.key]);
  const move = target - card.actual;
  const shares = price > 0 ? Math.abs(move) / (price / 100) : 0;
  const trimming = move < 0;

  const bump = (by) => setTargets((o) => ({
    ...o, [card.key]: Math.max(0, Math.round(num(o[card.key]) + by)) }));

  return (
    <Modal onClose={onClose} width={540}
      title={<span style={{ fontFamily: MONO, fontSize: 12.5, color: C.ink3, fontWeight: 600 }}>
        {(idx + 1) + ' of ' + cards.length}
      </span>}>

      <div data-review-card={t.key} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginBottom: 12 }}>
        <MarketIcon trade={t} size={34} />
        <div style={{ minWidth: 0, flex: 1 }}>
          <MarketLink trade={t} style={{ display: 'block', fontSize: 14.5, fontWeight: 600,
            color: C.ink, lineHeight: 1.4 }} />
          <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 5,
            display: 'flex', gap: 7, flexWrap: 'wrap', alignItems: 'center' }}>
            <OutcomeBadge outcome={t.outcome} />
            <span>{fmtDays(z.days)}</span>
            <span>· {fmtAnn(z.holdAnn)}</span>
            <span>· conviction {num(t.myProbability) || '—'}%</span>
            <FamilyChip sizing={z} book={book} trades={trades} />
          </div>
          <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 3 }}>
            now {price.toFixed(1)}¢
            {num(t.entryPrice) > 0 && <span> · you paid {num(t.entryPrice).toFixed(1)}¢</span>}
          </div>
        </div>
      </div>

      {card.unrated ? (
        <div data-review-unrated style={{ background: C.cardAlt, border: '1px solid ' + C.border,
          borderRadius: 9, padding: 14, marginBottom: 14 }}>
          <div style={{ fontSize: 13, color: C.ink2, marginBottom: 9 }}>
            {fmtDollar0(card.actual)} riding on this and no conviction logged, so it cannot be
            sized at all. What should this be priced at?
          </div>
          <input type="number" min="1" max="99" autoFocus
            value={convictions[card.key] === undefined ? '' : convictions[card.key]}
            onChange={(e) => setConvictions((o) => ({ ...o, [card.key]: e.target.value }))}
            placeholder="e.g. 85"
            style={{ ...inputStyle, fontFamily: MONO, fontSize: 16, maxWidth: 140 }} />
        </div>
      ) : (
        <div data-review-move style={{ background: C.cardAlt, border: '1px solid ' + C.border,
          borderRadius: 9, padding: '14px 16px', marginBottom: 12 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flexWrap: 'wrap' }}>
            <span style={{ fontFamily: MONO, fontSize: 20, color: C.ink3 }}>{fmtDollar0(card.actual)}</span>
            <span style={{ color: C.ink3, fontSize: 15 }}>→</span>
            <span style={{ fontFamily: MONO, fontSize: 22, fontWeight: 700, color: C.ink }}>{fmtDollar0(target)}</span>
          </div>
          <div style={{ fontFamily: MONO, fontSize: 14, marginTop: 7,
            color: Math.abs(move) < 1 ? C.ink3 : trimming ? C.orange : C.blue }}>
            {Math.abs(move) < 1 ? 'no change'
              : (trimming ? 'sell ' : 'buy ') + Math.round(shares).toLocaleString() + ' shares'}
            <span style={{ color: C.ink3 }}>
              {Math.abs(move) < 1 ? '' : '  (' + (trimming ? '−' : '+') + fmtDollar0(Math.abs(move)).replace('$', '$') + ')'}
            </span>
          </div>
          <div style={{ display: 'flex', gap: 7, alignItems: 'center', marginTop: 12 }}>
            <button data-review-minus onClick={() => bump(-Math.max(5, Math.round(target * 0.1)))} style={stepBtn}>–</button>
            <input type="number" value={target}
              onChange={(e) => setTargets((o) => ({ ...o, [card.key]: Math.max(0, num(e.target.value)) }))}
              style={{ ...inputStyle, fontFamily: MONO, fontSize: 15, width: 96, textAlign: 'right', padding: '7px 9px' }} />
            <button data-review-plus onClick={() => bump(Math.max(5, Math.round(target * 0.1)))} style={stepBtn}>+</button>
            {Math.round(target) !== Math.round(card.target) && (
              <button onClick={() => setTargets((o) => ({ ...o, [card.key]: Math.round(card.target) }))}
                style={{ background: 'none', border: 'none', color: C.blue, fontSize: 12,
                  fontWeight: 600, cursor: 'pointer', padding: 0 }}>
                back to {fmtDollar0(card.target)}
              </button>
            )}
          </div>
        </div>
      )}

      {!card.unrated && (
        <div style={{ marginBottom: 14 }}>
          <Collapsible label="Why this size">
            <SizingBreakdown trade={t} settings={settings} />
          </Collapsible>
        </div>
      )}

      {marketUrl(t) && (
        <a data-review-open-market href={marketUrl(t)} target="_blank" rel="noopener noreferrer"
          style={{ display: 'block', textAlign: 'center', textDecoration: 'none',
            background: C.cardAlt, border: '1px solid ' + C.border, borderRadius: 8,
            padding: '11px 14px', marginBottom: 12, color: C.blue, fontSize: 13.5, fontWeight: 600 }}>
          Open on Polymarket ↗
        </a>
      )}

      <div style={{ display: 'flex', gap: 8 }}>
        <Btn kind="primary" onClick={() => decide('done')}>Done</Btn>
        {!card.unrated && <Btn onClick={() => decide('order')}>Open order</Btn>}
        <Btn onClick={() => decide('ignore')}>Ignore</Btn>
        <div style={{ flex: 1 }} />
        {idx > 0 && <Btn onClick={() => setIdx(idx - 1)}>Back</Btn>}
      </div>

      <div style={{ marginTop: 14, paddingTop: 11, borderTop: '1px solid ' + C.border,
        fontFamily: MONO, fontSize: 11.5, color: C.ink3 }}>
        {running.acted
          ? 'so far: ' + fmtDollar0(running.freed) + ' freed · ' + fmtDollar0(running.spent) +
            ' committed · ' + running.left + ' still want money'
          : 'Targets stay put until you finish. Nothing is placed for you — these are instructions to carry out on Polymarket.'}
      </div>
    </Modal>
  );
}

/* Escape hatch for sandboxes that block cross-origin requests: the user opens
   the API URL in a normal tab and pastes the JSON straight in. */
function ImportModal({ url, onImport, onClose }) {
  const [text, setText] = useState('');
  const [err, setErr] = useState(null);
  const [copied, setCopied] = useState(false);

  const submit = () => {
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) { setErr('That is not valid JSON — copy the entire response, including the opening [ and closing ].'); return; }
    if (!Array.isArray(parsed)) {
      if (parsed && Array.isArray(parsed.positions)) parsed = parsed.positions;
      else { setErr('Expected a JSON array of positions.'); return; }
    }
    onImport(parsed);
  };

  return (
    <Modal
      title="Import positions manually"
      subtitle="If the page sandbox blocks the API call, fetch it yourself once — the journal treats a paste exactly like a sync."
      onClose={onClose} width={560}
    >
      <Field label="1 — Open this URL in a new browser tab">
        <div style={{ display: 'flex', gap: 8 }}>
          <input readOnly value={url} onFocus={(e) => e.target.select()}
            style={{ ...inputStyle, fontFamily: MONO, fontSize: 11.5 }} />
          <Btn onClick={() => {
            navigator.clipboard.writeText(url).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1600); }).catch(() => {});
          }}>{copied ? 'Copied' : 'Copy'}</Btn>
        </div>
      </Field>

      <Field label="2 — Paste the whole response here" hint="It should start with [ and end with ]. An empty array [] means the wallet currently holds no positions.">
        <textarea
          value={text} onChange={(e) => { setText(e.target.value); setErr(null); }}
          placeholder='[{"conditionId":"0x…","title":"…","outcome":"Yes","size":100,"avgPrice":0.42,"curPrice":0.55}, …]'
          rows={8}
          style={{ ...inputStyle, fontFamily: MONO, fontSize: 11.5, resize: 'vertical', lineHeight: 1.5 }}
        />
      </Field>

      {err && <div style={{ color: C.red, fontSize: 12.5, marginBottom: 14, lineHeight: 1.5 }}>{err}</div>}

      <div style={{ display: 'flex', gap: 10 }}>
        <Btn kind="primary" full disabled={!text.trim()} onClick={submit}>Import</Btn>
        <Btn kind="ghost" onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

/* Deep environment probe. Walks a matrix of key formats, value shapes and
   call signatures against whatever window.storage exposes, recording the
   exact error for each, so an unknown host API can be identified from the
   report alone. */
const Probe = (() => {
  const safe = (v) => {
    if (typeof v === 'function') return 'function';
    try { const s = JSON.stringify(v); return s === undefined ? String(v) : s; }
    catch (e) { return String(v); }
  };
  const errStr = (e) => {
    if (!e) return String(e);
    const extra = Object.getOwnPropertyNames(e)
      .filter((k) => k !== 'stack' && k !== 'message')
      .map((k) => { try { return k + '=' + safe(e[k]); } catch (x) { return k + '=?'; } });
    return (e.name || 'Error') + ': ' + (e.message || String(e)) + (extra.length ? '  {' + extra.join(', ') + '}' : '');
  };
  const attempt = async (fn) => {
    try { return { ok: true, value: await fn() }; }
    catch (e) { return { ok: false, err: errStr(e) }; }
  };

  async function run() {
    const L = [];
    const w = (s) => L.push(s);
    const host = window.storage;

    w('===== TRADE JOURNAL ENVIRONMENT REPORT =====');
    w('app build: ' + APP_VERSION + ' (' + APP_BUILT + ')');
    w('generated: ' + new Date().toISOString());
    w('');
    w('--- context ---');
    w('userAgent      : ' + navigator.userAgent);
    w('location       : ' + location.href);
    w('origin         : ' + location.origin);
    w('secureContext  : ' + window.isSecureContext);
    w('in iframe      : ' + (window.top !== window.self));
    try { w('parent origin  : ' + (window.top !== window.self ? document.referrer || '(unknown)' : 'n/a')); } catch (e) { w('parent origin  : (cross-origin)'); }
    w('');

    w('--- window.storage ---');
    w('typeof         : ' + typeof host);
    if (!host) {
      w('window.storage is not present at all.');
    } else {
      w('tag            : ' + Object.prototype.toString.call(host));
      const proto = Object.getPrototypeOf(host);
      const names = Object.keys(host).concat(
        proto && proto !== Object.prototype
          ? Object.getOwnPropertyNames(proto).filter((k) => k !== 'constructor') : []
      );
      w('members        : ' + names.join(', '));
      names.forEach((n) => {
        let t; try { t = typeof host[n]; } catch (e) { t = 'unreadable'; }
        if (t === 'function') {
          let src = '';
          try { src = String(host[n]).replace(/\s+/g, ' ').slice(0, 220); } catch (e) { src = '(unreadable)'; }
          w('  ' + n + '  arity=' + host[n].length + '  src: ' + src);
        } else {
          w('  ' + n + '  (' + t + ') = ' + safe(host[n]));
        }
      });
      w('');

      /* ---- list() first: it may reveal the expected key format ---- */
      if (typeof host.list === 'function') {
        w('--- list() ---');
        for (const args of [[], [''], ['pm_'], ['/'], [{ prefix: '' }]]) {
          const r = await attempt(() => host.list.apply(host, args));
          w('list(' + args.map(safe).join(', ') + ') -> ' + (r.ok ? safe(r.value) : 'THREW ' + r.err));
        }
        w('');
      }

      /* ---- key format matrix ---- */
      if (typeof host.set === 'function') {
        w('--- key formats (set(key, "v")) ---');
        for (const k of ['tjprobe', 'tj_probe', 'tj-probe', 'tj/probe', 'tj.probe', '__tj_probe__', 'pm_wallet', 'a']) {
          const r = await attempt(() => host.set(k, 'v'));
          w(safe(k) + ' -> ' + (r.ok ? 'OK ' + safe(r.value) : 'THREW ' + r.err));
        }
        w('');

        /* ---- value shape matrix ---- */
        w('--- value shapes (set("tjprobe", X)) ---');
        const values = [
          ['string', 'hello'],
          ['number', 42],
          ['boolean', true],
          ['null', null],
          ['object', { a: 1 }],
          ['array', [1, 2]],
          ['JSON string', '{"a":1}'],
          ['{value}', { value: 'hello' }],
          ['{data}', { data: 'hello' }],
          ['{content}', { content: 'hello' }],
          ['{type,value}', { type: 'text', value: 'hello' }],
          ['Blob', (() => { try { return new Blob(['hello'], { type: 'text/plain' }); } catch (e) { return null; } })()],
        ];
        for (const [label, v] of values) {
          const r = await attempt(() => host.set('tjprobe', v));
          let readback = '';
          const g = await attempt(() => host.get('tjprobe'));
          readback = g.ok ? '  | get -> ' + safe(g.value) : '  | get THREW ' + g.err;
          w(label.padEnd(13) + ' -> ' + (r.ok ? 'OK ' + safe(r.value) : 'THREW ' + r.err) + readback);
        }
        w('');

        /* ---- alternate call signatures ---- */
        w('--- alternate signatures ---');
        const sigs = [
          ['set({key,value})', () => host.set({ key: 'tjprobe2', value: 'hello' })],
          ['set(key,value,{})', () => host.set('tjprobe3', 'hello', {})],
          ['set(key,value,"text/plain")', () => host.set('tjprobe4', 'hello', 'text/plain')],
          ['get({key})', () => host.get({ key: 'tjprobe' })],
          ['get(key,{})', () => host.get('tjprobe', {})],
        ];
        for (const [label, fn] of sigs) {
          const r = await attempt(fn);
          w(label.padEnd(28) + ' -> ' + (r.ok ? 'OK ' + safe(r.value) : 'THREW ' + r.err));
        }
        w('');

        w('--- get on an unset key ---');
        const miss = await attempt(() => host.get('tj_definitely_not_set_' + Math.floor(Math.random() * 1e6)));
        w(miss.ok ? 'returned ' + safe(miss.value) : 'THREW ' + miss.err);
        w('');

        if (typeof host.delete === 'function') {
          w('--- cleanup ---');
          for (const k of ['tjprobe', 'tjprobe2', 'tjprobe3', 'tjprobe4', 'tj_probe', 'tj-probe', 'tj/probe', 'tj.probe', '__tj_probe__', 'a']) {
            const r = await attempt(() => host.delete(k));
            if (!r.ok) w('delete(' + safe(k) + ') THREW ' + r.err);
          }
          w('done');
          w('');
        }
      }
    }

    w('--- boot-time adapter notes ---');
    w('active mode: ' + Store.mode);
    Store.diagnostics.forEach((l) => w('  ' + l));
    w('');

    w('--- polymarket fetch ---');
    const url = 'https://data-api.polymarket.com/positions?user=0x0000000000000000000000000000000000000001&limit=2';
    w('url: ' + url);
    const f = await attempt(async () => {
      const res = await fetch(url);
      const txt = await res.text();
      return { status: res.status, statusText: res.statusText, type: res.type, body: txt.slice(0, 160) };
    });
    w(f.ok ? 'REACHED -> ' + safe(f.value) : 'BLOCKED -> ' + f.err);
    w('');
    w('===== END REPORT =====');
    return L.join('\n');
  }
  return { run };
})();

function DiagnosticsPanel({ onClose, onBackup, onRestore, onClearAll, backupText, onRestoreText,
  tradeCount, priceTracking }) {
  const [report, setReport] = useState(null);
  const [plain, setPlain] = useState(null);     // the backup, shown so it can be copied out
  const [paste, setPaste] = useState(null);     // a backup typed or pasted back in
  const [confirmClear, setConfirmClear] = useState(false);
  const [running, setRunning] = useState(false);
  const [copied, setCopied] = useState(false);

  const boot = 'active mode: ' + Store.mode + '\n' + Store.diagnostics.map((l) => '  ' + l).join('\n');
  const text = report || boot;

  const runFull = async () => {
    setRunning(true);
    try { setReport(await Probe.run()); }
    catch (e) { setReport('Probe crashed: ' + ((e && e.message) || e)); }
    setRunning(false);
  };

  const copy = () => {
    navigator.clipboard.writeText(text)
      .then(() => { setCopied(true); setTimeout(() => setCopied(false), 1800); })
      .catch(() => setCopied(false));
  };

  const download = () => {
    try {
      const blob = new Blob([text], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'trade-journal-diagnostics.txt';
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { /* sandbox may block downloads; the text is selectable anyway */ }
  };

  return (
    <Modal
      title="Diagnostics"
      subtitle="Runs every storage call shape this app knows about and records what your environment does with each. Copy the result and send it over."
      onClose={onClose} width={720}
    >
      <div style={{
        background: C.bg, border: '1px solid ' + C.border, borderRadius: 8,
        padding: 14, marginBottom: 18,
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
          <span style={{ fontSize: 12.5, color: C.ink2, fontWeight: 700 }}>Your journal file</span>
          <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.blue }}>build {APP_VERSION} · {APP_BUILT}</span>
        </div>
        <div style={{ fontSize: 12, color: C.ink3, lineHeight: 1.55, marginBottom: 11 }}>
          Your convictions, groups and settings live in this browser, not in the page. A backup
          carries all of it; the positions themselves come back on the next sync anyway. If the
          download does nothing — some apps swallow it — show it as text and copy it somewhere.
        </div>
        <div style={{ display: 'flex', gap: 9, flexWrap: 'wrap', alignItems: 'center' }}>
          <Btn onClick={onBackup}>Save backup</Btn>
          <Btn data-backup-text onClick={() => { setPaste(null); setPlain(plain ? null : (backupText ? backupText() : '')); }}>
            {plain ? 'Hide the text' : 'Show it as text'}
          </Btn>
          <label style={{
            border: '1px solid ' + C.border, borderRadius: 6, padding: '8px 14px',
            fontSize: 13, fontWeight: 600, color: C.ink2, cursor: 'pointer',
          }}>
            Restore from a file
            <input type="file" accept="application/json,.json" style={{ display: 'none' }}
              onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) onRestore(f); e.target.value = ''; }} />
          </label>
          <Btn onClick={() => { setPlain(null); setPaste(paste === null ? '' : null); }}>
            {paste === null ? 'Paste one back in' : 'Cancel'}
          </Btn>
          <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3 }}>{tradeCount} trade{tradeCount === 1 ? '' : 's'} stored</span>
          <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3 }}>· {priceTracking}</span>
        </div>

        {plain !== null && (
          <div style={{ marginTop: 11 }}>
            <textarea data-backup-blob readOnly value={plain} onFocus={(e) => e.target.select()}
              style={{ ...inputStyle, fontFamily: MONO, fontSize: 11, height: 160, resize: 'vertical' }} />
            <div style={{ display: 'flex', gap: 9, marginTop: 8, alignItems: 'center' }}>
              <Btn onClick={() => {
                try { navigator.clipboard.writeText(plain); } catch (e) { /* select-and-copy still works */ }
              }}>Copy</Btn>
              <span style={{ fontSize: 11.5, color: C.ink3 }}>
                {Math.round(plain.length / 1024)} KB — paste it into a note or an email to yourself.
              </span>
            </div>
          </div>
        )}

        {paste !== null && (
          <div style={{ marginTop: 11 }}>
            <textarea data-restore-blob value={paste} onChange={(e) => setPaste(e.target.value)}
              placeholder="Paste a backup here"
              style={{ ...inputStyle, fontFamily: MONO, fontSize: 11, height: 120, resize: 'vertical' }} />
            <div style={{ marginTop: 8 }}>
              <Btn kind="primary" disabled={!paste.trim()}
                onClick={() => onRestoreText && onRestoreText(paste)}>Restore from this</Btn>
            </div>
          </div>
        )}

        <div style={{ borderTop: '1px solid ' + C.border, marginTop: 14, paddingTop: 13 }}>
          <div style={{ fontSize: 12, color: C.ink3, lineHeight: 1.55, marginBottom: 10 }}>
            Starting over wipes every trade and every "don't track" choice, so the next sync treats
            your wallet as brand new. Save a backup first if you might want any of it later.
          </div>
          {confirmClear ? (
            <div style={{ display: 'flex', gap: 9, alignItems: 'center', flexWrap: 'wrap' }}>
              <span style={{ fontSize: 12.5, color: C.red, fontWeight: 700 }}>Erase all {tradeCount} trades?</span>
              <Btn onClick={() => { onClearAll(); setConfirmClear(false); }} style={{ color: C.red, borderColor: C.red + '66' }}>Yes, erase</Btn>
              <Btn kind="ghost" onClick={() => setConfirmClear(false)}>Cancel</Btn>
            </div>
          ) : (
            <Btn onClick={() => setConfirmClear(true)} style={{ color: C.ink3 }}>Start over</Btn>
          )}
        </div>
      </div>

      <div style={{ display: 'flex', gap: 9, marginBottom: 14, flexWrap: 'wrap' }}>
        <Btn kind="primary" onClick={runFull} disabled={running}>
          {running ? 'Running…' : report ? 'Run again' : 'Run full probe'}
        </Btn>
        <Btn onClick={copy}>{copied ? 'Copied' : 'Copy report'}</Btn>
        <Btn onClick={download}>Download .txt</Btn>
        <div style={{ flex: 1 }} />
        <Btn kind="ghost" onClick={onClose}>Close</Btn>
      </div>

      <textarea
        readOnly value={text}
        onFocus={(e) => e.target.select()}
        rows={20}
        style={{
          ...inputStyle, fontFamily: MONO, fontSize: 11, lineHeight: 1.55,
          color: C.ink2, resize: 'vertical', whiteSpace: 'pre',
        }}
      />
      <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 8, lineHeight: 1.5 }}>
        If the copy button is blocked by the sandbox, click inside the box and select all manually.
      </div>
    </Modal>
  );
}

/* =========================================================== SETTINGS */
function Knob({ label, hint, value, onChange, min, max, step = 1, unit = '', width = 90 }) {
  return (
    <div style={{ marginBottom: 18 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 7 }}>
        <label style={{ fontSize: 12.5, fontWeight: 600, color: C.ink2 }}>{label}</label>
        <span style={{ fontFamily: MONO, fontSize: 13, color: C.ink, fontWeight: 600 }}>{value}{unit}</span>
      </div>
      <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
        <input type="range" min={min} max={max} step={step} value={value}
          onChange={(e) => onChange(parseFloat(e.target.value))}
          style={{ flex: 1, accentColor: C.blue }} />
        <input type="number" min={min} max={max} step={step} value={value}
          onChange={(e) => { const v = parseFloat(e.target.value); if (Number.isFinite(v)) onChange(v); }}
          style={{ ...inputStyle, width, fontFamily: MONO, fontSize: 12.5, padding: '5px 8px' }} />
      </div>
      {hint && <div style={{ fontSize: 11.5, color: C.ink3, marginTop: 6, lineHeight: 1.5 }}>{hint}</div>}
    </div>
  );
}

function SettingsGroup({ title, note, children }) {
  return (
    <Card style={{ marginBottom: 16 }}>
      <SectionTitle>{title}</SectionTitle>
      {note && <p style={{ fontSize: 12.5, color: C.ink3, margin: '0 0 16px', lineHeight: 1.55 }}>{note}</p>}
      {children}
