<script type="text/plain" id="app-source">
/* =====================================================================
   SIZING ENGINE — time-adjusted Kelly with certainty, correlation and
   spike-trade handling. Pure functions, no DOM, so it can be unit tested
   outside the browser.
   ===================================================================== */
const Engine = (function () {
  const DAY = 86400000;
  /* Shortest hold worth expressing as an annual rate. Two weeks is enough that
     a single day's price wobble no longer dominates the answer. */
  const MIN_ANN_DAYS = 14;
  const DAMP = { off: null, low: 15, medium: 7, high: 3, aggressive: 2 };

  const DEFAULTS = {
    bankroll: 9000,
    capitalInPlay: 70,    // % of bankroll available to deploy
    k: 4.0,               // certainty exponent
    timePref: 'medium',
    safetyBuffer: 2,      // percentage points shaved off stated conviction
    certFloor: 25,        // conviction below this is not sized at all
    spread: 2,            // round-trip cost, cents
    tradeCap: 35,         // % of available capital, resolution trades
    spikeCap: 15,         // % of available capital, spike trades
    spikeHaircut: 0.4,    // extra discount on spike trades
    overnightCap: 5,      // % of available capital
    alertBand: 10,        // % deviation before a position is flagged (legacy)
    tolPct: 15,           // a position inside this % of its target is on target
    tolDollar: 10,        // ...or inside this many dollars, whichever lets it off
    defaultDays: 30,
    timingWindow: 14,     // days to look forward when judging a fill
    timingThreshold: 3,   // cents; a miss smaller than this is noise
    pruneAfterDays: 365,  // drop stored price series older than this
    lookbackHours: 24,    // the window the dashboard compares against
    tilt: 1,              // 1 shares a short book out evenly; higher favours the best trades
    timeExp: 0.27,        // t in (365/days)^t — 0 ignores the clock, 1 is pure rate
  };

  const PRESETS = [
    { id: 'patient',    label: 'Patient',            k: 4, timeExp: 0 },
    { id: 'efficient',  label: 'Efficient',          k: 4, timeExp: 0.2, star: true },
    { id: 'cycling',    label: 'Aggressive cycling', k: 4, timeExp: 0.45 },
    { id: 'conviction', label: 'High conviction',    k: 6, timeExp: 0.2 },
    { id: 'permissive', label: 'Permissive',         k: 2, timeExp: 0.2 },
  ];

  /* The old damping presets, as exponents, so a journal saved before the
     change keeps behaving the way it did. */
  const TIME_PRESET_EXP = { off: 0, low: 0.06, medium: 0.11, high: 0.21, aggressive: 0.27 };

  const CAPITAL_PRESETS = [
    { label: 'Cautious', pct: 40 },
    { label: 'Normal', pct: 70 },
    { label: 'Conviction', pct: 100 },
  ];

  const n = (v, d) => { const x = +v; return Number.isFinite(x) ? x : (d === undefined ? 0 : d); };

  /* Certainty multiplier, on raw conviction. Conviction always means "my
     contract reaches 100¢", so a 30% call is a deliberate long shot, not a
     confident view — it belongs near the bottom of the curve. Below the floor
     nothing is sized; above it the exponent decides how fast size builds. */
  function certainty(prob, k, floor) {
    const f = n(floor === undefined ? 25 : floor, 25) / 100;
    const p = n(prob) / 100;
    const denom = 1 - f;
    if (denom <= 0) return p > f ? 1 : 0;
    const x = (p - f) / denom;
    return x > 0 ? Math.pow(x, n(k, 4)) : 0;
  }

  /* Short-dated markets are worth more per unit of capital tied up. */
  /* How much faster money is worth than slow money. (365/days)^t, so a market
     a year out is always neutral, t = 0 ignores the clock entirely, and t = 1
     is undamped rate maximisation. Days are floored at one so a market
     resolving this afternoon cannot run away with the book. */
  function timeFactor(days, t) {
    const e = n(t, 0);
    if (!(e > 0)) return 1;
    return Math.pow(365 / Math.max(n(days, 1), 1), e);
  }

  /* Days until the position is expected to be over. Spike trades use the
     trader's own estimate; everything else counts down to resolution. */
  function daysFor(trade, settings, now) {
    const t = now || Date.now();
    if (trade.mode === 'spike') return Math.max(n(trade.expectedDays, 7), 0.5);
    if (Number.isFinite(+trade.daysOverride) && +trade.daysOverride > 0) return +trade.daysOverride;
    if (trade.endDate) {
      const end = new Date(trade.endDate).getTime();
      if (Number.isFinite(end)) return Math.max((end - t) / DAY, 0.5);
    }
    return n(settings.defaultDays, 30);
  }

  /* Correlation: one theme tag per trade, direction from YES/NO. Take the
     single worst relationship rather than compounding them. */
  function correlation(trade, others) {
    const ms = [];
    others.forEach((o) => {
      if (!o || o.key === trade.key || o.status !== 'open') return;
      if (!o.theme || !trade.theme || o.theme !== trade.theme) return;
      ms.push(o.outcome === trade.outcome ? 0.4 : 1.15);
    });
    if (!ms.length) return 1;
    return Math.max(Math.min.apply(null, ms), 0.2);
  }

  /* ---------------------------------------------------------------
     MARKET FAMILIES — the same question asked with a different end date.
     "…blockade by November 30" and "…blockade by December 31" are not two
     bets. They are one bet held at two horizons, and the longer one sits
     inside the shorter: if it had not happened by December then it had not
     happened by November either. Sized independently they let the book take
     a position twice while believing it took it once.

     Nothing to tag. Strip the dates out of the title and compare what is
     left; a trade can still override the answer by hand.
     --------------------------------------------------------------- */
  const MONTHS = 'january|february|march|april|may|june|july|august|september|' +
    'october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec';
  /* A month, optionally with a day and a year hanging off it. */
  const DATEY = new RegExp(
    '\\b(?:' + MONTHS + ')\\b\\.?\\s*\\d{0,2}(?:st|nd|rd|th)?\\s*,?\\s*(?:(?:19|20)\\d{2})?', 'g');
  /* Words that only ever carry a date or glue one on. Numbers that are part
     of the question — "3 US aircraft carriers", "oil at least $80" — are left
     exactly where they are, which is what keeps those markets apart. */
  const DATE_WORDS = /\b(?:by|before|through|thru|on|in|at|after|during|until|til|till|end|eoy|the|of|a|an)\b/g;
  const FAMILY_ALONE = '-';
  /* The same title with its trailing date clause cut off, keeping the original
     wording and capitals. "…blockade by December 31?" becomes "…blockade",
     which is what a group of end dates should be called. */
  const TRAIL = new RegExp(
    '\\s+\\b(?:by|before|through|thru|on|in|until|til|till|after)\\b\\s+' +
    '(?:the\\s+)?(?:end\\s+of\\s+)?(?:(?:' + MONTHS + ')\\b|(?:19|20)\\d{2}\\b)[\\s\\S]*$', 'i');

  function trimDate(title) {
    const t = String(title == null ? '' : title).trim();
    const m = t.match(TRAIL);
    const cut = m ? t.slice(0, m.index).trim() : t;
    return cut.length >= 6 ? cut : t;
  }


  function defang(title) {
    let s = String(title == null ? '' : title).toLowerCase();
    s = s.replace(/[‘’]/g, "'");
    s = s.replace(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g, ' ');  // 12/31, 12/31/26
    s = s.replace(/\b\d{4}-\d{2}-\d{2}\b/g, ' ');               // 2026-12-31
    s = s.replace(DATEY, ' ');                                   // December 31, 2026
    s = s.replace(/\b(?:19|20)\d{2}\b/g, ' ');                   // a bare year
    s = s.replace(/\b(?:q[1-4]|h[12])\b/g, ' ');
    s = s.replace(DATE_WORDS, ' ');
    s = s.replace(/[^a-z0-9]+/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }

  /* Too short a remainder is not evidence of anything, so it stays alone. */
  function familyIdOf(trade) {
    const manual = typeof trade.family === 'string' ? trade.family.trim() : '';
    if (manual === FAMILY_ALONE) return 'solo:' + trade.key;
    if (manual) return manual.toLowerCase();
    const d = defang(trade.title || trade.question || '');
    return d.length >= 10 ? d : 'solo:' + trade.key;
  }

  /* The name of the group a market is in, which is also what you write onto
     another market to put it in the same group. A defanged title can never
     collide with a solo id, which carries a colon. */
  function familyNameOf(trade) {
    const id = familyIdOf(trade);
    return id.slice(0, 5) === 'solo:' ? FAMILY_ALONE : id;
  }

  function groupFamilies(open) {
    const fams = {};
    (open || []).forEach((t) => {
      const id = familyIdOf(t);
      if (!fams[id]) fams[id] = { id, keys: [], manual: false };
      fams[id].keys.push(t.key);
      /* A group anybody joined by hand is no longer just a date ladder. */
      if (typeof t.family === 'string' && t.family.trim() && t.family.trim() !== FAMILY_ALONE) {
        fams[id].manual = true;
      }
    });
    Object.keys(fams).forEach((id) => { fams[id].grouped = fams[id].keys.length > 1; });
    return fams;
  }

  /* Hand out a pot among claimants by weight, with nobody taking more than
     their own limit and whatever they cannot take going back for the others.
     Used twice: once to race the families, once inside each family. */
  function shareOut(keys, budget, limitOf, weightOf) {
    const alloc = {};
    keys.forEach((k) => { alloc[k] = 0; });
    let pool = Math.max(n(budget), 0);
    let active = keys.filter((k) => weightOf(k) > 0);
    for (let pass = 0; pass < 12 && active.length; pass++) {
      const wTotal = active.reduce((a, k) => a + weightOf(k), 0);
      if (wTotal <= 0) break;
      const over = active.filter((k) => pool * weightOf(k) / wTotal > limitOf(k));
      if (!over.length) {
        active.forEach((k) => { alloc[k] = pool * weightOf(k) / wTotal; });
        break;
      }
      over.forEach((k) => { alloc[k] = limitOf(k); pool -= limitOf(k); });
      active = active.filter((k) => over.indexOf(k) < 0);
    }
    return alloc;
  }

  /* On target: inside a percentage of the target, or inside a few dollars,
     whichever lets it off. Percentage alone is right at the top of the book
     and absurd at the bottom, where a $2 move off a $12 target reads as 17%;
     dollars alone are right at the bottom and far too fussy at the top. */
  function onTarget(actual, suggested, st) {
    const gap = Math.abs(n(actual) - n(suggested));
    if (gap <= n(st.tolDollar, 10)) return true;
    const s = n(suggested);
    return s > 0 && gap / s <= n(st.tolPct, 15) / 100;
  }

  /* Kelly fraction of capital.
     Resolution trades: you win (100 - price), you lose the lot.
     Spike trades: you win (target - price), you lose (price - stop). The
     general form reduces to the resolution form when stop = 0.          */
  function rawKelly(trade, adjProb, settings) {
    const P = n(trade.currentPrice);
    const spr = n(settings.spread);
    const p = n(adjProb) / 100;
    const q = 1 - p;
    if (P <= 0 || P >= 100) return 0;

    if (trade.mode === 'spike') {
      const G = n(trade.exitTarget) - P - spr / 2;
      const L = P - n(trade.stopPrice) + spr / 2;
      if (G <= 0 || L <= 0) return 0;
      const f = P * (p * G - q * L) / (G * L);
      return f > 0 ? f : 0;
    }

    const pr = P / 100;
    const pps = 1 - pr;
    if (pps <= 0) return 0;
    const edge = p - pr - (spr / 100) / 2;
    return edge > 0 ? edge / pps : 0;
  }

  /* Expected value and annualised return, for display. */
  function economics(trade, adjProb, settings) {
    const P = n(trade.currentPrice), pr = P / 100, spr = n(settings.spread) / 100;
    const sp = n(adjProb) / 100;
    const pps = trade.mode === 'spike'
      ? Math.abs(n(trade.exitTarget) - P) / 100
      : 1 - pr;
    const loss = trade.mode === 'spike' ? (P - n(trade.stopPrice)) / 100 : pr;
    const ev = sp * pps - (1 - sp) * loss - spr;
    const days = Math.max(n(trade.__days, 1), 0.5);
    const ann = pr > 0 ? (pps / pr / days) * 365 : 0;
    return { ev, ann, pps };
  }

  /* Size a single position, before any portfolio-level scaling. */
  function sizeOne(trade, settings, others, now, avOverride) {
    const st = Object.assign({}, DEFAULTS, settings || {});
    const av = Number.isFinite(avOverride) && avOverride > 0
      ? avOverride
      : n(st.bankroll) * n(st.capitalInPlay) / 100;
    const prob = n(trade.myProbability);

    const out = {
      key: trade.key, av, prob, mode: trade.mode === 'spike' ? 'spike' : 'resolution',
      halfK: 0, quarterK: 0, cap: 0, capped: false, reason: null,
    };

    const capPct = trade.overnight ? st.overnightCap
      : (trade.mode === 'spike' ? st.spikeCap : st.tradeCap);
    out.cap = av * n(capPct) / 100;

    if (!prob) { out.reason = 'no conviction logged'; return out; }

    /* The buffer always shades AGAINST the position. The old floor of 55
       silently inflated any conviction below it, which turned a considered
       25% call into a 55% one. */
    let adj = Math.max(prob - n(st.safetyBuffer), 1);
    if (trade.overnight) adj = Math.max(adj - 5, 1);
    out.adjProb = adj;

    const days = daysFor(trade, st, now);
    out.days = days;
    trade.__days = days;

    out.rawK = rawKelly(trade, adj, st);
    out.cert = certainty(prob, st.k, st.certFloor);
    out.tf = timeFactor(days, n(st.timeExp, 0));
    out.corr = 1;
    Object.assign(out, economics(trade, adj, st));
    delete trade.__days;

    /* Two different questions, kept apart.

       How much does this position deserve in isolation? That is Kelly, and
       Kelly alone — the fraction of the bankroll a bet of these odds justifies.
       It is a ceiling, and the clock has no business in it: with money to spare
       you take every good bet whatever its speed.

       Who gets the money when there is not enough? That is a race, and the
       right measure is what each dollar earns per day. ev/price is the return
       on a dollar committed; the time factor turns it into a rate. */
    let mvk = out.rawK * out.cert * out.corr;
    if (trade.mode === 'spike') mvk *= n(st.spikeHaircut, 0.4);
    out.mvk = mvk;

    const P = n(trade.currentPrice);
    const perDollar = P > 0 ? Math.max(n(out.ev), 0) / (P / 100) : 0;
    out.perDollar = perDollar;
    out.score = perDollar * out.tf * out.cert *
      (trade.mode === 'spike' ? n(st.spikeHaircut, 0.4) : 1);

    const uncapped = mvk * 0.5 * av;
    /* The most this position may take, whatever the race decides. */
    out.want = uncapped;
    out.halfK = Math.min(uncapped, out.cap);
    out.quarterK = mvk * 0.25 * av;
    out.capped = uncapped > out.cap + 1e-9;

    /* If you hold to resolution you turn today's price into 100¢. That is a
       return on capital, and it competes with everything else you could do. */
    out.holdAnn = (P > 0 && P < 100) ? ((100 - P) / P) / Math.max(days, 0.5) * 365 * 100 : 0;

    /* What the position has actually returned so far, and that return
       annualised. Annualising a short hold multiplies both the gain and the
       noise: the same +50% position reads 9,000%/yr after two days and 400%/yr
       after forty-five. Below MIN_ANN_DAYS the rate says more about the
       calendar than the trade, so it is marked unreliable and the caller shows
       the plain return instead. */
    const entry = n(trade.entryPrice);
    /* Two different honest answers to "how long have you held this". The
       position has existed since its first fill, and that is what the row
       shows. But money added later has not been at work as long, so the rate
       of return is annualised over the size-weighted average instead —
       otherwise topping up a position quietly flatters its rate. */
    const anchor = n(trade.weightedEntryAt) ||
      new Date(trade.entryDate || Date.now()).getTime();
    const heldDays = Math.max(((now || Date.now()) - anchor) / DAY, 0);
    out.heldDays = heldDays;
    out.returnSoFar = entry > 0 ? (P - entry) / entry * 100 : null;
    /* Always a true annual rate, over the actual hold, so every position on the
       dashboard is quoted in the same unit and can be ranked against the others.
       A young position will show a very large number — that is arithmetic, not
       a bug, and the hold length is on the row beside it. The half-day floor
       only stops a division by zero on a position opened minutes ago. */
    out.annNow = entry > 0
      ? ((P - entry) / entry) / Math.max(heldDays, 0.5) * 365 * 100
      : null;
    /* Kept for the analytics, which should not draw conclusions from a rate
       extrapolated off a few days. It no longer changes what is displayed. */
    out.annNowReliable = entry > 0 && heldDays >= MIN_ANN_DAYS;

    /* The same measurement carried through to the end: what the whole trade
       earns per year if it resolves at a dollar, counting from your entry and
       over its full life. holdAnn above answers a different question — what the
       money still tied up earns from today — so it is anchored at today's price
       and cannot be set beside the figure earned so far. These two can. */
    const lifeDays = Math.max(heldDays + Math.max(days, 0), 1);
    out.lifeDays = lifeDays;
    out.totalReturn = entry > 0 ? (100 - entry) / entry * 100 : null;
    out.lifeAnn = entry > 0 ? ((100 - entry) / entry) / lifeDays * 365 * 100 : null;

    /* A trade is ahead of its own schedule when it has banked a larger share of
       its total gain than of its total time. That is precisely when the rate
       earned so far outruns the rate the whole trade will average — not a
       contradiction, but the signal that the easy part is behind you. */
    out.aheadOfSchedule = (entry > 0 && out.totalReturn > 0)
      ? (out.returnSoFar / out.totalReturn) > (heldDays / lifeDays)
      : false;
    /* An order placed and not yet filled is money already spoken for. The
       book has to know, or it will offer the same dollars twice. */
    const ord = trade.order && Number.isFinite(+trade.order.target) ? +trade.order.target : null;
    out.order = ord === null ? null : trade.order;
    out.pendingTarget = ord;

    out.upsideCents = Math.max(100 - P, 0);
    out.passedConviction = P >= prob;
    out.inProfit = P > n(trade.entryPrice);
    out.belowFloor = out.cert <= 0;

    if (out.cert <= 0) out.reason = 'conviction is below your ' + n(st.certFloor, 25) + '% floor';
    else if (out.rawK <= 0) out.reason = 'no edge — the market already prices it at ' + n(trade.currentPrice).toFixed(0) + '¢';
    else if (out.halfK < 1) out.reason = 'too little conviction to justify a position';

    return out;
  }

  /* Size the whole book. Scales DOWN only — if Kelly's absolute numbers fit
     inside available capital they are left exactly as calculated. */
  function sizeBook(trades, settings, now, walletValue) {
    const st = Object.assign({}, DEFAULTS, settings || {});
    const open = (trades || []).filter((t) => t.status === 'open');
    const total = n(st.bankroll);

    /* What is actually at work in the market. Prefer the whole wallet as
       reported by the last sync — untracked positions are still real capital —
       and fall back to the tracked book when there has been no sync. */
    const trackedValue = open.reduce((a, t) => a + n(t.size) * n(t.currentPrice) / 100, 0);
    const deployed = (Number.isFinite(walletValue) && walletValue > 0) ? walletValue : trackedValue;
    const deployedPct = total > 0 ? deployed / total * 100 : 0;
    const cash = Math.max(total - deployed, 0);

    /* The ceiling is a floor for the maths. Being above your preferred
       deployment must not force a haircut across positions you already hold,
       and being below it should invite you to put more to work. */
    const basePct = Math.max(n(st.capitalInPlay), deployedPct);
    const av = total * basePct / 100;
    const overCeiling = deployedPct > n(st.capitalInPlay) + 0.05;

    /* Median annualised return on closed trades — the yardstick a position
       still being held has to beat. Median, not mean: one resolved long shot
       would otherwise set an impossible bar. */
    const rets = (trades || [])
      .filter((t) => t.status === 'closed' && Number.isFinite(t.pnlDollar) && n(t.holdDays) > 0)
      .map((t) => {
        const cost = n(t.size) * n(t.entryPrice) / 100;
        return cost > 0 ? (t.pnlDollar / cost) / Math.max(n(t.holdDays), 0.5) * 365 * 100 : null;
      })
      .filter((v) => v !== null && Number.isFinite(v))
      .sort((a, b) => a - b);
    const benchmarkAnn = rets.length >= 3
      ? (rets.length % 2 ? rets[(rets.length - 1) / 2] : (rets[rets.length / 2 - 1] + rets[rets.length / 2]) / 2)
      : null;

    const results = {};
    open.forEach((t) => {
      results[t.key] = sizeOne(t, st, open, now, av);
      results[t.key].actual = n(t.size) * n(t.currentPrice) / 100;
    });

    /* Group the same question asked at different end dates. A family races as
       one row and is entitled to one position's worth of money; what it wins
       is then shared out inside it. A market with no sibling is a family of
       one and comes through this untouched. */
    const fams = groupFamilies(open);
    const famIds = Object.keys(fams);
    const tilt = Math.max(1, n(st.tilt, 1));
    const pow = (sc) => (tilt === 1 ? Math.max(sc, 0) : Math.pow(Math.max(sc, 0), tilt));

    famIds.forEach((id) => {
      const f = fams[id];
      let best = null, ceil = null;
      f.keys.forEach((k) => {
        if (best === null || n(results[k].score) > n(results[best].score)) best = k;
        if (ceil === null || n(results[k].want) > n(results[ceil].want)) ceil = k;
      });
      /* Two different members, and they are not always the same one.

         The race is run on the family's best RATE of return, because that is
         what its claim on the next dollar is worth. But the ceiling is the
         biggest KELLY in the family, because that is the most any single
         member could justify holding on its own, and a group is not entitled
         to less than its strongest claim. The top scorer can be a smaller
         Kelly — a cheaper, faster contract held at lower conviction — and
         ceilinging the group there would quietly underfund it.

         There is deliberately no group conviction. The members are
         probabilities of different events: 98% that the blockade has not
         ended by November and 80% that it has not ended by March are not two
         readings of one number, and averaging them describes no event at all.
         What a group shares is money, never a belief. */
      f.best = best;
      f.ceilingKey = ceil;
      f.score = best === null ? 0 : Math.max(n(results[best].score), 0);
      f.want = ceil === null ? 0 : n(results[ceil].want);
      f.cap = f.keys.reduce((a, k) => Math.max(a, n(results[k].cap)), 0);
      f.actual = f.keys.reduce((a, k) => a + n(results[k].actual), 0);
    });

    /* Does the book fit? Measured against what Kelly would give each family
       on its own, since that is what every one of them is entitled to. */
    const rawTotal = famIds.reduce((a, id) => a + n(fams[id].want), 0);
    const scale = (rawTotal > av && rawTotal > 0) ? av / rawTotal : 1;

    /* Concentration. While the book fits, none of this applies. Once it does
       not, the race is run on score — what each dollar earns per day — and the
       exponent decides how hard the winners are favoured. */
    const weights = {};
    open.forEach((t) => { weights[t.key] = pow(n(results[t.key].score)); });

    /* No family may take more than Kelly allows it, or more than its cap.
       Whatever it cannot take goes back into the pool for the others rather
       than evaporating; a few passes settle it. */
    const famLimit = (id) => Math.min(n(fams[id].want), n(fams[id].cap));
    const famAlloc = {};
    if (scale >= 1) {
      famIds.forEach((id) => { famAlloc[id] = famLimit(id); });
    } else {
      const got = shareOut(famIds, av, famLimit, (id) => pow(fams[id].score));
      famIds.forEach((id) => { famAlloc[id] = n(got[id]); });
    }

    /* Inside a family the same concentration dial decides the split, so at 2×
       most of it lands on the best-priced date and the others keep a tail. */
    const memberLimit = (key) => Math.min(n(results[key].want), n(results[key].cap));
    const alloc = {};
    famIds.forEach((id) => {
      const f = fams[id];
      f.alloc = famAlloc[id];
      if (f.keys.length === 1) { alloc[f.keys[0]] = famAlloc[id]; return; }
      const got = shareOut(f.keys, famAlloc[id], memberLimit, (k) => weights[k]);
      f.keys.forEach((k) => { alloc[k] = n(got[k]); });
    });

    let suggestedTotal = 0, flagged = 0, harvestable = 0, reviewCount = 0, pendingCount = 0;
    open.forEach((t) => {
      const r = results[t.key];
      r.suggested = Math.min(n(alloc[t.key]), r.cap, n(r.want));
      /* Each trade's own factor, which is the book-wide one only when the
         shortfall is shared out evenly and no cap gets in the way. */
      r.scale = n(r.want) > 0 ? r.suggested / n(r.want) : scale;
      r.bookScale = scale;
      r.tilt = tilt;
      r.family = familyIdOf(t);
      r.familyManual = !!(fams[r.family] && fams[r.family].manual);
      r.familySize = (fams[r.family] && fams[r.family].keys.length) || 1;
      suggestedTotal += r.suggested;
      r.deviationPct = r.suggested > 0 ? (r.actual - r.suggested) / r.suggested * 100 : null;
      r.delta = r.suggested - r.actual;
      r.onTarget = onTarget(r.actual, r.suggested, st);

      /* Four different situations used to collapse into one red "over" flag.
         They mean quite different things and deserve to be told apart. */
      if (r.pendingTarget != null) {
        /* An order is out. Nothing to decide until it fills or is pulled. */
        r.flag = 'pending';
        r.orderFilled = onTarget(r.actual, r.pendingTarget, st);
      } else if (!r.prob) {
        /* nothing to judge against — not a sizing problem, a missing input */
        r.flag = 'unrated';
        r.deviationPct = null;
        r.delta = null;
      } else if (r.onTarget) {
        r.flag = 'ok';
      } else if (r.suggested < 1) {
        r.deviationPct = null;
        r.delta = -r.actual;
        if (r.belowFloor) {
          r.flag = 'belowfloor';
        } else if (r.passedConviction && r.inProfit) {
          /* the market came to you — this is the trade working, not a warning */
          r.flag = 'harvest';
        } else {
          r.flag = 'noedge';
        }
      } else {
        r.flag = r.deviationPct > 0 ? 'over' : 'under';
      }

      /* What the review will deal you: anything rated and off target, plus a
         position of real size carrying no conviction at all. An order already
         placed is not a decision waiting to be made. */
      r.needsReview = r.flag !== 'pending' &&
        (r.flag === 'unrated' ? r.actual >= n(st.tolDollar, 10) : r.flag !== 'ok');

      r.benchmarkAnn = benchmarkAnn;
      if (r.needsReview) reviewCount += 1;
      if (r.flag === 'pending') pendingCount += 1;
      else if (r.flag === 'harvest') harvestable += 1;
      else if (r.flag !== 'ok') flagged += 1;
    });

    /* Family totals, for the grouped subtotal on the dashboard. */
    const families = {};
    famIds.forEach((id) => {
      const f = fams[id];
      if (!f.grouped) return;
      families[id] = {
        id, keys: f.keys.slice(), manual: !!f.manual, best: f.best, ceilingKey: f.ceilingKey,
        actual: f.actual,
        suggested: f.keys.reduce((a, k) => a + n(results[k].suggested), 0),
        want: f.want, cap: f.cap,
      };
    });

    return {
      results, av, scale, scaled: scale < 1, rawTotal,
      suggestedTotal, flagged, harvestable, benchmarkAnn,
      reviewCount, pendingCount, families,
      total, cash, deployed, deployedPct, trackedValue,
      untrackedValue: Math.max(deployed - trackedValue, 0),
      basePct, overCeiling, ceilingPct: n(st.capitalInPlay),
      bankroll: total,
      suggestedPct: total > 0 ? suggestedTotal / total * 100 : 0,
      cashPct: total > 0 ? cash / total * 100 : 0,
    };
  }

  /* ===================================================================
     LEDGER — everything below reads a list of fills and returns facts.
     Nothing here talks to a network or a screen, so it can be checked
     against hand-worked examples.
     =================================================================== */

  /* A market you bought, closed completely, and later bought into again is two
     separate positions that happen to share a title. Split the fills wherever
     the running holding returns to zero: the last group is what you hold now,
     the earlier ones are history. This is the split that Polymarket's own
     average price fails to make. */
  function episodes(fills) {
    const list = (fills || []).slice().sort((a, b) => a.t - b.t);
    const out = [];
    let cur = null, pos = 0;
    list.forEach((f) => {
      if (!cur) cur = { fills: [], opened: f.t, closed: null };
      cur.fills.push(f);
      pos += f.side === 'BUY' ? n(f.shares) : -n(f.shares);
      /* Floating point and Polymarket's fractional shares mean "flat" is never
         exactly zero. A twentieth of a share is flat. */
      if (pos <= 0.05) { cur.closed = f.t; out.push(cur); cur = null; pos = 0; }
    });
    if (cur) out.push(cur);
    return out;
  }

  /* Average-cost accounting. A sale realises the difference between what it
     fetched and the average of everything held at that moment, and removes
     that average from the remaining cost — so selling never changes the
     average price of what is left. */
  function positionFrom(fills) {
    const list = (fills || []).slice().sort((a, b) => a.t - b.t);
    let shares = 0, cost = 0, realised = 0, bought = 0, sold = 0, proceeds = 0;
    list.forEach((f) => {
      const q = n(f.shares), p = n(f.price);
      if (f.side === 'BUY') { cost += q * p; shares += q; bought += q; }
      else {
        const avg = shares > 0 ? cost / shares : 0;
        const take = Math.min(q, shares);
        realised += take * (p - avg);
        cost -= take * avg;
        shares -= take;
        sold += take; proceeds += take * p;
      }
    });
    return {
      shares: Math.max(shares, 0),
      avg: shares > 0.05 ? cost / shares : (bought > 0 ? list.filter((f) => f.side === 'BUY')
        .reduce((a, f) => a + n(f.shares) * n(f.price), 0) / bought : 0),
      cost: Math.max(cost, 0),
      realised: realised / 100,           // cents -> dollars
      bought, sold,
      avgOut: sold > 0 ? proceeds / sold : null,
      buys: list.filter((f) => f.side === 'BUY').length,
      sells: list.filter((f) => f.side === 'SELL').length,
    };
  }

  /* Did the market move against this decision soon after it was made?
     A buy is early if the price was available meaningfully cheaper within the
     window; a sale is early if it went meaningfully higher. Same measurement,
     opposite sign — so one threshold governs both and "early" is simply the
     tail of one distribution. */
  function timingFor(fill, series, settings) {
    const st = settings || {};
    const W = n(st.timingWindow, 14), TH = n(st.timingThreshold, 3);
    const pts = (series || []).filter((p) => p.t > fill.t && p.t <= fill.t + W * DAY);
    if (!pts.length) return { best: null, miss: 0, early: false, at: null, covered: false };
    const buy = fill.side === 'BUY';
    let best = pts[0];
    pts.forEach((p) => { if (buy ? p.p < best.p : p.p > best.p) best = p; });
    const miss = buy ? n(fill.price) - best.p : best.p - n(fill.price);
    return {
      best: best.p, at: best.t,
      miss: Math.max(miss, 0),
      early: miss >= TH,
      covered: true,
      /* How long you would have had to wait for it. */
      waitDays: (best.t - fill.t) / DAY,
    };
  }

  /* One record per closed position, computed while the price history is still
     good. Polymarket downgrades resolved markets to 12-hour buckets and the
     journal prunes old series, so anything not worked out now cannot be
     worked out later. */
  function factsFor(trade, series, settings) {
    const fills = (trade.fills || []).slice().sort((a, b) => a.t - b.t);
    if (!fills.length) return null;
    const pos = positionFrom(fills);
    const opened = fills[0].t;
    const closed = trade.status === 'closed'
      ? (trade.closedAt || fills[fills.length - 1].t) : null;
    const held = (series || []).filter((p) => p.t >= opened && p.t <= (closed || Date.now()));
    let peak = null, trough = null;
    held.forEach((p) => {
      if (!peak || p.p > peak.p) peak = p;
      if (!trough || p.p < trough.p) trough = p;
    });
    const ch = (trade.convictionHistory || []).slice().sort((a, b) => a.t - b.t);
    const atEntry = ch.filter((c) => c.t <= opened + DAY).pop() || ch[0] || null;
    return {
      conditionId: trade.conditionId, title: trade.title, outcome: trade.outcome,
      convictionAtEntry: atEntry ? n(atEntry.value) : n(trade.myProbability, null),
      convictionFinal: n(trade.myProbability, null),
      convictionChanges: Math.max(ch.length - 1, 0),
      entryAvg: pos.avg, exitAvg: pos.avgOut, shares: pos.bought,
      openedAt: opened, closedAt: closed,
      heldDays: ((closed || Date.now()) - opened) / DAY,
      peak: peak ? peak.p : null, trough: trough ? trough.p : null,
      /* Of the gain that was actually on the table, how much came out. */
      capture: (peak && pos.avgOut != null && peak.p > pos.avg)
        ? (pos.avgOut - pos.avg) / (peak.p - pos.avg) * 100 : null,
      resolution: trade.resolution || null,
      realised: pos.realised,
      fills: fills.map((f) => {
        const tm = timingFor(f, series, settings);
        return {
          t: f.t, side: f.side, shares: n(f.shares), price: n(f.price),
          suggestedAt: f.suggestedAt == null ? null : n(f.suggestedAt),
          actualAt: f.actualAt == null ? null : n(f.actualAt),
          miss: tm.miss, early: tm.early, best: tm.best, waitDays: tm.waitDays,
        };
      }),
    };
  }

  return {
    DEFAULTS, PRESETS, CAPITAL_PRESETS, DAMP, TIME_PRESET_EXP, MIN_ANN_DAYS,
    episodes, positionFrom, timingFor, factsFor,
    certainty, timeFactor, rawKelly, daysFor, sizeOne, sizeBook,
    defang, trimDate, familyIdOf, familyNameOf, groupFamilies, onTarget, shareOut, FAMILY_ALONE,
  };
})();

/* --------------------------------------------------------- persistence */
/* Wraps window.storage. Tolerates get/set OR getItem/setItem, sync or
   promise-returning. Falls back to an in-memory map so the app still runs
   (for the current session only) if no host storage is present.          */
const Store = (() => {
  const mem = new Map();
  const host = (typeof window !== 'undefined' && window.storage) ? window.storage : null;

  /* Host storage APIs differ between environments — method names, whether
     they take structured values or strings, and whether reading an unset key
     returns null or throws. Rather than assume, probe once at boot and adopt
     whichever shape actually round-trips. */
  const PAIRS = [['getItem', 'setItem'], ['get', 'set'], ['read', 'write'], ['getValue', 'setValue']];
  const PROBE_KEY = '__tj_probe__';

  let impl = null;          // { g, st, structured, unwrap }
  const log = [];           // human-readable trace, surfaced in the UI

  const unwrapValue = (v) => {
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      for (const k of ['value', 'data', 'result']) {
        if (k in v) return v[k];
      }
    }
    return v;
  };

  /* A write that throws has NOT necessarily failed — some host bridges
     complete the write and then reject while parsing their own response.
     So always read back before writing a shape off. */
  async function tryRoundTrip(g, st, payload, matches) {
    let wroteThrew = null;
    try {
      await host[st](PROBE_KEY, payload);
    } catch (e) {
      wroteThrew = (e && e.message) || String(e);
    }
    let back;
    try {
      back = unwrapValue(await host[g](PROBE_KEY));
    } catch (e) {
      log.push(g + '/' + st + ' [' + (typeof payload) + ']: write ' +
        (wroteThrew ? 'threw (' + wroteThrew + ')' : 'ok') + ', read threw (' + ((e && e.message) || e) + ')');
      return false;
    }
    if (matches(back)) {
      if (wroteThrew) log.push(g + '/' + st + ' [' + (typeof payload) + ']: write reported "' + wroteThrew + '" but the value read back correctly — treating as usable');
      return true;
    }
    log.push(g + '/' + st + ' [' + (typeof payload) + ']: write ' +
      (wroteThrew ? 'threw (' + wroteThrew + ')' : 'ok') + ', read back ' + JSON.stringify(back));
    return false;
  }

  async function probe() {
    if (!host) { log.push('window.storage is not present'); return; }
    log.push('window.storage members: ' + Object.keys(host).concat(
      Object.getPrototypeOf(host) && Object.getPrototypeOf(host) !== Object.prototype
        ? Object.getOwnPropertyNames(Object.getPrototypeOf(host)).filter((k) => k !== 'constructor')
        : []
    ).join(', '));

    for (const [g, st] of PAIRS) {
      if (typeof host[g] !== 'function' || typeof host[st] !== 'function') continue;

      // A host that keeps structured values is preferable — no double encoding.
      try {
        if (await tryRoundTrip(g, st, { __tj: 'ok' }, (b) => b && b.__tj === 'ok')) {
          impl = { g, st, structured: true };
          log.push('using ' + g + '/' + st + ' with structured values');
          return;
        }
      } catch (e) { log.push(g + '/' + st + ' (object) threw: ' + (e && e.message)); }

      try {
        if (await tryRoundTrip(g, st, 'tj-ok', (b) => b === 'tj-ok')) {
          impl = { g, st, structured: false };
          log.push('using ' + g + '/' + st + ' with JSON strings');
          return;
        }
      } catch (e) { log.push(g + '/' + st + ' (string) threw: ' + (e && e.message)); }
    }
    log.push('no usable window.storage shape found');
  }

  /* Tier 2. When the host API is unusable — or absent because the file was
     downloaded and opened directly — plain localStorage still persists. */
  function probeLocalStorage() {
    try {
      const t = '__tj_ls_probe__';
      window.localStorage.setItem(t, 'ok');
      const ok = window.localStorage.getItem(t) === 'ok';
      window.localStorage.removeItem(t);
      if (ok) {
        impl = { local: true };
        log.push('falling back to window.localStorage — persistence is per-browser, not per-account');
        return true;
      }
      log.push('localStorage did not round-trip');
    } catch (e) {
      log.push('localStorage unavailable: ' + ((e && e.message) || e));
    }
    return false;
  }

  const ready = probe()
    .catch((e) => { log.push('probe failed: ' + ((e && e.message) || e)); })
    .then(() => {
      if (!impl && !probeLocalStorage()) {
        log.push('no persistent storage available — entries will not survive a reload');
      }
    });

  return {
    ready,
    get diagnostics() { return log.slice(); },
    note(msg) { log.push(msg); },
    get ephemeral() { return !impl; },
    get mode() {
      if (!impl) return 'in-memory only';
      if (impl.local) return 'window.localStorage';
      return 'window.storage.' + impl.g + '/' + impl.st + (impl.structured ? ' (structured)' : ' (string)');
    },

    async get(k, fallback) {
      await ready;
      if (!impl) return mem.has(k) ? mem.get(k) : fallback;
      let raw;
      try {
        raw = impl.local ? window.localStorage.getItem(k) : unwrapValue(await host[impl.g](k));
      } catch (e) {
        /* Several hosts throw rather than return null for an unset key —
           that is a miss, not a failure. */
        return fallback;
      }
      if (raw === null || raw === undefined || raw === '') return fallback;
      /* Parse strings in either mode: a structured host may still be holding
         JSON written by an earlier build, or may serialise on its own. */
      if (typeof raw === 'string') {
        try { return JSON.parse(raw); } catch (e) { return raw; }
      }
      return raw;
    },

    async set(k, v) {
      await ready;
      if (!impl) { mem.set(k, v); return true; }
      try {
        if (impl.local) window.localStorage.setItem(k, JSON.stringify(v));
        else await host[impl.st](k, impl.structured ? v : JSON.stringify(v));
        return true;
      } catch (e) {
        log.push('write to "' + k + '" failed: ' + (e && e.message));
        mem.set(k, v);
        return false;
      }
    },
  };
})();

function closeTrade(trade, exitPrice, exitReason, exitDate) {
  const size = num(trade.size);
  const entry = num(trade.entryPrice);
  const pnlDollar = size * (exitPrice - entry) / 100;
  const maxGain = size * (100 - entry) / 100;
  const exitQuality = maxGain > 0 ? (pnlDollar / maxGain) * 100 : null;
  return {
    ...trade,
    status: 'closed',
    currentPrice: exitPrice,
    exitPrice,
    exitReason,
    exitDate,
    pnlDollar,
    exitQuality,
    holdDays: daysBetween(trade.entryDate, exitDate),
    won: pnlDollar > 0,
  };
}
/* With no entry price there is no profit to report — counting the whole
   position as gain would inflate the unrealised total and every average
   built on it. Treat it as zero and say so on the row instead. */
const knownEntry = (t) => num(t.entryPrice) > 0;
const openPnl = (t) => (knownEntry(t)
  ? num(t.size) * (num(t.currentPrice) - num(t.entryPrice)) / 100 : 0);
const openValue = (t) => num(t.size) * num(t.currentPrice) / 100;
const pnlPct = (t) => (num(t.entryPrice) > 0
  ? (num(t.currentPrice) - num(t.entryPrice)) / num(t.entryPrice) * 100 : 0);

/* The four headline numbers, computed in one place so the dashboard and the
   history recorded at each sync can never drift apart. All four are about
   closed trades, so they move when something finishes, not when a price ticks.
   A metric with nothing to measure yet is null and stays out of the history. */
function statsFrom(trades) {
  const closed = (trades || []).filter((t) => t.status === 'closed');
  const profitable = closed.filter((t) => num(t.pnlDollar) > 0).length;
  const grossWin = closed.reduce((a, t) => a + Math.max(num(t.pnlDollar), 0), 0);
  const grossLoss = closed.reduce((a, t) => a + Math.max(-num(t.pnlDollar), 0), 0);
  const eq = closed.filter((t) => Number.isFinite(t.exitQuality));
  return {
    n: closed.length,
    profitable,
    grossWin,
    grossLoss,
    pnl: closed.length ? closed.reduce((a, t) => a + num(t.pnlDollar), 0) : null,
    made: closed.length ? (profitable / closed.length) * 100 : null,
    /* Infinity is a real answer — every trade a winner — but it cannot be
       plotted or subtracted, so the history keeps it out. */
    pf: grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : null),
    eq: eq.length ? eq.reduce((a, t) => a + t.exitQuality, 0) / eq.length : null,
  };
}

/* One row per sync, oldest first, so "since last sync" means the same thing
   here as it does on a position row. */
const STATS_KEYS = ['pnl', 'made', 'pf', 'eq'];
const STATS_CAP = 1000;
function pushStats(history, s, at) {
  const list = Array.isArray(history) ? history.slice() : [];
  const row = { t: at, n: num(s.n) };
  STATS_KEYS.forEach((k) => { if (Number.isFinite(s[k])) row[k] = s[k]; });
  list.push(row);
  return list.length > STATS_CAP ? list.slice(list.length - STATS_CAP) : list;
}

/* The reading to compare today against: the newest one taken at or before the
   window closes. Before there is anything that old — a fresh install, a
   holiday — it falls back to the oldest reading held rather than showing
   nothing, and the row carries its own timestamp so the tooltip can say what
   the comparison actually spans. */
const LOOKBACKS = [
  { h: 1, label: '1 hour' }, { h: 6, label: '6 hours' }, { h: 12, label: '12 hours' },
  { h: 24, label: '1 day' }, { h: 48, label: '2 days' }, { h: 72, label: '3 days' },
  { h: 168, label: '1 week' }, { h: 336, label: '2 weeks' }, { h: 720, label: '1 month' },
];
const lookbackLabel = (h) => {
  const hit = LOOKBACKS.find((l) => l.h === num(h));
  if (hit) return hit.label;
  const v = num(h, 24);
  return v < 24 ? v + ' hours' : Math.round(v / 24) + ' days';
};
function baselineAt(rows, key, hours, now) {
  if (!Array.isArray(rows) || rows.length < 2) return null;
  const has = (r) => r && Number.isFinite(num(r[key], NaN));
  const cut = (now || Date.now()) - Math.max(num(hours, 24), 1) * 3600000;
  let pick = null;
  for (let i = 0; i < rows.length - 1; i++) {
    const t = new Date(rows[i].t).getTime();
    if (!Number.isFinite(t) || !has(rows[i])) continue;
    if (t > cut) break;
    pick = rows[i];
  }
  if (pick) return pick;
  for (let i = 0; i < rows.length - 1; i++) if (has(rows[i])) return rows[i];
  return null;
}

/* How one metric has moved over the window. Null when there is nothing to
   compare against, or when the number did not move. */
function statDelta(history, key, now, hours) {
  const b = baselineAt(history, key, hours);
  if (!b || !Number.isFinite(now)) return null;
  const d = now - num(b[key]);
  return Math.abs(d) < 1e-9 ? null : { d, at: b.t };
}

/* What the market did to this position between the last two syncs. The price
   the previous sync saw is kept on the track record, so this is a straight
   comparison — and the dollar figure is the price move applied to the shares
   held now, which is the money the move was worth to you. */
const sinceSync = (t, hours) => {
  const tr = t && t.track;
  if (!tr) return null;
  const to = num(t.currentPrice) > 0 ? num(t.currentPrice) : num(tr.last);
  if (!(to > 0)) return null;
  let from = null, at = null;
  const rows = Array.isArray(tr.hist) && tr.hist.length ? tr.hist : null;
  if (rows) {
    const b = baselineAt(rows, 'p', hours);
    if (b) { from = num(b.p); at = b.t; }
  }
  if (!(from > 0) && num(tr.prev) > 0) {
    /* Positions recorded before the journal kept a full price history still
       have the one reading before the last. */
    from = num(tr.prev); at = tr.prevAt || null;
  }
  if (!(from > 0)) return null;
  return { from, to, dc: to - from, dv: num(t.size) * (to - from) / 100, at };
};

/* Trims first, then adds, each by how much is at stake. Then the positions
   that want a decision, then the ones that are simply fine. */
const ATTENTION_RANK = { over: 0, under: 1, harvest: 2, noedge: 3, belowfloor: 3, unrated: 4, ok: 5 };

const OPEN_SORTS = [
  {
    id: 'attention', label: 'Needs attention', dir: 'asc',
    cmp: (a, b) => {
      const ra = ATTENTION_RANK[a.sizing && a.sizing.flag] ?? 9;
      const rb = ATTENTION_RANK[b.sizing && b.sizing.flag] ?? 9;
      if (ra !== rb) return ra - rb;
      return Math.abs(num(b.sizing && b.sizing.delta)) - Math.abs(num(a.sizing && a.sizing.delta));
    },
  },
  { id: 'value',  label: 'Value',      dir: 'desc', get: openValue },
  { id: 'pnl',    label: 'P&L $',      dir: 'desc', get: openPnl },
  { id: 'pnlpct', label: 'P&L %',      dir: 'desc', get: pnlPct },
  /* Sorts by the projection the row actually shows — the whole trade's rate if
     it resolves — not by the forward-only rate, which lives in the verdict. */
  { id: 'ann',    label: 'Return/yr',  dir: 'desc', get: (t) => num(t.sizing && t.sizing.lifeAnn) },
  /* Every position quotes a true annual rate now, so they rank directly against
     each other. Only a position with no usable entry price has nothing to rank
     on, and that goes last. */
  { id: 'annnow', label: 'Actual/yr',  dir: 'desc',
    get: (t) => (t.sizing && t.sizing.annNow != null ? num(t.sizing.annNow) : -1e12) },
  { id: 'time',   label: 'Time left',  dir: 'asc',  get: (t) => num(t.sizing && t.sizing.days, 1e9) },
  /* What the market did between the last two syncs. Pure price movement — the
     dollar figure is the price step on the shares held, so buying or selling
     never shows up here. Positions with only one sync have nothing to rank on
     and go last. */
  { id: 'movec',  label: 'Move ¢',     dir: 'desc',
    get: (t, lb) => { const s = sinceSync(t, lb); return s ? s.dc : -1e12; } },
  { id: 'movev',  label: 'Move $',     dir: 'desc',
    get: (t, lb) => { const s = sinceSync(t, lb); return s ? s.dv : -1e12; } },
];

function sortOpen(list, id, flip, lookback) {
  const spec = OPEN_SORTS.find((o) => o.id === id) || OPEN_SORTS[0];
  const out = list.slice();
  if (spec.cmp) out.sort(spec.cmp);
  else out.sort((a, b) => (spec.dir === 'asc'
    ? spec.get(a, lookback) - spec.get(b, lookback)
    : spec.get(b, lookback) - spec.get(a, lookback)));
  return flip ? out.reverse() : out;
}

/* Price history is only fetchable while a market is live, and only against a
   token id that disappears once the position leaves the wallet. So record the
   id now, and keep a running high/low from the prices each sync already
   returns. It is only as fine-grained as you sync, but the extremes are the
   part that matters and they cannot be recovered later. */
const PRICE_HIST_CAP = 400;
function trackPrice(track, price, at) {
  const p = num(price);
  if (!Number.isFinite(p) || p <= 0) return track || null;
  if (!track || typeof track !== 'object' || !Number.isFinite(num(track.lo, NaN))) {
    return { first: p, firstAt: at, lo: p, loAt: at, hi: p, hiAt: at, last: p, lastAt: at,
      n: 1, hist: [{ t: at, p }] };
  }
  /* A reading per sync, so the dashboard can compare against any point in the
     recent past rather than only against the sync before this one. */
  const hist = (Array.isArray(track.hist) ? track.hist : [])
    .concat([{ t: at, p }]);
  const next = Object.assign({}, track, {
    prev: num(track.last), prevAt: track.lastAt || null,
    last: p, lastAt: at, n: num(track.n) + 1,
    hist: hist.length > PRICE_HIST_CAP ? hist.slice(hist.length - PRICE_HIST_CAP) : hist,
  });
  if (p < num(track.lo)) { next.lo = p; next.loAt = at; }
  if (p > num(track.hi)) { next.hi = p; next.hiAt = at; }
  return next;
}

/* When you actually bought, which is not the same as when this journal first
   saw the position. Everything imported on the first run was stamped with that
   day's date, so positions held for weeks looked days old — and dividing a
   return by days instead of weeks is what made the annual rates absurd.
   Polymarket's activity feed has the real fills, so ask it.

   A position's average price is weighted by the size of each fill, so the
   matching hold period is the size-weighted average of the fill times. Buying
   more later genuinely does shorten the average hold. */
const ACTIVITY_URL = (wallet, offset) =>
  'https://data-api.polymarket.com/activity?user=' + encodeURIComponent(wallet) +
  '&type=TRADE&limit=500&offset=' + offset + '&sortBy=TIMESTAMP&sortDirection=DESC';

/* Every fill, oldest first, grouped by the token it moved. Buys and sells
   both — the sells are the half the journal used to miss entirely, which is
   why trimming a position was invisible and why closing one needed a
   questionnaire. */
function fillsFrom(records) {
  const byId = new Map();
  (records || []).forEach((r) => {
    if (!r) return;
    const side = String(r.side || '').toUpperCase();
    if (side !== 'BUY' && side !== 'SELL') return;
    const id = r.asset || r.conditionId;
    const shares = num(r.size);
    const raw = num(r.price);
    /* The feed quotes a fraction of a dollar; tolerate a switch to cents. */
    const price = raw > 1 ? raw : raw * 100;
    const t = num(r.timestamp) * 1000;
    if (!id || !(shares > 0) || !(price > 0) || !(t > 0)) return;
    if (!byId.has(id)) byId.set(id, []);
    byId.get(id).push({ t, side, shares, price, hash: r.transactionHash || null });
  });
  byId.forEach((list) => {
    list.sort((a, b) => a.t - b.t);
    /* The same trade can appear twice if a page boundary overlaps. */
    for (let i = list.length - 1; i > 0; i--) {
      const a = list[i], b = list[i - 1];
      if (a.hash && a.hash === b.hash && a.side === b.side &&
          Math.abs(a.shares - b.shares) < 1e-9) list.splice(i, 1);
    }
  });
  return byId;
}

async function fetchFills(wallet, log) {
  if (!wallet) return new Map();
  const all = [];
  try {
    for (let page = 0; page < 12; page++) {
      const res = await fetch(ACTIVITY_URL(wallet, page * 500));
      if (!res.ok) throw new Error('activity returned ' + res.status);
      const batch = await res.json();
      if (!Array.isArray(batch) || batch.length === 0) break;
      all.push(...batch);
      if (batch.length < 500) break;
    }
  } catch (err) {
    if (log) log('Could not read your trade history (' + err.message + '). ' +
      'Entry prices fall back to Polymarket\u2019s average, which is wrong on any ' +
      'market you have traded before and closed.');
    return fillsFrom(all);
  }
  if (log && all.length) log('Read ' + all.length + ' transactions from your history.');
  return fillsFrom(all);
}

/* Price history is served against the token id, and only while the market is
   live at any useful resolution — once it resolves Polymarket serves 12-hour
   buckets and nothing finer, forever. Fetched on demand and held for the
   session; snapshotted permanently when a position closes. */
/* Successful series only. A failure is never cached: the commonest cause is a
   transient block or a rate limit, and caching that meant one bad moment
   blanked a market for the rest of the session. */
const PRICE_CACHE = new Map();
const FIDELITIES = [1, 5, 15, 60, 180, 720];
/* Why the last attempt failed, so the message can say something useful
   instead of guessing between "blocked" and "no data". */
const PRICE_FAIL = new Map();

async function fetchPriceSeries(asset, fromTs, toTs) {
  if (!asset) return null;
  const key = asset + ':' + Math.round(fromTs / 36e5);
  if (PRICE_CACHE.has(key)) return PRICE_CACHE.get(key);

  /* Never ask for a window that ends in the future — some responses come back
     empty rather than clamped. */
  const end = Math.min(toTs, Date.now());
  const start = Math.min(fromTs, end - 3600000);
  const spanMin = Math.max((end - start) / 60000, 60);
  const want = spanMin / 400;
  const startIdx = Math.max(FIDELITIES.findIndex((f) => f >= want), 0);

  const ranged = (fid) => 'https://clob.polymarket.com/prices-history?market=' +
    encodeURIComponent(asset) + '&startTs=' + Math.floor(start / 1000) +
    '&endTs=' + Math.floor(end / 1000) + '&fidelity=' + fid;
  /* The documented simple form. Kept as a last resort because it takes no
     timestamps at all, which rules out a bad range as the cause. */
  const whole = () => 'https://clob.polymarket.com/prices-history?market=' +
    encodeURIComponent(asset) + '&interval=max&fidelity=720';

  const tries = [];
  for (let i = startIdx; i < FIDELITIES.length; i++) tries.push(ranged(FIDELITIES[i]));
  tries.push(whole());

  let why = 'no price history was returned for this market';
  for (const url of tries) {
    try {
      const res = await fetch(url);
      if (!res.ok) {
        /* Keep going: a rejection at one fidelity says nothing about the next,
           and a resolved market rejects everything below 12-hour buckets. */
        why = 'Polymarket answered ' + res.status +
          (res.status === 429 ? ' (rate limited — try again in a moment)' : '');
        continue;
      }
      const body = await res.json();
      const hist = (body && body.history) || [];
      const pts = hist.map((h) => ({ t: num(h.t) * 1000, p: num(h.p) * 100 }))
        .filter((p) => p.t > 0 && p.p > 0)
        .sort((a, b) => a.t - b.t);
      /* Two points is a line. Thin or very new markets genuinely have few. */
      if (pts.length >= 2) { PRICE_CACHE.set(key, pts); PRICE_FAIL.delete(key); return pts; }
      why = pts.length === 1
        ? 'this market has only one recorded price so far'
        : 'no price history was returned for this market';
    } catch (err) {
      why = 'the request was blocked by your browser (' + (err && err.message) + ')';
    }
  }
  PRICE_FAIL.set(key, why);
  return null;
}

const priceFailReason = (asset, fromTs) =>
  PRICE_FAIL.get(asset + ':' + Math.round(fromTs / 36e5)) || null;

/* How a market finally resolved. Needed for positions you sold out of before
   the end: they leave your Polymarket positions, so the only way to score the
   forecast is to ask about the market itself. Strictly best effort — a failure
   leaves the trade unscored rather than guessed at. */
/* Polymarket ships a picture with every market. One batched call to gamma on
   each sync picks up the ones we do not have yet, and the picture is squeezed
   through a canvas into the file itself so it still shows on a plane. If the
   image server refuses a cross-origin read the canvas route fails cleanly and
   we keep the URL instead, which still displays — it just needs a connection. */
const ICON_PX = 72;
async function iconToData(url) {
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const ok = await new Promise((res) => {
      img.onload = () => res(true);
      img.onerror = () => res(false);
      img.src = url;
      setTimeout(() => res(false), 6000);
    });
    if (!ok || !img.width) return null;
    const c = document.createElement('canvas');
    c.width = ICON_PX; c.height = ICON_PX;
    const g = c.getContext('2d');
    /* Cover, not stretch: crop the long side. */
    const side = Math.min(img.width, img.height);
    g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, ICON_PX, ICON_PX);
    const data = c.toDataURL('image/jpeg', 0.82);
    return data && data.length > 128 && data.length < 90000 ? data : null;
  } catch (err) { return null; }
}

async function fetchIcons(conditionIds, note) {
  const out = new Map();
  const ids = (conditionIds || []).filter(Boolean);
  for (let i = 0; i < ids.length; i += 20) {
    const chunk = ids.slice(i, i + 20);
    const url = 'https://gamma-api.polymarket.com/markets?' +
      chunk.map((id) => 'condition_ids=' + encodeURIComponent(id)).join('&');
    try {
      const res = await fetch(url);
      if (!res.ok) { if (note) note('icons: gamma returned ' + res.status); continue; }
      const body = await res.json();
      const list = Array.isArray(body) ? body : [body];
      list.forEach((m) => {
        if (!m || !m.conditionId) return;
        const src = m.icon || m.image ||
          (m.iconOptimized && m.iconOptimized.imageUrlOptimized) ||
          (m.imageOptimized && m.imageOptimized.imageUrlOptimized) || null;
        if (src) out.set(m.conditionId, src);
      });
    } catch (err) { if (note) note('icons: ' + (err && err.message)); }
  }
  return out;
}

async function fetchResolution(conditionId, outcome) {
  if (!conditionId) return null;
  try {
    const res = await fetch('https://gamma-api.polymarket.com/markets?condition_ids=' +
      encodeURIComponent(conditionId));
    if (!res.ok) return null;
    const body = await res.json();
    const m = Array.isArray(body) ? body[0] : body;
    if (!m || m.closed !== true) return null;
    const parse = (v) => {
      if (Array.isArray(v)) return v;
      try { return JSON.parse(v); } catch (e) { return null; }
    };
    const prices = parse(m.outcomePrices);
    const names = parse(m.outcomes);
    if (!Array.isArray(prices) || !prices.length) return null;
    let idx = String(outcome).toUpperCase() === 'NO' ? 1 : 0;
    if (Array.isArray(names) && names.length === prices.length) {
      const byName = names.findIndex((x) => String(x).toUpperCase() === String(outcome).toUpperCase());
      if (byName >= 0) idx = byName;
    }
    const p = num(prices[idx]);
    /* A resolved market pins its winning outcome at 1 and the loser at 0. */
    if (p >= 0.99) return 'won';
    if (p <= 0.01) return 'lost';
    return null;
  } catch (err) { return null; }
}

/* Keep the shape, drop the bulk. Evenly spaced by index, always keeping the
   first and last point and never dropping a local extreme. */
function downsample(pts, target) {
  if (!Array.isArray(pts) || pts.length <= target) return pts || null;
  const keep = new Set([0, pts.length - 1]);
  let hi = 0, lo = 0;
  pts.forEach((p, i) => { if (p.p > pts[hi].p) hi = i; if (p.p < pts[lo].p) lo = i; });
  keep.add(hi); keep.add(lo);
  const step = pts.length / target;
  for (let i = 0; i < target; i++) keep.add(Math.floor(i * step));
  return Array.from(keep).sort((a, b) => a - b).map((i) => pts[i]);
}

/* A wallet keeps holding markets that have already finished — they sit there
   until you redeem them. Those are history, not live bets, so they must not be
   offered up as "new positions". Several signals can indicate it; any one is
   enough, and a missing field is simply not a signal. */
function settledReason(p) {
  if (p.redeemable === true) return 'resolved — awaiting redemption';
  const cur = num(p.curPrice, -1);
  if (cur >= 0 && (cur >= 0.9995 || cur <= 0.0005)) return 'settled at ' + (cur >= 0.5 ? '$1.00' : '$0.00');
  if (p.endDate) {
    const end = new Date(p.endDate);
    if (!isNaN(end) && end < new Date()) return 'market closed ' + end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  return null;
}

/* ---------------------------------------------------------- primitives */
function Btn({ children, onClick, kind = 'default', disabled, style, full, type, ...rest }) {
  const kinds = {
    default: { bg: 'transparent', fg: C.ink2, bd: C.border },
    primary: { bg: C.blue, fg: '#FFFFFF', bd: C.blue },
    ghost:   { bg: 'transparent', fg: C.ink3, bd: 'transparent' },
  };
  const k = kinds[kind] || kinds.default;
  return (
    <button
      {...rest}
      type={type || 'button'}
      onClick={onClick}
      disabled={disabled}
      style={{
        background: k.bg, color: k.fg, border: '1px solid ' + k.bd,
        borderRadius: 6, padding: '8px 14px', fontSize: 13, fontWeight: 600,
        cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.45 : 1,
        width: full ? '100%' : undefined, letterSpacing: 0.2,
        transition: 'background 120ms, border-color 120ms', ...style,
      }}
    >{children}</button>
  );
}

function Card({ children, style, pad = 16 }) {
  return (
    <div style={{
      background: C.card, border: '1px solid ' + C.border, borderRadius: 10,
      padding: pad, ...style,
    }}>{children}</div>
  );
}

function SectionTitle({ children, right }) {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
      <h2 style={{ fontSize: 12, letterSpacing: 1.2, textTransform: 'uppercase', color: C.ink3, margin: 0, fontWeight: 700 }}>{children}</h2>
      {right}
    </div>
  );
}

function StatCard({ label, value, sub, color, delta, onClick }) {
  const card = (
    <Card pad={16}>
      <div style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase', color: C.ink3, fontWeight: 700 }}>{label}</div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 9, marginTop: 8, flexWrap: 'wrap' }}>
        <span style={{ fontFamily: MONO, fontSize: 26, fontWeight: 600, color: color || C.ink, lineHeight: 1.1 }}>{value}</span>
        {delta && (
          <span style={{ fontFamily: MONO, fontSize: 15, fontWeight: 600, color: delta.up ? C.green : C.red }}
            title={delta.title || 'Change over the dashboard window'}>
            ({delta.text})
          </span>
        )}
      </div>
      {sub && <div style={{ fontSize: 12, color: C.ink3, marginTop: 6, fontFamily: MONO }}>{sub}</div>}
    </Card>
  );
  if (!onClick) return card;
  return (
    <div role="button" tabIndex={0} onClick={onClick}
      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onClick(); } }}
      title={'Show ' + String(label).toLowerCase() + ' over time'}
      style={{ cursor: 'pointer', borderRadius: 12 }}>
      {card}
    </div>
  );
}

/* One metric's history, drawn from the rows recorded at each sync. A plain
   line with a marked last point — no axes beyond the two ends, because the
   question is the shape and where it stands now. */
function StatHistoryChart({ points, fmt, color }) {
  const W = 720, H = 220, L = 62, R = 22, T = 18, B = 30;
  if (!Array.isArray(points) || points.length < 2) return null;
  const t0 = points[0].t, t1 = points[points.length - 1].t;
  const vs = points.map((p) => p.v);
  let lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.18;
  lo -= pad; hi += pad;
  const X = (t) => L + (t - t0) / Math.max(t1 - t0, 1) * (W - L - R);
  const Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const d = points.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const last = points[points.length - 1];
  const zero = lo < 0 && hi > 0;
  const ticks = [hi - pad, (lo + hi) / 2, lo + pad];
  const day = (t) => new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="This measure over time"
      style={{ display: 'block', width: '100%', height: H, overflow: 'visible' }}>
      {ticks.map((v, i) => (
        <g key={i}>
          <line x1={L} y1={Y(v)} x2={W - R} y2={Y(v)} stroke="#EDEFF3" strokeWidth="1" />
          <text x={L - 9} y={Y(v) + 4} fill="#8A8F9E" fontSize="11" fontFamily={MONO} textAnchor="end">{fmt(v)}</text>
        </g>
      ))}
      {zero && <line x1={L} y1={Y(0)} x2={W - R} y2={Y(0)} stroke="#C4C9D2" strokeWidth="1" strokeDasharray="3 4" />}
      <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => (
        <circle key={i} cx={X(p.t)} cy={Y(p.v)} r={i === points.length - 1 ? 4.5 : 2.4}
          fill={i === points.length - 1 ? color : '#FFFFFF'} stroke={color} strokeWidth="1.6" />
      ))}
      <text x={X(last.t)} y={Y(last.v) - 12} fill={color} fontSize="12" fontFamily={MONO} textAnchor="end">
        {fmt(last.v)}
      </text>
      <text x={L} y={H - 8} fill="#8A8F9E" fontSize="11" fontFamily={MONO}>{day(t0)}</text>
      <text x={W - R} y={H - 8} fill="#8A8F9E" fontSize="11" fontFamily={MONO} textAnchor="end">{day(t1)}</text>
    </svg>
  );
}

/* Every modal closes three ways: the × in the corner, the Escape key, and —
   where there is nothing half-typed to lose — a tap outside it. There is no
   keyboard on an iPad, so the × is the one that matters. */
function Modal({ title, subtitle, children, onClose, width = 480, dismissOnBackdrop }) {
  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape' && onClose) onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div
      onClick={(e) => {
        if (dismissOnBackdrop && onClose && e.target === e.currentTarget) onClose();
      }}
      style={{
        position: 'fixed', inset: 0, background: 'rgba(11,13,18,0.32)', zIndex: 100,
        display: 'flex', alignItems: 'flex-start', justifyContent: 'center', padding: '6vh 16px 40px', overflowY: 'auto',
      }}>
      <div style={{
        background: C.card, border: '1px solid ' + C.border, borderRadius: 12,
        width: '100%', maxWidth: width, boxShadow: '0 18px 50px rgba(11,13,18,0.18)',
      }}>
        <div style={{ padding: '18px 20px 14px', borderBottom: '1px solid ' + C.border,
          display: 'flex', alignItems: 'flex-start', gap: 12 }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: C.ink }}>{title}</div>
            {subtitle && <div style={{ fontSize: 12.5, color: C.ink3, marginTop: 6, lineHeight: 1.5 }}>{subtitle}</div>}
          </div>
          {onClose && (
            <button onClick={onClose} title="Close" aria-label="Close"
              style={{ flexShrink: 0, width: 30, height: 30, borderRadius: 8, cursor: 'pointer',
                background: 'none', border: '1px solid transparent', color: C.ink3,
                fontSize: 17, lineHeight: 1, display: 'grid', placeItems: 'center', marginTop: -2 }}
              onMouseEnter={(e) => { e.currentTarget.style.background = C.cardAlt;
                e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.ink; }}
              onMouseLeave={(e) => { e.currentTarget.style.background = 'none';
                e.currentTarget.style.borderColor = 'transparent'; e.currentTarget.style.color = C.ink3; }}>
              ×
            </button>
          )}
        </div>
        <div style={{ padding: 20 }}>{children}</div>
      </div>
    </div>
  );
}
