}

/* What a setting is doing to your actual book, right now. The bar is what each
   position would be told to hold; the notch behind it is where the same
   position would sit with this one dial returned to neutral. Drag and watch. */
function BookPreview({ book, settings, trades, baseline, baselineLabel, title, columns }) {
  const [all, setAll] = useState(false);
  const base = useMemo(
    () => Engine.sizeBook(trades, { ...settings, ...baseline }, undefined, undefined),
    [trades, settings, baseline]);
  if (!book || !book.results) return null;
  const rows = Object.keys(book.results)
    .map((k) => {
      const t = trades.find((x) => x.key === k);
      return { k, title: (t && t.title) || k,
        values: (columns || []).map((c) => c.of(t || {}, book.results[k])),
        now: num(book.results[k].suggested),
        base: num(base.results[k] && base.results[k].suggested) };
    })
    .filter((r) => r.now > 0.5 || r.base > 0.5)
    .sort((a, b) => b.now - a.now);
  if (!rows.length) {
    return (
      <div style={{ fontSize: 12.5, color: C.gray, padding: '4px 0 12px' }}>
        Nothing open to show yet.
      </div>
    );
  }
  const top = all ? rows : rows.slice(0, 8);
  const max = Math.max.apply(null, rows.map((r) => Math.max(r.now, r.base)));
  const funded = rows.filter((r) => r.now >= 1).length;
  const fundedBase = rows.filter((r) => r.base >= 1).length;
  const differs = rows.some((r) => Math.abs(r.now - r.base) > 0.5);
  const cols = columns || [];
  const GRID = cols.length
    ? 'minmax(0,88px) ' + cols.map((c) => c.width + 'px').join(' ') + ' 1fr 56px'
    : 'minmax(0,118px) 1fr 64px';
  return (
    <div style={{ border: '1px solid ' + C.border, borderRadius: 10, padding: '13px 14px 10px',
      background: C.cardAlt, marginBottom: 18 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
        gap: 10, marginBottom: 10, flexWrap: 'wrap' }}>
        <span style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase',
          color: C.ink3, fontWeight: 700 }}>{title}</span>
        <span style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3 }}>
          {funded} position{funded === 1 ? '' : 's'} funded
          {funded !== fundedBase ? ' · ' + fundedBase + ' at ' + baselineLabel : ''}
        </span>
      </div>
      {cols.length > 0 && (
        <div style={{ display: 'grid', gridTemplateColumns: GRID, gap: 8, padding: '0 0 4px',
          alignItems: 'end' }}>
          <span />
          {cols.map((c) => (
            <span key={c.label} style={{ fontSize: 9.5, letterSpacing: 0.4, textTransform: 'uppercase',
              color: C.gray, fontWeight: 700, textAlign: 'right', lineHeight: 1.25 }}>{c.label}</span>
          ))}
          <span /><span />
        </div>
      )}
      {top.map((r) => {
        const w = max > 0 ? (r.now / max) * 100 : 0;
        const bw = max > 0 ? (r.base / max) * 100 : 0;
        const up = r.now > r.base + 0.5, down = r.now < r.base - 0.5;
        return (
          <div key={r.k} style={{ display: 'grid', gridTemplateColumns: GRID,
            gap: 8, alignItems: 'center', padding: '3px 0' }}>
            <span style={{ fontSize: 11.5, color: C.ink2, overflow: 'hidden',
              textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.title}</span>
            {r.values.map((v, i) => (
              <span key={i} style={{ fontFamily: MONO, fontSize: 10.5, color: C.ink3,
                textAlign: 'right', whiteSpace: 'nowrap' }}>{v}</span>
            ))}
            <span style={{ position: 'relative', height: 13, background: '#ECEFF3', borderRadius: 3 }}>
              <span style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: w + '%',
                background: up ? C.green : down ? C.orange : C.blue, borderRadius: 3,
                transition: 'width .12s' }} />
              {differs && (
                <span title={'where it would sit at ' + baselineLabel} style={{ position: 'absolute',
                  left: 'calc(' + bw + '% - 1px)', top: -2, bottom: -2, width: 2,
                  background: C.ink2, opacity: 0.55, borderRadius: 1 }} />
              )}
            </span>
            <span style={{ fontFamily: MONO, fontSize: 11.5, textAlign: 'right',
              color: up ? C.green : down ? C.orange : C.ink3 }}>{fmtDollar0(r.now)}</span>
          </div>
        );
      })}
      {rows.length > 8 && (
        <button type="button" onClick={() => setAll((v) => !v)} style={{
          background: 'none', border: 'none', color: C.blue, cursor: 'pointer', padding: '7px 0 0',
          fontSize: 11.5, fontWeight: 600, fontFamily: 'inherit',
        }}>
          {all ? 'Show the top 8 only'
            : 'Show all ' + rows.length + ' — the other ' + (rows.length - 8) + ' share ' +
              fmtDollar0(rows.slice(8).reduce((a, r) => a + r.now, 0))}
        </button>
      )}
      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', alignItems: 'center',
        marginTop: 9, paddingTop: 8, borderTop: '1px solid ' + C.border,
        fontSize: 11.5, color: C.gray }}>
        {[[C.green, 'more than at ' + baselineLabel], [C.orange, 'less'], [C.blue, 'the same']]
          .map(([col, label]) => (
            <span key={label} style={{ display: 'inline-flex', gap: 5, alignItems: 'center' }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: col }} />
              {label}
            </span>
          ))}
        {differs && (
          <span style={{ display: 'inline-flex', gap: 5, alignItems: 'center' }}>
            <span style={{ width: 2, height: 12, background: C.ink2, opacity: 0.55 }} />
            the {baselineLabel} level
          </span>
        )}
      </div>
      {!differs && (
        <div style={{ fontSize: 11.5, color: C.gray, marginTop: 6 }}>
          Identical to {baselineLabel} — this dial is not changing anything yet.
        </div>
      )}
    </div>
  );
}

/* A setting's preview, folded away until asked for, so the panel stays short. */
function Collapsible({ label, children }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ marginTop: -6 }}>
      <button type="button" onClick={() => setOpen((v) => !v)} style={{
        background: 'none', border: 'none', color: C.blue, cursor: 'pointer',
        fontSize: 12.5, fontWeight: 600, padding: '0 0 12px', display: 'inline-flex',
        gap: 6, alignItems: 'center', fontFamily: 'inherit',
      }}>
        <span style={{ fontFamily: MONO, fontSize: 10, display: 'inline-block',
          transform: open ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }}>▶</span>
        {open ? 'Hide' : label}
      </button>
      {open && children}
    </div>
  );
}

const ALL_NEUTRAL = { tilt: 1, k: 1, timeExp: 0 };
/* What each dial acts on, side by side: the clock reads the first, k the
   second, concentration the third — and the third already contains the other
   two, which is the point. */
const PREVIEW_COLUMNS = [
  { label: 'to resolve · if it does', width: 86,
    of: (t, r) => fmtDays(num(r.days)) + ' · ' + fmtAnn(num(r.holdAnn)) },
  { label: 'conviction', width: 56,
    of: (t) => (num(t.myProbability) ? num(t.myProbability) + '%' : '—') },
  { label: 'kelly allows', width: 58,
    of: (t, r) => fmtDollar0(num(r.want)) },
];

/* Every group, held against target. This is the view that answers "how much
   of my book is really one idea", which no single row can show. */
function GroupsTable({ trades, book }) {
  const groups = useMemo(() => groupsOf(trades, book, null)
    .filter((g) => g.members.length > 1), [trades, book]);
  const open = (trades || []).filter((t) => t.status === 'open');
  const held = open.reduce((a, t) => a + num(t.size) * num(t.currentPrice) / 100, 0);

  if (!groups.length) {
    return (
      <div style={{ fontSize: 13, color: C.ink3 }}>
        Nothing is grouped yet. Markets asking one question at several end dates will pair up on
        their own as soon as you hold two of them.
      </div>
    );
  }
  const grouped = groups.reduce((a, g) => a + g.members.reduce(
    (b, m) => b + num(m.size) * num(m.currentPrice) / 100, 0), 0);

  return (
    <div data-groups-table>
      {groups.map((g, i) => {
        const fam = book.families[g.name];
        const gHeld = fam ? fam.actual : 0;
        const over = fam && fam.suggested > 0 && gHeld > fam.suggested * 1.15;
        return (
          <div key={g.name} style={{ borderTop: i === 0 ? 'none' : '1px solid ' + C.border,
            padding: '11px 0' }}>
            <div style={{ display: 'flex', gap: 10, alignItems: 'baseline' }}>
              <span style={{ fontSize: 13.5, color: C.ink, fontWeight: 600, flex: 1, minWidth: 0,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{g.label}</span>
              <span style={{ fontFamily: MONO, fontSize: 13, color: over ? C.orange : C.ink,
                flexShrink: 0 }}>
                {fmtDollar0(gHeld)} <span style={{ color: C.ink3 }}>/ {fmtDollar0(fam ? fam.suggested : 0)}</span>
              </span>
            </div>
            <div style={{ fontFamily: MONO, fontSize: 11, color: C.ink3, marginTop: 4 }}>
              {g.members.length} markets · {g.manual ? 'grouped by hand' : 'same question, different end dates'}
              {held > 0 ? ' · ' + Math.round(gHeld / held * 100) + '% of the book' : ''}
            </div>
            {g.members.map((m) => (
              <div key={m.key} style={{ fontSize: 12, color: C.ink3, marginTop: 3,
                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>· {m.title}</div>
            ))}
          </div>
        );
      })}
      <div style={{ borderTop: '1px solid ' + C.border, marginTop: 4, paddingTop: 10,
        fontFamily: MONO, fontSize: 11.5, color: C.ink3 }}>
        {groups.length} group{groups.length === 1 ? '' : 's'} covering {fmtDollar0(grouped)} —{' '}
        {held > 0 ? Math.round(grouped / held * 100) + '% of what you hold' : 'nothing held'}.
      </div>
    </div>
  );
}

function SettingsTab({ settings, onChange, trades, walletValue }) {
  const s = settings;
  const set = (patch) => onChange({ ...s, ...patch });
  const av = num(s.bankroll) * num(s.capitalInPlay) / 100;
  const book = useMemo(() => Engine.sizeBook(trades, s, undefined, walletValue), [trades, s, walletValue]);
  const activePreset = Engine.PRESETS.find((p) => p.k === s.k && p.timeExp === num(s.timeExp, 0));

  return (
    <div style={{ display: 'grid', gap: 0, maxWidth: 720, margin: '0 auto', width: '100%' }}>
      <SettingsGroup title="Capital" note="Everything the engine suggests is a slice of capital in play, never of your whole bankroll.">
        <Field label="Total portfolio" hint="Cash plus the value of every position. The app reads your position values from Polymarket and works out the cash from this number.">
          <input type="number" min="0" step="100" value={s.bankroll}
            onChange={(e) => set({ bankroll: Math.max(0, parseFloat(e.target.value) || 0) })}
            style={{ ...inputStyle, fontFamily: MONO, fontSize: 16 }} />
        </Field>

        <div style={{ display: 'flex', gap: 7, marginBottom: 14, flexWrap: 'wrap' }}>
          {Engine.CAPITAL_PRESETS.map((p) => (
            <button key={p.label} onClick={() => set({ capitalInPlay: p.pct })} style={{
              background: s.capitalInPlay === p.pct ? C.blue + '18' : C.bg,
              border: '1px solid ' + (s.capitalInPlay === p.pct ? C.blue : C.border),
              color: s.capitalInPlay === p.pct ? C.ink : C.ink3,
              borderRadius: 7, padding: '7px 13px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer',
            }}>{p.label} {p.pct}%</button>
          ))}
        </div>

        <Knob label="Preferred maximum deployed" value={s.capitalInPlay} onChange={(v) => set({ capitalInPlay: v })}
          min={5} max={100} unit="%" hint={'Target ceiling: ' + fmtDollar0(av) + '. Kelly sizes against this when you are below it, so being cautious invites you to put more to work. Go above it and you get a warning, not a forced trim.'} />
      </SettingsGroup>

      <SettingsGroup title="Conviction, clock and concentration"
        note="Three dials over the same book: how hard a stated conviction is discounted, how much a fast market is favoured, and how sharply a short book backs its best ideas.">
        <div style={{ display: 'flex', gap: 7, marginBottom: 16, flexWrap: 'wrap' }}>
          {Engine.PRESETS.map((p) => (
            <button key={p.id} onClick={() => set({ k: p.k, timeExp: p.timeExp })} style={{
              background: activePreset && activePreset.id === p.id ? C.blue + '18' : C.bg,
              border: '1px solid ' + (activePreset && activePreset.id === p.id ? C.blue : C.border),
              color: activePreset && activePreset.id === p.id ? C.ink : C.ink3,
              borderRadius: 7, padding: '7px 12px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer',
            }}>{p.label}{p.star ? ' ★' : ''}</button>
          ))}
        </div>

        <Knob label="Certainty exponent (k)" value={s.k} onChange={(v) => set({ k: v })}
          min={1} max={6} step={0.1}
          hint="How fast position size builds as conviction rises above the floor. Higher means only strong convictions get real size." />


        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(74px, 1fr))', gap: 8,
          background: C.bg, border: '1px solid ' + C.border, borderRadius: 8, padding: 12, marginBottom: 18,
        }}>
          {[95, 90, 85, 80, 75, 70, 60, 50, 40, 30].map((p) => {
            const m = Engine.certainty(p, s.k, s.certFloor);
            return (
              <div key={p} style={{ textAlign: 'center' }}>
                <div style={{ fontFamily: MONO, fontSize: 11, color: C.ink3 }}>{p}%</div>
                <div style={{ fontFamily: MONO, fontSize: 13, fontWeight: 600, marginTop: 3, color: m >= 0.4 ? C.green : m >= 0.15 ? C.blue : C.ink3 }}>
                  {m.toFixed(2)}
                </div>
              </div>
            );
          })}
        </div>

        <Knob label="Time preference (t)" value={num(s.timeExp, 0)} onChange={(v) => set({ timeExp: v })}
          min={0} max={1} step={0.01}
          hint={'A market is weighted by (365 ÷ days to resolve) raised to t, so a market a year ' +
            'out is always neutral. At 0 the clock is ignored and a trade is judged on its edge ' +
            'alone; at 1 money that comes back fast is worth its full compounding rate, which is ' +
            'aggressive. This only decides who gets paid first when your book wants more than ' +
            'your capital holds — with room to spare it changes nothing.'} />

        <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, lineHeight: 1.8, marginBottom: 12 }}>
          {[7, 30, 90, 365, 730].map((d) => (
            <span key={d} style={{ marginRight: 16 }}>
              {d}d → ×{Engine.timeFactor(d, num(s.timeExp, 0)).toFixed(2)}
            </span>
          ))}
        </div>

        <Knob label="Concentration" value={num(s.tilt, 1)} onChange={(v) => set({ tilt: v })}
          min={1} max={6} step={0.1} unit="×"
          hint={'Only bites when your book wants more than the base holds — ' +
            (book.scaled
              ? 'right now it wants ' + fmtDollar0(book.rawTotal) + ' against ' + fmtDollar0(book.av) + '.'
              : 'right now it fits, so this does nothing.') +
            ' At 1.0 the shortfall is shared in proportion to score. Higher, and the trades that ' +
            'score best give up less than the rest.'} />

        <Collapsible label="Show what these three do to your book">
          <BookPreview book={book} settings={s} trades={trades}
            baseline={ALL_NEUTRAL} baselineLabel="all three neutral"
            title={'Your book · k ' + num(s.k, 1) + ' · t ' + num(s.timeExp, 0).toFixed(2) +
              ' · ' + num(s.tilt, 1).toFixed(1) + '×'}
            columns={PREVIEW_COLUMNS} />
        </Collapsible>
      </SettingsGroup>

      <SettingsGroup title="Spike trades" note="Trades where you're betting on a price move rather than the final outcome. Discounted twice: a haircut on the size, and a lower ceiling than normal trades.">
        <Knob label="Spike haircut" value={s.spikeHaircut} onChange={(v) => set({ spikeHaircut: v })}
          min={0.1} max={1} step={0.05}
          hint="Multiplier applied after Kelly. 0.4 keeps 40% of what the maths asks for." />
        <Knob label="Spike cap" value={s.spikeCap} onChange={(v) => set({ spikeCap: v })}
          min={1} max={50} unit="%" hint={'Hard ceiling per spike trade: ' + fmtDollar0(av * s.spikeCap / 100) + '.'} />
      </SettingsGroup>

      <SettingsGroup title="Limits and costs">
        <Knob label="Per-trade cap" value={s.tradeCap} onChange={(v) => set({ tradeCap: v })}
          min={1} max={100} unit="%" hint={'Normal trades: ' + fmtDollar0(av * s.tradeCap / 100) + ' maximum.'} />
        <Knob label="Overnight cap" value={s.overnightCap} onChange={(v) => set({ overnightCap: v })}
          min={1} max={30} unit="%" />
        <Knob label="Safety buffer" value={s.safetyBuffer} onChange={(v) => set({ safetyBuffer: v })}
          min={0} max={10} unit=" pts" hint="Shaved off every stated conviction before sizing. Always shades against the position." />
        <Knob label="Certainty floor" value={s.certFloor} onChange={(v) => set({ certFloor: v })}
          min={0} max={80} unit="%" hint={'Conviction at or below ' + s.certFloor + '% is sized at zero. Above it, size builds at the rate k sets.'} />
        <Knob label="Round-trip spread" value={s.spread} onChange={(v) => set({ spread: v })}
          min={0} max={10} step={0.5} unit="¢" />
        <Knob label="Assumed days when a market has no end date" value={s.defaultDays}
          onChange={(v) => set({ defaultDays: v })} min={1} max={365} unit="d" />
      </SettingsGroup>

      <SettingsGroup title="Groups"
        note={'Markets that share one position. Those asking the same question at different end ' +
          'dates find each other; the rest you put together yourself from a market’s Edit panel. ' +
          'A group is capped at what its strongest single member could hold alone, so grouping ' +
          'never buys more of an idea — it decides how much of your book one idea may occupy.'}>
        <GroupsTable trades={trades} book={book} />
      </SettingsGroup>

      <SettingsGroup title="Close enough"
        note={'A position inside either of these is on target: the dashboard stops asking and the ' +
          'review skips it. Percentage alone is right at the top of the book and absurd at the ' +
          'bottom, where $2 off a $12 target reads as 17%. Dollars alone are right at the bottom ' +
          'and far too fussy at the top. Whichever lets a position off, lets it off.'}>
        <Knob label="Within this much of the target" value={s.tolPct}
          onChange={(v) => set({ tolPct: v })} min={0} max={60} unit="%" />
        <Knob label="…or within this many dollars" value={s.tolDollar}
          onChange={(v) => set({ tolDollar: v })} min={0} max={100} unit="" />
        <div data-tol-count style={{ fontFamily: MONO, fontSize: 12, color: C.ink2 }}>
          {book.reviewCount === 0
            ? 'Every position is on target.'
            : book.reviewCount + ' position' + (book.reviewCount === 1 ? '' : 's') +
              ' off target right now' + (book.pendingCount ? ' · ' + book.pendingCount + ' with an order out' : '') + '.'}
        </div>
      </SettingsGroup>

      <SettingsGroup title="Dashboard comparison"
        note="How far back the dashboard looks when it shows what has changed — on each position's move column, and on the profit factor. Readings are taken at every sync, so the comparison is against the nearest one at or before the window.">
        <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap', marginBottom: 6 }}>
          {LOOKBACKS.map((l) => {
            const on = num(s.lookbackHours, 24) === l.h;
            return (
              <button key={l.h} onClick={() => set({ lookbackHours: l.h })} style={{
                background: on ? C.blue + '18' : C.bg,
                border: '1px solid ' + (on ? C.blue : C.border),
                color: on ? C.ink : C.ink3,
                borderRadius: 7, padding: '7px 12px', fontSize: 12.5, fontWeight: 600,
                cursor: 'pointer', fontFamily: MONO,
              }}>{l.label}</button>
            );
          })}
        </div>
        <div style={{ fontSize: 12.5, color: C.ink3 }}>
          Comparing against {lookbackLabel(s.lookbackHours)} ago. Until a reading that old exists,
          the oldest one held is used instead.
        </div>
      </SettingsGroup>

      <SettingsGroup title="Effect on your current book">
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(130px, 1fr))', gap: 12 }}>
          {[
            ['Capital base', fmtDollar0(book.av), C.ink2],
            ['Kelly wants', fmtDollar0(book.suggestedTotal), C.blue],
            ['In positions', fmtDollar0(book.deployed), book.overCeiling ? C.amber : C.ink],
            ['Cash left', fmtDollar0(book.cash), C.ink2],
            ['Flagged', String(book.flagged), book.flagged ? C.amber : C.green],
          ].map(([l, v, c]) => (
            <div key={l} style={{ background: C.bg, border: '1px solid ' + C.border, borderRadius: 8, padding: 12 }}>
              <div style={{ fontSize: 11, letterSpacing: 0.8, textTransform: 'uppercase', color: C.ink3, fontWeight: 700 }}>{l}</div>
              <div style={{ fontFamily: MONO, fontSize: 19, fontWeight: 600, color: c, marginTop: 5 }}>{v}</div>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 14 }}>
          <Btn onClick={() => onChange({ ...Engine.DEFAULTS })}>Reset everything to defaults</Btn>
        </div>
      </SettingsGroup>
    </div>
  );
}

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
      <Card style={{ maxWidth: 460, width: '100%' }} pad={26}>

          <div style={{ fontFamily: MONO, fontSize: 11, letterSpacing: 2, color: C.blue, fontWeight: 700 }}>POLYMARKET</div>
          <div style={{ fontFamily: MONO, fontSize: 11, color: C.ink3 }}>{APP_VERSION} · {APP_BUILT}</div>
        </div>
        <h1 style={{ fontSize: 22, color: C.ink, margin: '10px 0 8px', fontWeight: 700 }}>Trade Journal</h1>
        <p style={{ fontSize: 13.5, color: C.ink3, lineHeight: 1.6, margin: '0 0 22px' }}>
          Track conviction against outcomes. Enter the wallet address you trade from — positions sync from
          Polymarket's public API, and everything you write stays on this device.
        </p>
        <Field label="Wallet address" hint={v && !ok ? 'Needs to be a 42-character 0x address.' : 'The proxy/funder address your Polymarket positions sit in.'}>
          <input
            value={v} onChange={(e) => setV(e.target.value)} autoFocus
            onKeyDown={(e) => { if (e.key === 'Enter' && ok) onSave(v.trim()); }}
            placeholder="0x…"
            style={{ ...inputStyle, fontFamily: MONO, fontSize: 13 }}
          />
        </Field>
        <Btn kind="primary" full disabled={!ok} onClick={() => onSave(v.trim())}>Start tracking</Btn>

        {Store.ephemeral && (
          <div style={{
            marginTop: 18, border: '1px solid ' + C.amber + '44', background: C.amber + '10',
            borderRadius: 8, padding: '10px 12px', fontSize: 12.5, color: C.amber, lineHeight: 1.55,
          }}>
            This page could not reach a working storage API, so anything you log will be lost on reload.
            The journal still runs — but check this before you rely on it.
            <button onClick={onDiagnostics} style={{
              display: 'block', marginTop: 8, background: 'transparent',
              border: '1px solid ' + C.amber + '55', color: C.amber, fontSize: 11.5,
              fontWeight: 700, cursor: 'pointer', borderRadius: 5, padding: '3px 9px',
            }}>What went wrong?</button>
          </div>
        )}
      </Card>
    </div>
  );
}

/* ================================================================ APP */
function App() {
  const [ready, setReady] = useState(false);
  const [wallet, setWallet] = useState(null);
  const [trades, setTrades] = useState([]);
  const [tab, setTab] = useState('dashboard');
  const [syncing, setSyncing] = useState(false);
  const [status, setStatus] = useState(null);   // {kind:'ok'|'error'|'info', text}
  const [queue, setQueue] = useState([]);       // pending modals
  const [editWallet, setEditWallet] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [showDiag, setShowDiag] = useState(false);
  const [editTrade, setEditTrade] = useState(null);
  const [ignored, setIgnored] = useState([]);   // positions deliberately not tracked
  const [picker, setPicker] = useState(null);
  const [settings, setSettings] = useState(Engine.DEFAULTS);
  const [walletValue, setWalletValue] = useState(null);
  const [statsHistory, setStatsHistory] = useState([]);
  const [showReview, setShowReview] = useState(false);

  /* ---- boot */
  useEffect(() => {
    (async () => {
      const w = await Store.get(K_WALLET, null);
      const t = await Store.get(K_TRADES, []);
      const ig = await Store.get(K_IGNORED, []);
      const cfg = await Store.get(K_SETTINGS, null);
      const wv = await Store.get(K_WALLETVAL, null);
      const sh = await Store.get(K_STATS, []);
      setWallet(w);
      setTrades(Array.isArray(t) ? t : []);
      setIgnored(Array.isArray(ig) ? ig : []);
      if (cfg && typeof cfg === 'object') {
        const merged = Object.assign({}, Engine.DEFAULTS, cfg);
        /* The clock used to be a named damping preset. Carry the old choice
           across as the exponent that behaves the same way. */
        if (cfg.timeExp === undefined && cfg.timePref !== undefined) {
          merged.timeExp = num(Engine.TIME_PRESET_EXP[cfg.timePref], Engine.DEFAULTS.timeExp);
        }
        setSettings(merged);
      }
      if (Number.isFinite(+wv)) setWalletValue(+wv);
      setStatsHistory(Array.isArray(sh) ? sh : []);
      setReady(true);
    })();
  }, []);

  const persist = useCallback((next) => {
    setTrades(next);
    Store.set(K_TRADES, next);
  }, []);

  const persistSettings = useCallback((next) => {
    setSettings(next);
    Store.set(K_SETTINGS, next);
  }, []);

  const persistIgnored = useCallback((next) => {
    setIgnored(next);
    Store.set(K_IGNORED, next);
  }, []);

  const saveWallet = useCallback((w) => {
    setWallet(w);
    Store.set(K_WALLET, w);
  }, []);

  /* ---- sync */
  const apiUrl = 'https://data-api.polymarket.com/positions?user=' + encodeURIComponent(wallet || '') + '&limit=500';

  /* Turns a raw positions array into queued modals + silent price updates.
     Shared by the live sync and the manual paste-in fallback. */
  const ingest = useCallback((raw, label, ledger) => {
    const fillsById = ledger instanceof Map ? ledger : new Map();
    const fillsFor = (p) => fillsById.get(p.asset) || fillsById.get(p.conditionId) || [];

    /* One position = the fills since the holding was last flat. Everything
       about it — what you paid, when you started, what you have banked — is
       replayed from those fills rather than read off a field. */
    const describe = (p) => {
      const eps = Engine.episodes(fillsFor(p));
      const cur = eps.length ? eps[eps.length - 1] : null;
      const priors = eps.length > 1 ? eps.slice(0, -1) : [];
      if (!cur || !cur.fills.length) {
        return { ...p, fills: [], priorEpisodes: priors.length,
          entryPrice: num(p.apiAvg) > 0 ? p.apiAvg : p.currentPrice,
          entryPriceSource: num(p.apiAvg) > 0 ? 'avgPrice' : 'estimate',
          entryPriceEstimated: !(num(p.apiAvg) > 0),
          openedAt: null, realised: 0, ledgerShares: null };
      }
      const pos = Engine.positionFrom(cur.fills);
      /* Capital-weighted start: the denominator for rate of return. */
      const buys = cur.fills.filter((f) => f.side === 'BUY');
      const wsh = buys.reduce((a, f) => a + num(f.shares), 0);
      const weightedEntryAt = wsh > 0
        ? buys.reduce((a, f) => a + num(f.shares) * f.t, 0) / wsh : cur.opened;
      return { ...p,
        fills: cur.fills,
        weightedEntryAt,
        priorEpisodes: priors.length,
        priorClosedAt: priors.length ? priors[priors.length - 1].closed : null,
        priorShares: priors.length ? Engine.positionFrom(priors[priors.length - 1].fills).bought : 0,
        entryPrice: pos.avg,
        entryPriceSource: 'fills',
        entryPriceEstimated: false,
        openedAt: cur.opened,
        realised: pos.realised,
        ledgerShares: pos.shares,
        /* The fills should add up to what the wallet says you hold. If they do
           not, something reached the position that was not a buy or a sell and
           the average price is only as good as the part we can see. */
        ledgerMismatch: Math.abs(pos.shares - num(p.size)) > Math.max(num(p.size) * 0.01, 0.05)
          ? num(p.size) - pos.shares : 0,
        buys: pos.buys, sells: pos.sells, avgOut: pos.avgOut,
      };
    };

    const all = raw
      .filter((p) => p && p.conditionId && num(p.size) > 0)
      .map((p) => ({
        key: p.conditionId + '::' + String(p.outcome || '').toUpperCase(),
        conditionId: p.conditionId,
        asset: p.asset || p.tokenId || p.token_id || null,
        title: p.title || p.slug || 'Untitled market',
        outcome: String(p.outcome || '').toUpperCase() === 'YES' ? 'YES' : 'NO',
        slug: p.slug || p.eventSlug || '',
        eventSlug: p.eventSlug || '',
        size: num(p.size),
        apiAvg: num(p.avgPrice) * 100,
        currentPrice: num(p.curPrice) * 100,
        endDate: p.endDate || null,
        settled: settledReason(p),
      }))
      .map(describe);

    /* Every live position counts as deployed capital, including ones you
       chose not to journal. */
    const walletTotal = all.reduce((a, p) => a + num(p.size) * num(p.currentPrice) / 100, 0);
    setWalletValue(walletTotal);
    Store.set(K_WALLETVAL, walletTotal);

    const live = all.filter((p) => !p.settled);
    const liveByKey = new Map(live.map((p) => [p.key, p]));
    const allByKey = new Map(all.map((p) => [p.key, p]));
    const known = new Map(trades.map((t) => [t.key, t]));

    const newPositions = live.filter((p) => !known.has(p.key) && !ignored.includes(p.key));

    /* A position is finished when it leaves the wallet, or when it is still
       sitting there but the market has resolved. Either way the ledger already
       says what happened, so nothing is asked. */
    const closing = trades.filter((t) => {
      if (t.status !== 'open') return false;
      const stillLive = liveByKey.has(t.key);
      const settledHere = allByKey.get(t.key);
      return !stillLive || (settledHere && settledHere.settled);
    });

    const stamp = new Date().toISOString();
    const closedKeys = new Set(closing.map((t) => t.key));

    const updated = trades.map((t) => {
      if (t.status !== 'open') return t;

      if (closedKeys.has(t.key)) {
        const s = allByKey.get(t.key);
        const eps = Engine.episodes(
          fillsById.get(t.asset) || fillsById.get(t.conditionId) || []);
        const ep = eps.length ? eps[eps.length - 1] : null;
        const pos = ep ? Engine.positionFrom(ep.fills) : null;
        /* Sold out, or the market resolved under you. Resolution pins the
           price at a dollar or nothing, and that is the exit. */
        const resolvedHere = s && s.settled;
        const won = resolvedHere ? num(s.currentPrice) >= 50 : null;
        const soldOut = pos && pos.sells > 0 && pos.shares <= 0.05;
        const exitPrice = resolvedHere ? (won ? 100 : 0)
          : (soldOut ? pos.avgOut : num(t.currentPrice));
        const exitDate = soldOut && ep && ep.closed ? new Date(ep.closed).toISOString() : stamp;
        const openedAt = ep ? ep.opened : new Date(t.entryDate || Date.now()).getTime();
        return {
          ...t,
          status: 'closed',
          fills: ep ? ep.fills : (t.fills || []),
          openedAt,
          closedAt: new Date(exitDate).getTime(),
          exitPrice, exitDate,
          resolution: resolvedHere ? (won ? 'won' : 'lost') : null,
          won: resolvedHere ? won : null,
          holdDays: (new Date(exitDate).getTime() - openedAt) / 86400000,
          pnlDollar: pos ? pos.realised + (resolvedHere && pos.shares > 0
            ? pos.shares * (exitPrice - pos.avg) / 100 : 0) : null,
          entryPrice: pos ? pos.avg : t.entryPrice,
          factsPending: true,
        };
      }

      const l = liveByKey.get(t.key);
      if (!l) return t;
      /* Everything the ledger owns is refreshed on every sync — cost basis is
         a live number, not a fact recorded once. A price or date typed in by
         hand is the one thing never overwritten. */
      return {
        ...t,
        fills: l.fills && l.fills.length ? l.fills : (t.fills || []),
        realised: num(l.realised),
        priorEpisodes: num(l.priorEpisodes),
        priorClosedAt: l.priorClosedAt || null,
        priorShares: num(l.priorShares),
        ledgerMismatch: num(l.ledgerMismatch),
        ...(t.entryPriceManual ? {} : {
          entryPrice: l.entryPrice,
          entryPriceSource: l.entryPriceSource,
          entryPriceEstimated: !!l.entryPriceEstimated,
          apiAvg: l.apiAvg,
        }),
        ...(l.openedAt && !t.entryDateManual ? {
          entryDate: new Date(l.openedAt).toISOString(),
          openedAt: l.openedAt,
          weightedEntryAt: l.weightedEntryAt || l.openedAt,
          entryDateSource: 'fills',
        } : {}),
        currentPrice: l.currentPrice,
        size: l.size,
        title: l.title || t.title,
        endDate: l.endDate || t.endDate,
        asset: t.asset || l.asset || null,
        track: trackPrice(t.track, l.currentPrice, stamp),
      };
    });
    persist(updated);

    /* Pictures for anything we do not have one for yet. Best effort and always
       after the sync has been saved: a market with no icon is a cosmetic loss,
       never a reason for the sync to fail. */
    const needIcons = updated.filter((t) => t.status === 'open' && !t.icon && t.conditionId);
    if (needIcons.length) {
      fetchIcons(needIcons.map((t) => t.conditionId), (m) => Store.note(m))
        .then(async (urls) => {
          if (!urls.size) return;
          const resolved = new Map();
          for (const [id, url] of urls) {
            resolved.set(id, (await iconToData(url)) || url);
          }
          setTrades((cur) => {
            const next = cur.map((t) => (resolved.has(t.conditionId) && !t.icon
              ? { ...t, icon: resolved.get(t.conditionId) } : t));
            Store.set(K_TRADES, next);
            return next;
          });
        })
        .catch(() => {});
    }

    /* One reading of the four headline numbers per sync, so each tile can say
       what changed and draw where it has been. Taken from the trades this sync
       just wrote, not from React state, which has not caught up yet. */
    setStatsHistory((h) => {
      const next = pushStats(h, statsFrom(updated), stamp);
      Store.set(K_STATS, next);
      return next;
    });

    /* First run with a wallet full of history: don't fire a questionnaire per
       position. Show the list and let the trader choose what to track. */
    if (trades.length === 0 && newPositions.length > 1) {
      setPicker({ positions: newPositions, settledCount: all.length - live.length });
      setStatus({
        kind: 'ok',
        text: label + ' ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) +
          ' · found ' + live.length + ' current position' + (live.length === 1 ? '' : 's') +
          (all.length - live.length ? ' · skipped ' + (all.length - live.length) + ' already resolved' : ''),
      });
      return;
    }

    /* Only new positions ask anything, and only for the one thing the wallet
       cannot tell us: what you think. Exits are never asked about. */
    setQueue(newPositions.map((p) => ({ type: 'new', pos: p })));

    const bits = [];
    bits.push(live.length + ' live position' + (live.length === 1 ? '' : 's'));
    if (all.length - live.length) bits.push((all.length - live.length) + ' resolved, ignored');
    if (newPositions.length) bits.push(newPositions.length + ' new');
    if (closing.length) bits.push(closing.length + ' closed automatically');
    setStatus({
      kind: 'ok',
      text: label + ' ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) + ' · ' + bits.join(' · '),
    });
  }, [trades, ignored, persist]);

  const sync = useCallback(async () => {
    if (!wallet || syncing) return;
    setSyncing(true);
    setStatus({ kind: 'info', text: 'Fetching positions…' });
    try {
      const res = await fetch(apiUrl);
      if (!res.ok) throw new Error('Polymarket returned ' + res.status + ' ' + res.statusText +
        (res.status === 400 ? ' — check the wallet address is the one your positions are held in.' : ''));
      const raw = await res.json();
      if (!Array.isArray(raw)) throw new Error('Unexpected response shape from Polymarket.');
      /* Best-effort second call. Positions are the point; real purchase dates
         are an improvement on top, so a failure here must not lose the sync. */
      setStatus({ kind: 'info', text: 'Reading your trade history…' });
      const fills = await fetchFills(wallet, (m) => Store.note(m)).catch(() => new Map());
      ingest(raw, 'Synced', fills);
    } catch (err) {
      const blocked = err && (err.name === 'TypeError' || /load failed|failed to fetch|networkerror/i.test(err.message || ''));
      setStatus({
        kind: 'error',
        text: blocked
          ? 'The browser blocked the request before it reached Polymarket (' + (err.message || 'network error') +
            '). This is the page sandbox or CORS, not your wallet — nothing you have logged is affected.'
          : (err && err.message) || 'Unknown error while syncing.',
        offerImport: true,
      });
    }
    setSyncing(false);
  }, [wallet, syncing, apiUrl, ingest]);

  /* ---- modal queue handlers */
  const head = queue[0] || null;
  const advance = () => setQueue((q) => q.slice(1));

  const handleNewSave = (details) => {
    const p = head.pos;
    const rec = {
      key: p.key, conditionId: p.conditionId, title: p.title, outcome: p.outcome,
      slug: p.slug, eventSlug: p.eventSlug,
      size: p.size, entryPrice: p.entryPrice, currentPrice: p.currentPrice,
      entryPriceEstimated: !!p.entryPriceEstimated,
      entryPriceSource: p.entryPriceSource || null,
      entryUnbought: num(p.entryUnbought), entryTranches: p.entryTranches || null,
      apiAvg: p.apiAvg,
      endDate: p.endDate || null,
      asset: p.asset || null,
      track: trackPrice(null, p.currentPrice, new Date().toISOString()),
      entryDate: p.openedAt ? new Date(p.openedAt).toISOString() : new Date().toISOString(),
      entryDateSource: p.openedAt ? 'fills' : 'journal',
      mode: (details && details.mode) || 'resolution',
      overnight: false, daysOverride: null,
      exitTarget: details && details.exitTarget != null ? details.exitTarget : null,
      stopPrice: details && details.stopPrice != null ? details.stopPrice : null,
      expectedDays: details && details.expectedDays != null ? details.expectedDays : null,
      myProbability: details ? details.myProbability : null,
      convictionHistory: details && details.myProbability != null
        ? [{ t: Date.now(), value: num(details.myProbability) }] : [],
      fills: p.fills || [],
      openedAt: p.openedAt || Date.now(),
      weightedEntryAt: p.weightedEntryAt || p.openedAt || Date.now(),
      realised: num(p.realised),
      priorEpisodes: num(p.priorEpisodes),
      priorClosedAt: p.priorClosedAt || null,
      priorShares: num(p.priorShares),
      ledgerMismatch: num(p.ledgerMismatch),
      thesis: '', infoSource: null,
      status: 'open',
      exitPrice: null, exitDate: null, exitReason: null,
      pnlDollar: null, exitQuality: null, holdDays: null, won: null,
    };
    persist([...trades.filter((t) => t.key !== rec.key), rec]);
    advance();
  };

  /* When a position closes, its price history is on a clock: Polymarket drops
     to 12-hour buckets the moment the market resolves, and the journal prunes
     old series after a year. So everything the analysis will ever need is
     worked out now, while the detail still exists, and stored as plain facts.
     The series itself becomes disposable. */
  const settleClosed = useCallback(async (list) => {
    const pending = list.filter((t) => t.status === 'closed' && t.factsPending && t.asset);
    if (!pending.length) return;
    const done = [];
    for (const t of pending) {
      const from = num(t.openedAt) || new Date(t.entryDate || Date.now()).getTime();
      const to = num(t.closedAt) || Date.now();
      let series = null;
      try { series = await fetchPriceSeries(t.asset, from - 2 * 86400000, to + 2 * 86400000); }
      catch (e) { series = null; }
      /* If the market resolved under you we already know. If you sold out
         first, ask the market. */
      let resolution = t.resolution || null;
      if (!resolution) resolution = await fetchResolution(t.conditionId, t.outcome);
      const facts = Engine.factsFor({ ...t, resolution }, series || [], settings);
      done.push({ key: t.key, facts, resolution,
        series: series ? downsample(series, 400) : null,
        coarse: !series });
    }
    if (!done.length) return;
    const byKey = new Map(done.map((d) => [d.key, d]));
    setTrades((cur) => {
      const next = cur.map((t) => {
        const d = byKey.get(t.key);
        if (!d) return t;
        return { ...t, facts: d.facts, series: d.series,
          resolution: d.resolution || t.resolution || null,
          won: d.resolution ? d.resolution === 'won' : t.won,
          seriesCoarse: d.coarse, factsPending: false };
      });
      Store.set(K_TRADES, next);
      return next;
    });
    Store.note('Froze analysis facts for ' + done.length + ' closed position' +
      (done.length === 1 ? '' : 's') + '.');
  }, [settings]);

  useEffect(() => {
    if (trades.some((t) => t.status === 'closed' && t.factsPending)) settleClosed(trades);
  }, [trades, settleClosed]);

  /* A year on, the price path is the only large thing in the file. Drop it and
     keep a sixty-point outline so the chart still draws a shape; the facts
     stay untouched. */
  const prunable = useMemo(() => trades.filter((t) => t.status === 'closed' &&
    t.series && t.series.length > 70 &&
    num(t.closedAt) > 0 &&
    (Date.now() - num(t.closedAt)) / 86400000 > num(settings.pruneAfterDays, 365)), [trades, settings]);

  useEffect(() => {
    if (!prunable.length) return;
    const keys = new Set(prunable.map((t) => t.key));
    setTrades((cur) => {
      const next = cur.map((t) => (keys.has(t.key)
        ? { ...t, series: downsample(t.series, 60), seriesPruned: true } : t));
      Store.set(K_TRADES, next);
      return next;
    });
  }, [prunable.length]);

  /* What has been captured so far for the fluctuation analysis. */
  const priceTracking = useMemo(() => {
    const withId = trades.filter((t) => t.asset).length;
    const samples = trades.reduce((a, t) => a + num(t.track && t.track.n), 0);
    if (!samples) return 'no price history captured yet';
    return samples + ' price sample' + (samples === 1 ? '' : 's') + ' · ' + withId + ' with token ids';
  }, [trades]);

  /* Sizing runs over the whole open book, because correlation and the
     capital ceiling are portfolio-level effects. */
  const book = useMemo(
    () => Engine.sizeBook(trades, settings, undefined, walletValue),
    [trades, settings, walletValue]);
  const sizedTrades = useMemo(
    () => trades.map((t) => ({ ...t, sizing: book.results[t.key] || null })),
    [trades, book]);

  /* Every change of mind is kept. Calibration has to score the number you
     held when you bought, not the one you have talked yourself into since —
     and seeing the revisions against the price line is half the point of the
     chart. */
  const updateTrade = useCallback((key, patch) => {
    persist(trades.map((t) => {
      if (t.key !== key) return t;
      const next = { ...t, ...patch };
      if (patch.myProbability != null && num(patch.myProbability) !== num(t.myProbability)) {
        const hist = Array.isArray(t.convictionHistory) ? t.convictionHistory.slice() : [];
        hist.push({ t: Date.now(), value: num(patch.myProbability) });
        next.convictionHistory = hist;
      }
      return next;
    }));
  }, [trades, persist]);

  const editProb = useCallback((key, v) => {
    updateTrade(key, { myProbability: v });
  }, [updateTrade]);

  /* ---- review */

  /* Open on fresh prices: a pass worked out against yesterday's book is a
     pass worked out against the wrong book. */
  const openReview = useCallback(async () => {
    /* A sync that hangs must not hold the review hostage: after fifteen
       seconds it opens on what is already on screen, and the banner says
       why the prices are not fresh. */
    if (wallet && !syncing) {
      await Promise.race([sync(), new Promise((r) => setTimeout(r, 15000))]);
    }
    setShowReview(true);
  }, [wallet, syncing, sync]);

  /* Nothing here places an order. It records what you said you did, holds the
     dollars of anything still working, and then re-reads reality. */
  const finishReview = useCallback((decisions, targets, convictions) => {
    const next = trades.map((t) => {
      const d = decisions[t.key];
      const conv = convictions[t.key];
      let out = t;
      if (conv !== undefined && conv !== '' && num(conv) !== num(t.myProbability)) {
        const hist = Array.isArray(t.convictionHistory) ? t.convictionHistory.slice() : [];
        hist.push({ t: Date.now(), value: num(conv) });
        out = { ...out, myProbability: num(conv), convictionHistory: hist };
      }
      if (!d) return out;
      if (d.action === 'order') {
        out = { ...out, order: { target: num(targets[t.key]), placedAt: Date.now() } };
      } else if (d.action === 'done' && out.order) {
        out = { ...out };
        delete out.order;
      }
      return out;
    });
    persist(next);
    setShowReview(false);
    const acted = Object.keys(decisions).filter((k) => decisions[k].action !== 'ignore').length;
    if (acted && wallet) setTimeout(() => { sync(); }, 60);
    else setStatus({ kind: 'ok', text: 'Review closed — nothing changed.' });
  }, [trades, persist, wallet, sync]);

  /* An order that has arrived stops being an order. Nothing to confirm: the
     position is the confirmation. */
  useEffect(() => {
    if (!ready) return;
    const filled = trades.filter((t) => t.order && book.results[t.key] && book.results[t.key].orderFilled);
    if (!filled.length) return;
    persist(trades.map((t) => {
      if (filled.indexOf(t) < 0) return t;
      const c = { ...t };
      delete c.order;
      return c;
    }));
  }, [book, trades, ready, persist]);

  /* Removing a trade also marks it ignored, so the next sync does not simply
     offer it back again. */
  const deleteTrade = useCallback((key) => {
    const gone = trades.find((t) => t.key === key);
    persist(trades.filter((t) => t.key !== key));
    if (gone && gone.status === 'open') persistIgnored([...ignored, key]);
    setStatus({ kind: 'ok', text: 'Removed from journal' + (gone && gone.status === 'open' ? ' — it will not be offered again' : '') + '.' });
  }, [trades, ignored, persist, persistIgnored]);

  const clearAll = useCallback(() => {
    persist([]);
    persistIgnored([]);
    setQueue([]);
    setPicker(null);
    setShowDiag(false);
    setStatus({ kind: 'ok', text: 'Journal cleared. Hit Sync to start again from your current positions.' });
  }, [persist, persistIgnored]);

  /* Backup / restore. Entries live in browser storage, which is tied to this
     browser rather than to the file, so a portable copy matters. */
  /* Everything that cannot be rebuilt from Polymarket: your convictions and
     their history, the groups you made, every setting, the price series. The
     positions themselves come back on the next sync regardless. */
  const backupText = useCallback(() => JSON.stringify({
    app: 'polymarket-trade-journal', version: 2, build: APP_VERSION,
    savedAt: new Date().toISOString(), wallet, trades, ignored, settings, statsHistory,
  }, null, 2), [wallet, trades, ignored, settings, statsHistory]);

  /* Two ways to hand you a file, because the page runs in two places. Opened
     from a browser it is an ordinary download; hosted on claude.ai the page is
     sandboxed and a download link does nothing, so the save goes through the
     host, which asks you to confirm it. Either way "Show it as text" is there
     when neither works. */
  const backup = useCallback(async () => {
    const text = backupText();
    const name = 'trade-journal-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    try {
      const dl = (window.claude && typeof window.claude.use === 'function')
        ? await window.claude.use('downloads') : null;
      if (dl) {
        try {
          await dl.save({ filename: name, data: text });
          setStatus({ kind: 'ok', text: 'Backup saved.' });
        } catch (err) {
          const code = (err && err.code) || '';
          setStatus({
            kind: code === 'declined' ? 'ok' : 'error',
            text: code === 'declined'
              ? 'Backup not saved — you cancelled it.'
              : 'Could not save the backup (' + (code || (err && err.message) || 'unknown') +
                '). Use "Show it as text" and copy it somewhere instead.',
          });
        }
        return;
      }
    } catch (e) { /* no host to ask — fall through to an ordinary download */ }
    try {
      const blob = new Blob([text], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 2000);
      setStatus({ kind: 'ok', text: 'Backup saved. If no file appeared, use "Show it as text" instead.' });
    } catch (e) {
      setStatus({ kind: 'error', text: 'Could not save the backup: ' + ((e && e.message) || e) +
        ' — use "Show it as text" instead.' });
    }
  }, [backupText]);

  const restoreText = useCallback((text) => {
    try {
      const d = JSON.parse(String(text));
      const list = Array.isArray(d) ? d : d.trades;
      if (!Array.isArray(list)) throw new Error('no trades found in that text');
      persist(list);
      if (d.ignored && Array.isArray(d.ignored)) persistIgnored(d.ignored);
      if (d.settings && typeof d.settings === 'object') {
        persistSettings(Object.assign({}, Engine.DEFAULTS, d.settings));
      }
      if (Array.isArray(d.statsHistory)) { setStatsHistory(d.statsHistory); Store.set(K_STATS, d.statsHistory); }
      if (d.wallet && !wallet) saveWallet(d.wallet);
      setShowDiag(false);
      setStatus({ kind: 'ok', text: 'Restored ' + list.length + ' trade' + (list.length === 1 ? '' : 's') + '.' });
    } catch (e) {
      setStatus({ kind: 'error', text: 'That backup could not be read: ' + ((e && e.message) || e) });
    }
  }, [persist, persistIgnored, persistSettings, saveWallet, wallet]);

  const restore = useCallback((file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(String(reader.result));
        const list = Array.isArray(d) ? d : d.trades;
        if (!Array.isArray(list)) throw new Error('no trades found in that file');
        persist(list);
        if (d.ignored && Array.isArray(d.ignored)) persistIgnored(d.ignored);
        if (d.settings && typeof d.settings === 'object') {
          persistSettings(Object.assign({}, Engine.DEFAULTS, d.settings));
        }
        if (Array.isArray(d.statsHistory)) { setStatsHistory(d.statsHistory); Store.set(K_STATS, d.statsHistory); }
        if (d.wallet && !wallet) saveWallet(d.wallet);
        setShowDiag(false);
        setStatus({ kind: 'ok', text: 'Restored ' + list.length + ' trade' + (list.length === 1 ? '' : 's') + ' from backup.' });
      } catch (e) {
        setStatus({ kind: 'error', text: 'That backup could not be read: ' + ((e && e.message) || e) });
      }
    };
    reader.onerror = () => setStatus({ kind: 'error', text: 'Could not read that file.' });
    reader.readAsText(file);
  }, [persist, persistIgnored, persistSettings, saveWallet, wallet]);

  /* "Don't track" is permanent — the position is remembered as ignored so it
     never queues a prompt again, on this or any future sync. */
  const handleNewIgnore = () => {
    persistIgnored([...ignored, head.pos.key]);
    advance();
  };

  const handlePickerConfirm = (picked, skipped) => {
    persistIgnored([...ignored, ...skipped.map((p) => p.key)]);
    setQueue(picked.map((p) => ({ type: 'new', pos: p })));
    setPicker(null);
  };

  if (!ready) {
    return <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', color: C.ink3, fontFamily: MONO, fontSize: 13 }}>Loading journal…</div>;
  }
  if (!wallet) {
    return (
      <React.Fragment>
        <WalletGate onSave={saveWallet} onDiagnostics={() => setShowDiag(true)} />
        {showDiag && (
          <DiagnosticsPanel onClose={() => setShowDiag(false)}
            onBackup={backup} onRestore={restore} onClearAll={clearAll}
            backupText={backupText} onRestoreText={restoreText}
            tradeCount={trades.length} priceTracking={priceTracking} />
        )}
      </React.Fragment>
    );
  }

  const TABS = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'settings', label: 'Settings' },
  ];

  return (
    <div style={{ minHeight: '100vh' }}>
      {/* nav */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 50, background: 'rgba(7,9,15,0.92)',
        backdropFilter: 'blur(10px)', borderBottom: '1px solid ' + C.border,
      }}>
        <div style={{
          maxWidth: 1180, margin: '0 auto', padding: '11px 20px',
          display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap',
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
            <div style={{ width: 8, height: 8, background: C.blue, borderRadius: 2 }} />
            <span style={{ fontSize: 13.5, fontWeight: 700, color: C.ink, letterSpacing: 0.2 }}>Trade Journal</span>
            <span title={'Build ' + APP_VERSION + ' — ' + APP_BUILT} style={{
              fontFamily: MONO, fontSize: 11, color: C.blue, background: C.blue + '18',
              border: '1px solid ' + C.blue + '3A', borderRadius: 4, padding: '1px 6px', fontWeight: 700,
            }}>{APP_VERSION}</span>
          </div>

          <div style={{ display: 'flex', gap: 3, background: C.card, border: '1px solid ' + C.border, borderRadius: 8, padding: 3 }}>
            {TABS.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{
                background: tab === t.id ? C.border : 'transparent',
                color: tab === t.id ? C.ink : C.ink3,
                border: 'none', borderRadius: 6, padding: '6px 13px',
                fontSize: 12.5, fontWeight: 600, cursor: 'pointer',
              }}>{t.label}</button>
            ))}
          </div>

          <div style={{ flex: 1 }} />

          <button title={wallet + ' — click to change'} onClick={() => setEditWallet(wallet)} style={{
            fontFamily: MONO, fontSize: 12, color: C.ink3, border: '1px solid ' + C.border,
            borderRadius: 6, padding: '5px 9px', background: C.card, cursor: 'pointer',
          }}>{shortAddr(wallet)}</button>

          <button data-review-open title={book.reviewCount
            ? book.reviewCount + ' position' + (book.reviewCount === 1 ? '' : 's') + ' off target — walk through them one at a time'
            : 'Every position is on target'}
            onClick={openReview} disabled={syncing} style={{
              display: 'flex', alignItems: 'center', gap: 7, cursor: syncing ? 'default' : 'pointer',
              fontSize: 12.5, fontWeight: 600, borderRadius: 6, padding: '5px 11px',
              background: C.card, color: book.reviewCount ? C.ink : C.ink3,
              border: '1px solid ' + (book.reviewCount ? C.blue + '55' : C.border),
            }}>
            Review
            {book.reviewCount > 0 && (
              <span data-review-count style={{
                fontFamily: MONO, fontSize: 11, fontWeight: 700, color: '#fff', background: C.blue,
                borderRadius: 10, padding: '1px 7px', lineHeight: 1.5,
              }}>{book.reviewCount}</span>
            )}
          </button>

          <button title="Diagnostics" onClick={() => setShowDiag(true)} style={{
            fontFamily: MONO, fontSize: 12, color: Store.ephemeral ? C.amber : C.ink3,
            border: '1px solid ' + (Store.ephemeral ? C.amber + '55' : C.border),
            borderRadius: 6, padding: '5px 9px', background: C.card, cursor: 'pointer',
          }}>⚙ Logs</button>

          <Btn kind="primary" onClick={sync} disabled={syncing}>
            {syncing ? 'Syncing…' : 'Sync'}
          </Btn>
        </div>

        {status && (
          <div style={{
            borderTop: '1px solid ' + C.border,
            background: status.kind === 'error' ? C.red + '12' : C.card,
          }}>
            <div style={{
              maxWidth: 1180, margin: '0 auto', padding: '8px 20px',
              display: 'flex', gap: 10, alignItems: 'flex-start',
              fontSize: 12.5, lineHeight: 1.5,
              color: status.kind === 'error' ? C.red : status.kind === 'ok' ? C.ink3 : C.ink3,
            }}>
              <span style={{ fontFamily: MONO, flexShrink: 0, color: status.kind === 'error' ? C.red : status.kind === 'ok' ? C.green : C.blue }}>
                {status.kind === 'error' ? '!' : status.kind === 'ok' ? '✓' : '…'}
              </span>
              <span style={{ fontFamily: status.kind === 'ok' ? MONO : 'inherit' }}>{status.text}</span>
              {status.kind === 'error' && (
                <span style={{ marginLeft: 'auto', display: 'flex', gap: 14, flexShrink: 0 }}>
                  {status.offerImport && (
                    <button onClick={() => setShowImport(true)} style={{
                      background: 'transparent', border: 'none', color: C.blue,
                      fontSize: 12.5, fontWeight: 700, cursor: 'pointer', padding: 0,
                    }}>Paste positions instead</button>
                  )}
                  <button onClick={sync} style={{
                    background: 'transparent', border: 'none', color: C.blue,
                    fontSize: 12.5, fontWeight: 700, cursor: 'pointer', padding: 0,
                  }}>Retry</button>
                </span>
              )}
            </div>
          </div>
        )}
      </div>

      {Store.ephemeral && (
        <div style={{ maxWidth: 1180, margin: '0 auto', padding: '12px 20px 0' }}>
          <div style={{
            border: '1px solid ' + C.amber + '44', background: C.amber + '10', color: C.amber,
            borderRadius: 8, padding: '9px 12px', fontSize: 12.5,
            display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap',
          }}>
            <span>No persistent storage available here — entries will not survive a reload.</span>
            <button onClick={() => setShowDiag(true)} style={{
              marginLeft: 'auto', background: 'transparent', border: '1px solid ' + C.amber + '55',
              color: C.amber, fontSize: 11.5, fontWeight: 700, cursor: 'pointer',
              borderRadius: 5, padding: '3px 9px',
            }}>What went wrong?</button>
          </div>
        </div>
      )}

      <div style={{ maxWidth: 1180, margin: '0 auto', padding: '22px 20px 60px' }}>
        {tab === 'dashboard' && (
          <Dashboard
            trades={sizedTrades} book={book} settings={settings} statsHistory={statsHistory}
            onOpenSettings={() => setTab('settings')}
            onEdit={setEditTrade} onEditProb={editProb} onDelete={deleteTrade}
            onSort={(id, flip) => persistSettings({ ...settings, openSort: id, openSortFlip: flip })}
          />
        )}
        {tab === 'settings' && <SettingsTab settings={settings} onChange={persistSettings} trades={trades} walletValue={walletValue} />}
      </div>

      {editWallet !== null && (
        <Modal title="Change wallet" subtitle="Your logged trades stay put — only the address positions sync from changes." onClose={() => setEditWallet(null)} width={420}>
          <Field label="Wallet address" hint="42-character 0x address.">
            <input
              value={editWallet} autoFocus onChange={(e) => setEditWallet(e.target.value)}
              style={{ ...inputStyle, fontFamily: MONO, fontSize: 13 }}
            />
          </Field>
          <div style={{ display: 'flex', gap: 10 }}>
            <Btn kind="primary" full
              disabled={!/^0x[a-fA-F0-9]{40}$/.test(editWallet.trim())}
              onClick={() => { saveWallet(editWallet.trim()); setEditWallet(null); setStatus(null); }}>
              Save
            </Btn>
            <Btn kind="ghost" onClick={() => setEditWallet(null)}>Cancel</Btn>
          </div>
        </Modal>
      )}

      {editTrade && (
        <TradeEditorModal
          trade={editTrade}
          settings={settings}
          trades={trades}
          walletValue={walletValue}
          onClose={() => setEditTrade(null)}
          onSave={(patch) => { updateTrade(editTrade.key, patch); setEditTrade(null); }}
        />
      )}

      {showImport && (
        <ImportModal
          url={apiUrl}
          onClose={() => setShowImport(false)}
          onImport={(raw) => { setShowImport(false); ingest(raw, 'Imported'); }}
        />
      )}

      {showReview && (
        <ReviewModal trades={sizedTrades} book={book} settings={settings}
          onClose={() => setShowReview(false)} onFinish={finishReview} />
      )}

      {showDiag && (
        <DiagnosticsPanel onClose={() => setShowDiag(false)}
          onBackup={backup} onRestore={restore} onClearAll={clearAll}
          backupText={backupText} onRestoreText={restoreText}
          tradeCount={trades.length} priceTracking={priceTracking} />
      )}

      {head && head.type === 'new' && (
        <NewPositionModal
          key={head.pos.key}
          pos={head.pos}
          onSave={handleNewSave}
          onSkip={handleNewIgnore}
        />
      )}

      {picker && (
        <FirstRunPicker
          positions={picker.positions}
          settledCount={picker.settledCount}
          onConfirm={handlePickerConfirm}
          onCancel={() => setPicker(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

<script>
/* Dependency loader. Each entry lists fallback URLs; the first one that
   defines its global wins. Keeps the app from silently rendering blank if a
   single CDN path moves. */
(function () {
  var DEPS = [
  {
    "name": "React",
    "global": "React",
    "urls": [
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
    ]
  },
  {
    "name": "ReactDOM",
    "global": "ReactDOM",
    "urls": [
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
    ]
  },
  {
    "name": "PropTypes",
    "global": "PropTypes",
    "urls": [
      "https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"
    ]
  },
  {
    "name": "Babel",
    "global": "Babel",
    "urls": [
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.9/babel.min.js"
    ]
  }
];

  function loadOne(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = url;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('failed: ' + url)); };
      document.head.appendChild(s);
    });
  }

  function loadDep(dep) {
    if (window[dep.global]) return Promise.resolve();
    var i = 0;
    function attempt() {
      if (i >= dep.urls.length) {
        return Promise.reject(new Error(dep.name + ' could not be loaded'));
      }
      var url = dep.urls[i++];
      return loadOne(url).then(function () {
        if (!window[dep.global]) return attempt();
      }, attempt);
    }
    return attempt();
  }

  function fail(msg) {
    document.getElementById('root').innerHTML =
      '<div class="boot"><h1>Could not start</h1><p>' + msg + '</p>' +
      '<p><code>Check your network connection, then reload. No journal data is lost — ' +
      'everything you have logged stays in storage.</code></p></div>';
  }

  DEPS.reduce(function (chain, dep) {
    return chain.then(function () { return loadDep(dep); });
  }, Promise.resolve())
    .then(function () {
      var src = document.getElementById('app-source').textContent;
      var out = Babel.transform(src, { presets: ['react'] }).code;
      var el = document.createElement('script');
      el.textContent = out;
      document.body.appendChild(el);
    })
    .catch(function (e) {
      fail((e && e.message ? e.message : String(e)) +
        '. The app needs React and Babel to render.');
    });

  window.addEventListener('error', function (ev) {
    if (document.getElementById('root').childElementCount === 0) {
      fail('Runtime error: ' + (ev.message || 'unknown'));
    }
  });
})();
</script>
</body>
</html>
