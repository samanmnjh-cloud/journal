/* ============================================================== MODALS */
function NewPositionModal({ pos, onSave, onSkip }) {
  const [prob, setProb] = useState('');
  const [mode, setMode] = useState('resolution');
  const [tgt, setTgt] = useState('');
  const [stop, setStop] = useState('');
  const [days, setDays] = useState('');
  const p = parseInt(prob, 10);
  const spike = mode === 'spike';
  const price = num(pos.currentPrice);
  const nt = parseFloat(tgt), ns = parseFloat(stop), nd = parseFloat(days);
  const spikeOk = !spike || (
    Number.isFinite(nt) && nt > price && nt <= 100 &&
    Number.isFinite(ns) && ns >= 0 && ns < price &&
    Number.isFinite(nd) && nd > 0
  );
  const valid = Number.isFinite(p) && p >= 1 && p <= 99 && spikeOk;
  const details = () => (spike
    ? { myProbability: p, mode: 'spike', exitTarget: nt, stopPrice: ns, expectedDays: nd }
    : { myProbability: p, mode: 'resolution' });

  return (
    <Modal title="New position detected" subtitle="Log your conviction before the market moves — this is what the calibration chart is built from.">
      <div style={{
        background: C.bg, border: '1px solid ' + C.border, borderRadius: 8, padding: 12, marginBottom: 18,
      }}>
        <div style={{ fontSize: 13.5, color: C.ink, lineHeight: 1.45, fontWeight: 600 }}>{pos.title}</div>
        <div style={{ display: 'flex', gap: 14, marginTop: 10, alignItems: 'center', flexWrap: 'wrap' }}>
          <OutcomeBadge outcome={pos.outcome} />
          <span style={{ fontFamily: MONO, fontSize: 12, color: C.ink3 }}>
            {num(pos.size).toLocaleString()} shares @ <span style={{ color: C.ink2 }}>{num(pos.entryPrice).toFixed(1)}¢</span>
          </span>
          <span style={{ fontFamily: MONO, fontSize: 12, color: C.ink3 }}>
            market now <span style={{ color: C.ink2 }}>{num(pos.currentPrice).toFixed(1)}¢</span>
          </span>
        </div>
      </div>

      <Field label="Trade type">
        <div style={{ display: 'flex', gap: 6 }}>
          {[
            { v: 'resolution', l: 'Hold to resolution' },
            { v: 'spike', l: 'Spike trade' },
          ].map((o) => (
            <button key={o.v} type="button" onClick={() => setMode(o.v)} style={{
              flex: 1, background: mode === o.v ? C.blue + '18' : C.bg,
              border: '1px solid ' + (mode === o.v ? C.blue : C.border),
              color: mode === o.v ? C.ink : C.ink3,
              borderRadius: 7, padding: '9px 12px', fontSize: 13, fontWeight: 600, cursor: 'pointer',
            }}>{o.l}</button>
          ))}
        </div>
      </Field>

      {spike && (
        <div style={{ background: C.bg, border: '1px solid ' + C.border, borderRadius: 8, padding: 13, marginBottom: 16 }}>
          <div style={{ fontSize: 12, color: C.ink3, marginBottom: 11, lineHeight: 1.5 }}>
            Trading the move, not the outcome. Currently {price.toFixed(1)}¢.
            {Number.isFinite(nt) && nt > price && Number.isFinite(ns) && ns < price
              ? ' Risking ' + (price - ns).toFixed(0) + '¢ to make ' + (nt - price).toFixed(0) + '¢ — '
                + ((nt - price) / Math.max(price - ns, 0.01)).toFixed(1) + ':1.'
              : ''}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 9 }}>
            <Field label="Sell at ¢">
              <input type="number" min="1" max="100" value={tgt} onChange={(e) => setTgt(e.target.value)}
                placeholder="20" style={{ ...inputStyle, fontFamily: MONO }} />
            </Field>
            <Field label="Out if wrong ¢" hint="0 = ride it down">
              <input type="number" min="0" max="99" value={stop} onChange={(e) => setStop(e.target.value)}
                placeholder="0" style={{ ...inputStyle, fontFamily: MONO }} />
            </Field>
            <Field label="Days">
              <input type="number" min="0.5" step="0.5" value={days} onChange={(e) => setDays(e.target.value)}
                placeholder="5" style={{ ...inputStyle, fontFamily: MONO }} />
            </Field>
          </div>
        </div>
      )}

      <Field
        label={spike ? 'Confidence it reaches your target' : 'My win probability'}
        hint={spike
          ? (Number.isFinite(nt) && nt > price
            ? 'How sure are you it gets from ' + price.toFixed(0) + '¢ to ' + nt.toFixed(0) + '¢? Not how it finally resolves.'
            : 'How sure are you the price reaches your sell target? Not how it finally resolves.')
          : (Number.isFinite(p) && p >= 1 && p <= 99
            ? 'Market implies ' + num(pos.entryPrice).toFixed(0) + '% · your edge: ' + (p - num(pos.entryPrice) >= 0 ? '+' : '') + (p - num(pos.entryPrice)).toFixed(0) + ' pts'
            : 'Whole number 1–99.')}>
        <input
          type="number" min="1" max="99" value={prob} autoFocus
          onChange={(e) => setProb(e.target.value)}
          placeholder={spike ? 'e.g. 90' : 'e.g. 72'}
          style={{ ...inputStyle, fontFamily: MONO, fontSize: 16 }}
        />
      </Field>

      <div style={{ display: 'flex', gap: 10, marginTop: 20 }}>
        <Btn kind="primary" full disabled={!valid}
          onClick={() => onSave(details())}>
          Save position
        </Btn>
        <Btn kind="ghost" onClick={onSkip}>Don't track</Btn>
      </div>
    </Modal>
  );
}


/* =========================================================== DASHBOARD */
/* Chart marks. Buy and sell are two categories, not good and bad, so they get
   blue and orange rather than green and red: under the commonest colour
   blindness green and red sit a colour-distance of 2 apart out of 100, and
   blue/orange sits 27 apart. Shape carries it regardless. */
const MARK = { buy: '#1F6FD0', sell: '#B4471F', line: '#4B5563' };

function PenIcon() {
  return (
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
      strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block' }}>
      <path d="M11.2 2.4a1.7 1.7 0 0 1 2.4 2.4L5.5 12.9l-3.2.8.8-3.2z" />
      <path d="M10.2 3.4l2.4 2.4" />
    </svg>
  );
}

/* What moved since the last sync, in its own column so it reads at a glance:
   the price step, where it came from and went to, and what that was worth on
   the shares held. Grey until there are two syncs to compare. */
function SinceSync({ trade, hours }) {
  const s = sinceSync(trade, hours);
  /* Fixed width, so the column lands in the same place on every row. */
  const wrap = { fontFamily: MONO, textAlign: 'right', lineHeight: 1.3, paddingRight: 20 };
  if (!s) {
    return (
      <div style={wrap} title={'Nothing to compare against yet — this fills in once there is a reading from ' +
        lookbackLabel(hours) + ' ago, or at least an earlier one.'}>
        <div style={{ fontSize: 13, color: C.ink3 }}>—</div>
      </div>
    );
  }
  const flat = Math.abs(s.dc) < 0.05;
  const col = flat ? C.ink3 : pnlColor(s.dc);
  const when = s.at ? new Date(s.at).toLocaleString('en-US',
    { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'the earliest reading';
  return (
    <div style={wrap} title={'Since ' + when + ': ' + s.from.toFixed(1) + '¢ → ' + s.to.toFixed(1) +
      '¢ on ' + num(trade.size).toLocaleString() + ' shares.'}>
      <div style={{ fontSize: 14, fontWeight: 600, color: col }}>
        {flat ? '0.0¢' : (s.dc > 0 ? '+' : '−') + Math.abs(s.dc).toFixed(1) + '¢'}
      </div>
      <div style={{ fontSize: 10.5, color: C.ink3, marginTop: 1 }}>
        {s.from.toFixed(1)} → {s.to.toFixed(1)}¢
      </div>
      <div style={{ fontSize: 12.5, color: col, marginTop: 2 }}>
        {flat ? '$0' : fmtSigned(s.dv, 0)}
      </div>
    </div>
  );
}

/* The price line with your fills on it. Everything is drawn from three
   series — price, fills, conviction — and nothing else. */
function PriceChart({ series, fills, conviction, avg, exitAt, extremes, height }) {
  const [hover, setHover] = useState(null);
  const W = 980, H = height || 230, L = 42, R = 68, T = 16, B = 26;
  if (!Array.isArray(series) || series.length < 2) return null;

  const t0 = series[0].t, t1 = series[series.length - 1].t;
  const ps = series.map((p) => p.p);
  let lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps);
  if (avg > 0) { lo = Math.min(lo, avg); hi = Math.max(hi, avg); }
  (fills || []).forEach((f) => { lo = Math.min(lo, f.price); hi = Math.max(hi, f.price); });
  (conviction || []).forEach((c) => { lo = Math.min(lo, c.value); hi = Math.max(hi, c.value); });
  const pad = Math.max((hi - lo) * 0.16, 4);
  lo = Math.max(0, lo - pad); hi = Math.min(100, hi + pad);
  const X = (t) => L + (t - t0) / Math.max(t1 - t0, 1) * (W - L - R);
  const Y = (p) => T + (1 - (p - lo) / Math.max(hi - lo, 1)) * (H - T - B);

  const path = (pts) => pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.p).toFixed(1)).join(' ');
  const full = path(series);
  const step = (hi - lo) > 45 ? 20 : (hi - lo) > 22 ? 10 : 5;
  const grid = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid.push(v);

  /* Conviction is a step function — it holds until you change it. */
  const convPath = (() => {
    const ch = (conviction || []).slice().sort((a, b) => a.t - b.t);
    if (!ch.length) return null;
    const pts = [];
    ch.forEach((c, i) => {
      const from = Math.max(c.t, t0);
      pts.push({ t: from, p: c.value });
      const to = i + 1 < ch.length ? Math.min(ch[i + 1].t, t1) : t1;
      pts.push({ t: to, p: c.value });
    });
    return path(pts.filter((p) => p.t >= t0 && p.t <= t1));
  })();

  const nearest = (mx) => {
    const t = t0 + (mx - L) / (W - L - R) * (t1 - t0);
    let best = series[0];
    series.forEach((p) => { if (Math.abs(p.t - t) < Math.abs(best.t - t)) best = p; });
    return best;
  };

  let pk = null, tr = null;
  if (extremes) {
    series.forEach((p) => {
      if (exitAt && p.t > exitAt) return;
      if (!pk || p.p > pk.p) pk = p;
      if (!tr || p.p < tr.p) tr = p;
    });
  }

  /* The stalk is the ruler: its length is the size of the fill in shares,
     measured against the biggest fill in this position. Every stalk starts on
     the price line, so the lengths can be read against each other. */
  const maxSh = Math.max.apply(null, (fills || []).map((f) => num(f.shares)).concat([1]));
  const plot = H - T - B;
  const stalkMin = 13;
  const SZ = 7;
  /* One scale for the whole chart, shrunk if a fill sits too near the top or
     bottom to draw its stalk. Shrinking everything keeps the order honest —
     clipping one stalk would make a big fill look smaller than a small one. */
  const stalkMax = (() => {
    let m = Math.min(62, Math.max(24, plot * 0.34));
    (fills || []).forEach((f) => {
      const frac = Math.min(1, num(f.shares) / maxSh);
      if (frac < 0.03) return;
      const y = Y(f.price);
      const room = (f.side === 'BUY' ? y : H - y) - SZ - 4;
      m = Math.min(m, stalkMin + (room - stalkMin) / frac);
    });
    return Math.max(stalkMin + 10, m);
  })();

  const marker = (f, i) => {
    const x = X(f.t), y = Y(f.price);
    const buy = f.side === 'BUY';
    const sz = SZ;
    const dir = buy ? -1 : 1;
    const len = stalkMin + (stalkMax - stalkMin) * Math.min(1, num(f.shares) / maxSh);
    const yy = y + dir * len;
    const c = buy ? MARK.buy : MARK.sell;
    const tri = buy
      ? [x, yy - sz * 0.62, x - sz * 0.82, yy + sz * 0.5, x + sz * 0.82, yy + sz * 0.5]
      : [x, yy + sz * 0.62, x - sz * 0.82, yy - sz * 0.5, x + sz * 0.82, yy - sz * 0.5];
    return (
      <g key={i}>
        <line x1={x} y1={y} x2={x} y2={yy} stroke={c} strokeWidth="2" opacity="0.62" />
        <circle cx={x} cy={y} r="3.4" fill={c} stroke={C.card} strokeWidth="2" />
        <polygon points={tri.map((v) => v.toFixed(1)).join(' ')} fill={c}
          stroke={C.card} strokeWidth="2" strokeLinejoin="round" />
      </g>
    );
  };

  return (
    <div style={{ position: 'relative' }}>
      <svg viewBox={`0 0 ${W} ${H}`} role="img" preserveAspectRatio="none"
        aria-label="Market price with your purchases and sales marked"
        style={{ display: 'block', width: '100%', height: H, overflow: 'visible' }}
        onMouseMove={(e) => {
          const r = e.currentTarget.getBoundingClientRect();
          const mx = (e.clientX - r.left) / r.width * W;
          if (mx < L || mx > W - R) { setHover(null); return; }
          setHover(nearest(mx));
        }}
        onMouseLeave={() => setHover(null)}>
        <defs>
          <linearGradient id="pcfade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stopColor={MARK.line} stopOpacity="0.13" />
            <stop offset="1" stopColor={MARK.line} stopOpacity="0" />
          </linearGradient>
        </defs>
        {grid.map((v) => (
          <g key={v}>
            <line x1={L} y1={Y(v)} x2={W - R} y2={Y(v)} stroke="#EDEFF3" strokeWidth="1" />
            <text x={L - 9} y={Y(v) + 4} fill="#8A8F9E" fontSize="11" fontFamily={MONO} textAnchor="end">{v}¢</text>
          </g>
        ))}
        <path d={full + ` L${X(t1).toFixed(1)} ${H - B} L${X(t0).toFixed(1)} ${H - B} Z`} fill="url(#pcfade)" />
        <path d={full} fill="none" stroke={MARK.line} strokeWidth="2"
          strokeLinejoin="round" strokeLinecap="round" opacity={exitAt ? 0.28 : 1} />
        {exitAt && (
          <g>
            <path d={path(series.filter((p) => p.t <= exitAt))} fill="none" stroke={MARK.line}
              strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
            <line x1={X(exitAt)} y1={T} x2={X(exitAt)} y2={H - B} stroke="#C4C9D2"
              strokeWidth="1" strokeDasharray="3 4" />
            <text x={X(exitAt) + 6} y={T + 11} fill="#8A8F9E" fontSize="10.5" fontFamily={MONO}>out</text>
          </g>
        )}
        {avg > 0 && (
          <g>
            <line x1={L} y1={Y(avg)} x2={W - R} y2={Y(avg)} stroke="#9AA1AE" strokeWidth="2" strokeDasharray="5 4" />
            <text x={W - R + 7} y={Y(avg) + 4} fill="#6B7280" fontSize="11.5" fontFamily={MONO}>avg {avg.toFixed(1)}¢</text>
          </g>
        )}
        {convPath && (
          <g>
            <path d={convPath} fill="none" stroke={C.amber} strokeWidth="2" strokeDasharray="2 5" opacity="0.7" />
            <text x={W - R + 7} y={Y(conviction[conviction.length - 1].value) + 4}
              fill={C.amber} fontSize="11.5" fontFamily={MONO} opacity="0.9">
              conv {num(conviction[conviction.length - 1].value)}%
            </text>
          </g>
        )}
        {pk && (
          <g>
            <circle cx={X(pk.t)} cy={Y(pk.p)} r="4" fill="none" stroke={C.green} strokeWidth="2" />
            <text x={X(pk.t)} y={Y(pk.p) - 12} fill={C.green} fontSize="11" fontFamily={MONO} textAnchor="middle">peak {pk.p.toFixed(0)}¢</text>
          </g>
        )}
        {tr && (
          <g>
            <circle cx={X(tr.t)} cy={Y(tr.p)} r="4" fill="none" stroke={C.red} strokeWidth="2" />
            <text x={X(tr.t)} y={Y(tr.p) + 20} fill={C.red} fontSize="11" fontFamily={MONO} textAnchor="middle">low {tr.p.toFixed(0)}¢</text>
          </g>
        )}
        {(fills || []).map(marker)}
        {hover && (
          <g>
            <line x1={X(hover.t)} y1={T} x2={X(hover.t)} y2={H - B} stroke="#B6BCC6" strokeWidth="1" />
            <circle cx={X(hover.t)} cy={Y(hover.p)} r="3.5" fill={C.ink} />
          </g>
        )}
        <text x={L} y={H - 7} fill="#8A8F9E" fontSize="11" fontFamily={MONO}>
          {new Date(t0).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
        </text>
        <text x={W - R} y={H - 7} fill="#8A8F9E" fontSize="11" fontFamily={MONO} textAnchor="end">
          {exitAt ? new Date(t1).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : 'today'}
        </text>
      </svg>
      {hover && (
        <div style={{
          position: 'absolute', left: `calc(${(X(hover.t) / W) * 100}% - 46px)`, top: 0,
          background: '#FFFFFF', border: '1px solid ' + C.border, borderRadius: 7, padding: '5px 9px',
          fontFamily: MONO, fontSize: 11.5, color: C.ink, pointerEvents: 'none', whiteSpace: 'nowrap',
          boxShadow: '0 4px 14px rgba(11,13,18,0.10)',
        }}>
          {hover.p.toFixed(1)}¢ · {new Date(hover.t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
        </div>
      )}
    </div>
  );
}

      {item(<svg viewBox="0 0 12 12" width="11" height="11"><polygon points="6,2 1,9 11,9" fill={MARK.buy} /></svg>, 'bought')}

    letterSpacing: 0.6, textTransform: 'uppercase', padding: '0 0 7px', borderBottom: '1px solid ' + C.border };
  const td = { textAlign: 'right', padding: '7px 0', borderBottom: '1px solid #F0F2F5', color: C.ink2 };
  return (
    <div style={{ overflowX: 'auto' }}>
      <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: MONO, fontSize: 12 }}>
        <thead><tr>
          <th style={{ ...th, textAlign: 'left' }}>Date</th>
          <th style={{ ...th, textAlign: 'left' }}>Action</th>
          <th style={th}>Shares</th><th style={th}>Price</th>
          <th style={th}>Value</th><th style={th}>Holding</th>
        </tr></thead>
        <tbody>
          {fills.map((f, i) => {
            pos += f.side === 'BUY' ? num(f.shares) : -num(f.shares);
            const buy = f.side === 'BUY';
            return (
              <tr key={i}>
                <td style={{ ...td, textAlign: 'left' }}>
                  {new Date(f.t).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
                </td>
                <td style={{ ...td, textAlign: 'left' }}>
                  <span style={{ fontSize: 10.5, padding: '1px 6px', borderRadius: 4, fontWeight: 700,
                    color: buy ? '#1F6FD0' : '#B4471F',
                    background: buy ? 'rgba(57,135,229,.15)' : 'rgba(217,89,38,.15)',
                    border: '1px solid ' + (buy ? 'rgba(57,135,229,.35)' : 'rgba(217,89,38,.38)') }}>
                    {buy ? 'BOUGHT' : 'SOLD'}
                  </span>
                </td>
                <td style={td}>{num(f.shares).toLocaleString(undefined, { maximumFractionDigits: 2 })}</td>
                <td style={td}>{num(f.price).toFixed(1)}¢</td>
                <td style={td}>{fmtMoney(num(f.shares) * num(f.price) / 100, 2)}</td>

/* Everything under a market row. Price history is fetched the first time the
   row is opened and held for the session; a closed position uses the snapshot
   taken when it closed. */
/* Why a suggestion is the number it is. Every input the engine used, in the
   order it used them, so a surprising figure can be traced on the spot instead
   of guessed at. */
function SizingBreakdown({ trade, settings }) {
  const z = trade.sizing;
  if (!z || !num(z.prob)) return null;
  const capPct = trade.overnight ? num(settings.overnightCap)
    : (trade.mode === 'spike' ? num(settings.spikeCap) : num(settings.tradeCap));
  const capName = trade.overnight ? 'overnight' : (trade.mode === 'spike' ? 'spike' : 'per trade');
  const want = num(z.want);
  const scale = num(z.scale, 1);
  /* The row's own factor already has the cap in it, so the cap is what decided
     this number when the suggestion is sitting on it. */
  const capBinds = want > num(z.cap) && num(z.suggested) >= num(z.cap) - 0.01;
  const row = (label, value, note, colour) => (
    <div key={label} style={{ display: 'grid', gridTemplateColumns: '150px auto minmax(0,1fr)',
      gap: 10, padding: '4px 0', alignItems: 'baseline' }}>
      <span style={{ fontSize: 12, color: C.ink3 }}>{label}</span>
      <span style={{ fontFamily: MONO, fontSize: 12.5, color: colour || C.ink, textAlign: 'right' }}>{value}</span>
      <span style={{ fontSize: 11.5, color: C.gray }}>{note}</span>
    </div>
  );
  return (
    <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 10,
      padding: '12px 14px 10px', marginBottom: 12 }}>
      <div style={{ fontSize: 11, letterSpacing: 1, textTransform: 'uppercase',
        color: C.ink3, fontWeight: 700, marginBottom: 8 }}>Why this size</div>
      {row('Conviction', num(z.prob) + '%',
        'less your ' + num(settings.safetyBuffer) + '-point buffer' +
        (trade.overnight ? ' and 5 more for overnight risk' : '') + ' = ' + Math.round(num(z.adjProb)) + '%')}
      {row('Edge at ' + num(trade.currentPrice).toFixed(1) + '¢',
        (num(z.adjProb) - num(trade.currentPrice) - num(settings.spread) / 2).toFixed(1) + ' pts',
        'what is left after the price and half the spread')}
      {row('Each dollar earns', (num(z.perDollar) * 100).toFixed(1) + '%',
        'the edge against the price you pay — what decides the queue')}
      {row('Certainty', num(z.cert).toFixed(3),
        'conviction above the ' + num(settings.certFloor) + '% floor, to the power of k = ' + num(settings.k))}
      {row('Time factor', '×' + num(z.tf).toFixed(2),
        fmtDays(num(z.days)) + ' to resolve, at t = ' + num(settings.timeExp, 0).toFixed(2),
        num(settings.timeExp, 0) > 0 ? null : C.gray)}
      {trade.mode === 'spike' && row('Spike haircut', '×' + num(settings.spikeHaircut).toFixed(2),
        'every spike trade is discounted again', C.orange)}
      {row('Score', num(z.score).toFixed(3), 'its place in the queue for capital')}
      <div style={{ borderTop: '1px solid ' + C.border, margin: '7px 0 5px' }} />
      {row('Kelly allows', fmtDollar0(want),
        'half Kelly on ' + num(z.rawK).toFixed(3) + ' of a ' + fmtDollar0(num(z.av)) + ' base — the ceiling')}
      {row('Your ' + capName + ' cap', fmtDollar0(num(z.cap)),
        capPct + '% of the base' + (capBinds ? ' — binding here' : ''), capBinds ? C.orange : null)}
      {scale < 0.999 && row('Share of the base', fmtPct(scale * 100, 0) + ' of that',
        'the book wants ' + fmtDollar0(num(z.want) / Math.max(scale, 1e-9) * 0 + num(z.av) / Math.max(num(z.bookScale, 1), 1e-9)) +
        ' and holds ' + fmtDollar0(num(z.av)) +
        (num(z.tilt, 1) > 1 ? ', shared at concentration ' + num(z.tilt, 1).toFixed(1) + '×' : ''), C.amber)}
      {row('Suggested', fmtDollar0(num(z.suggested)),
        capBinds ? 'clipped by the cap' : 'its share of the base', C.ink)}
    </div>
  );
}

function MarketDetail({ trade, settings }) {
  const [series, setSeries] = useState(trade.series || null);
  const [state, setState] = useState(trade.series ? 'ready' : 'idle');
  const [why, setWhy] = useState(null);

  useEffect(() => {
    if (trade.series) { setSeries(trade.series); setState('ready'); return; }
    if (!trade.asset) { setState('noid'); return; }
    let alive = true;
    setState('loading');
    const from = num(trade.openedAt) || new Date(trade.entryDate || Date.now()).getTime();
    const to = num(trade.closedAt) || Date.now();
    const from2 = from - 2 * 86400000;
    fetchPriceSeries(trade.asset, from2, to + 2 * 86400000)
      .then((pts) => {
        if (!alive) return;
        setSeries(pts);
        setState(pts ? 'ready' : 'failed');
        if (!pts) setWhy(priceFailReason(trade.asset, from2));
      })
      .catch(() => { if (alive) setState('failed'); });
    return () => { alive = false; };
  }, [trade.key]);

  const fills = Array.isArray(trade.fills) ? trade.fills : [];
  const pos = fills.length ? Engine.positionFrom(fills) : null;
  const closed = trade.status === 'closed';
  const conv = Array.isArray(trade.convictionHistory) && trade.convictionHistory.length
    ? trade.convictionHistory
    : (trade.myProbability != null
      ? [{ t: num(trade.openedAt) || new Date(trade.entryDate || Date.now()).getTime(), value: num(trade.myProbability) }]
      : []);

  const stat = (k, v, note, color) => (
    <div>
      <div style={{ fontSize: 10.5, letterSpacing: 0.7, textTransform: 'uppercase', color: C.ink3, fontWeight: 700 }}>{k}</div>
      <div style={{ fontFamily: MONO, fontSize: 17, fontWeight: 600, marginTop: 3, color: color || C.ink }}>{v}</div>
      <div style={{ fontFamily: MONO, fontSize: 11, color: C.ink3, marginTop: 2 }}>{note}</div>
    </div>
  );

  const facts = trade.facts;
  const unreal = pos && !closed ? pos.shares * (num(trade.currentPrice) - pos.avg) / 100 : 0;

  return (
    <div style={{ borderTop: '1px solid ' + C.border, background: '#F7F8FA', padding: '15px 16px 17px' }}>
      <div style={{ display: 'flex', gap: 26, flexWrap: 'wrap', marginBottom: 14 }}>
        {closed ? (
          <React.Fragment>
            {stat('Realised', fmtSigned(num(trade.pnlDollar), 2),
              (pos ? pos.buys + ' buy' + (pos.buys === 1 ? '' : 's') + ' · ' + pos.sells + ' exit' + (pos.sells === 1 ? '' : 's') : '—'),
              pnlColor(num(trade.pnlDollar)))}
            {facts && facts.capture != null && stat('Captured', Math.round(facts.capture) + '%',
              'of the ' + Math.round(facts.peak) + '¢ peak', C.amber)}
            {stat('Held', fmtDays(num(trade.holdDays)),
              num(trade.entryPrice).toFixed(1) + '¢ → ' + num(trade.exitPrice).toFixed(1) + '¢')}
            {trade.resolution && stat('Resolved', trade.resolution === 'won' ? 'Won' : 'Lost',
              'conviction was ' + (facts && facts.convictionAtEntry != null ? facts.convictionAtEntry + '%' : '—'),
              trade.resolution === 'won' ? C.green : C.red)}
          </React.Fragment>
        ) : (
          <React.Fragment>
            {stat('Unrealised', fmtSigned(unreal, 2),
              (pos ? num(pos.shares).toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' shares held' : '—'),
              pnlColor(unreal))}
            {stat('Realised', pos && pos.sells ? fmtSigned(pos.realised, 2) : '—',
              pos && pos.sells ? 'from ' + pos.sells + ' trim' + (pos.sells === 1 ? '' : 's') : 'nothing sold yet',
              pos && pos.sells ? pnlColor(pos.realised) : C.ink3)}
            {stat('Average entry', num(trade.entryPrice).toFixed(1) + '¢',
              pos ? 'from ' + pos.buys + ' purchase' + (pos.buys === 1 ? '' : 's') : '—')}
          </React.Fragment>
        )}
      </div>

      {!closed && <SizingBreakdown trade={trade} settings={settings} />}

      {state === 'ready' && series && series.length > 1 ? (
        <React.Fragment>
          <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 10,
            padding: '10px 12px 4px', marginBottom: 2 }}>
            <PriceChart series={series} fills={fills} conviction={conv}
              avg={num(trade.entryPrice)} exitAt={closed ? num(trade.closedAt) : null}
              extremes={closed} />
          </div>
          <ChartLegend hasConviction={conv.length > 0} />
        </React.Fragment>
      ) : (
        <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 10,
          padding: '26px 14px', marginBottom: 12, textAlign: 'center',
          fontFamily: MONO, fontSize: 12, color: C.ink3 }}>
          {state === 'loading' ? 'Loading price history…'
            : state === 'noid' ? 'No token id recorded for this market, so its price history cannot be fetched.'
            : 'No chart — ' + (why || 'price history is unavailable') +
              '. The transactions below are unaffected.'}
        </div>
      )}

      {fills.length ? <FillTable fills={fills} settings={settings} /> : (
        <div style={{ fontFamily: MONO, fontSize: 12, color: C.ink3, padding: '8px 0' }}>
          No transactions recorded yet — they arrive on the next sync.
        </div>
      )}

      {num(trade.priorEpisodes) > 0 && (
        <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 11 }}>
          ↺ {num(trade.priorEpisodes)} earlier position{num(trade.priorEpisodes) === 1 ? '' : 's'} in this market
          {trade.priorClosedAt ? ', last closed ' + new Date(trade.priorClosedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''}
          {' '}— kept out of the average above.
        </div>
      )}
      {num(trade.ledgerMismatch) !== 0 && (
        <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.amber, marginTop: 8 }}>
          The transactions above account for {Math.abs(num(trade.ledgerMismatch)).toFixed(0)} share
          {Math.abs(num(trade.ledgerMismatch)) === 1 ? '' : 's'} fewer than your wallet holds — the
          average price covers only the shares with a purchase behind them.
        </div>
      )}
      {trade.seriesCoarse && (
        <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 8 }}>
          Price detail is coarse — Polymarket stops serving fine-grained history once a market resolves.
        </div>
      )}
      {trade.seriesPruned && (
        <div style={{ fontFamily: MONO, fontSize: 11.5, color: C.ink3, marginTop: 8 }}>
          Over a year old — the full price path has been pruned, the outline and all the analysis facts are kept.
        </div>
      )}
    </div>
  );
}

function Dashboard({ trades, book, settings, statsHistory, onOpenSettings, onEdit, onEditProb, onDelete, onSort }) {
  const [expanded, setExpanded] = useState(null);
  const [statView, setStatView] = useState(null);
  const toggle = (k) => setExpanded((c) => (c === k ? null : k));
  const [showAllClosed, setShowAllClosed] = useState(false);
  const sortId = settings.openSort || 'attention';
  const sortFlip = !!settings.openSortFlip;
  const openRaw = trades.filter((t) => t.status === 'open');
  const lookback = num(settings.lookbackHours, 24);
  const open = useMemo(() => sortOpen(openRaw, sortId, sortFlip, lookback),
    [openRaw, sortId, sortFlip, lookback]);
  const closed = trades.filter((t) => t.status === 'closed');

  const totalPnl = closed.reduce((a, t) => a + num(t.pnlDollar), 0);
  const openPnlTotal = open.reduce((a, t) => a + openPnl(t), 0);

  /* Two different questions, kept apart.
     Made money    — did the position finish in profit? Every trade counts once,
                     however large, which is exactly its weakness.
     Profit factor — every dollar earned against every dollar lost. The only one
                     of the two that notices size.
     "Called it right" is the third, and it lives in Analytics beside the
     calibration chart, because it is scored on how the market resolved rather
     than on what you sold for. */
  const stats = statsFrom(trades);
  const profitable = stats.profitable;
  const madeMoney = stats.made;
  const grossWin = stats.grossWin;
  const grossLoss = stats.grossLoss;
  const profitFactor = stats.pf;
  const avgEq = stats.eq;

  /* Each tile carries the step since the previous sync, and opens its own
     history when tapped. */
  const TILES = {
    pf: { label: 'Profit factor', fmt: (v) => v.toFixed(2), colour: C.blue },
  };
  const deltaFor = (key, now) => {
    const r = statDelta(statsHistory, key, now, lookback);
    if (r === null) return null;
    const d = r.d;
    const sign = d > 0 ? '+' : '−';
    const t = key === 'pnl' ? sign + '$' + Math.abs(d).toFixed(2)
      : key === 'pf' ? sign + Math.abs(d).toFixed(2)
        : sign + Math.abs(d).toFixed(0) + '%';
    return { up: d > 0, text: t,
      title: 'Change over the last ' + lookbackLabel(lookback) +
        (r.at ? ', measured from ' + new Date(r.at).toLocaleString('en-US',
          { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '') + '.' };
  };
  const seriesFor = (key) => (Array.isArray(statsHistory) ? statsHistory : [])
    .filter((r) => Number.isFinite(num(r[key], NaN)))
    .map((r) => ({ t: new Date(r.t).getTime(), v: num(r[key]) }))
    .filter((p) => Number.isFinite(p.t));

  const closedSorted = closed.slice().sort((a, b) => new Date(b.exitDate) - new Date(a.exitDate));
  const recent = showAllClosed ? closedSorted : closedSorted.slice(0, 8);

  return (
    <div style={{ display: 'grid', gap: 20 }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 12 }}>
        <StatCard
          label="Profit factor"
          value={profitFactor === null ? '—'
            : profitFactor === Infinity ? '∞' : profitFactor.toFixed(2)}
          color={profitFactor === null ? C.ink3 : profitFactor >= 1 ? C.green : C.red}
          delta={deltaFor('pf', Number.isFinite(profitFactor) ? profitFactor : NaN)}
          onClick={() => setStatView('pf')}
          sub={grossLoss > 0
            ? fmtDollar0(grossWin) + ' earned per ' + fmtDollar0(grossLoss) + ' lost'
            : (grossWin > 0 ? 'nothing lost yet' : 'Awaiting first exit')}
        />
      </div>

      {open.length > 0 && <SizingCard book={book} settings={settings} onOpenSettings={onOpenSettings} />}

      <Card pad={0}>
        <div style={{ padding: '14px 16px', borderBottom: '1px solid ' + C.border, display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <h2 style={{ fontSize: 12, letterSpacing: 1.2, textTransform: 'uppercase', color: C.ink3, margin: 0, fontWeight: 700 }}>
            Open positions <span style={{ fontFamily: MONO, color: C.ink2 }}>({open.length})</span>
          </h2>
          {open.length > 0 && (
            <span style={{ fontFamily: MONO, fontSize: 13, color: C.ink3 }}>
              <span style={{ color: C.ink, fontWeight: 600 }}>
                {fmtDollar0(open.reduce((a, t) => a + num(t.size) * num(t.currentPrice) / 100, 0))}
              </span>
              {' at work · '}
              <span style={{ color: pnlColor(openPnlTotal), fontWeight: 600 }}>{fmtSigned(openPnlTotal)}</span>
              {' unrealised'}
            </span>
          )}
        </div>
        {open.length > 1 && (
          <div style={{
            display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center',
            padding: '10px 16px', borderBottom: '1px solid ' + C.border,
          }}>
            <span style={{ fontSize: 11, letterSpacing: 0.8, textTransform: 'uppercase', color: C.ink3, fontWeight: 700, marginRight: 2 }}>
              Sort
            </span>
            {OPEN_SORTS.map((o) => {
              const on = o.id === sortId;
              return (
                <button key={o.id} onClick={() => onSort(o.id, on ? !sortFlip : false)} style={{
                  background: on ? C.blue + '18' : 'transparent',
                  border: '1px solid ' + (on ? C.blue : C.border),
                  color: on ? C.ink : C.ink3,
                  borderRadius: 999, padding: '4px 10px', fontSize: 11.5, fontWeight: 600, cursor: 'pointer',
                }}>
                  {o.label}
                  {on && <span style={{ fontFamily: MONO, marginLeft: 5 }}>{sortFlip ? '▲' : '▼'}</span>}
                </button>
              );
            })}
          </div>
        )}

        {open.length === 0 ? (
          <Empty title="No open positions" note="Hit Sync to pull your live Polymarket positions into the journal." />
        ) : (
          <div>
            {open.map((t, i) => {
              const pnl = openPnl(t);
              const drift = num(t.currentPrice) - num(t.entryPrice);
              const value = openValue(t);
              return (
                <div key={t.key} style={{ borderTop: i === 0 ? 'none' : '1px solid ' + C.border }}>
                <div onClick={(e) => { if (!e.target.closest('[data-stop]')) toggle(t.key); }}
                  style={{

                            fmtPctSigned(t.sizing.returnSoFar) + ' over ' + fmtDays(t.sizing.heldDays) +
                            (t.sizing.annNowReliable ? ''

                    <span data-stop style={{ display: 'inline-flex', gap: 2, alignItems: 'center' }}>

                    <OutcomeBadge outcome={t.outcome} />

                  <div style={{ fontSize: 12, color: C.ink3, fontFamily: MONO }}>
                    {num(t.entryPrice).toFixed(1)}¢ → {num(t.exitPrice).toFixed(1)}¢ · {fmtDays(t.holdDays)}

        return (

                  </span>

              <div style={{ fontFamily: MONO, fontSize: 12.5, color: C.ink3, padding: '8px 0 4px' }}>
